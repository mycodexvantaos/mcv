packages:
  - packages/*
  - services/*
  - providers/*/*
  - apps/*
allowBuilds:
  "@apollo/protobufjs": false
  "@firebase/util": true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - postcss@8.5.10
  - uuid@11.1.1
  - "@opentelemetry/auto-instrumentations-node@0.75.0"
  - "@opentelemetry/sdk-node@0.217.0"
  - esbuild@0.28.1
  - js-yaml@4.1.2
  - "@opentelemetry/core@2.8.0"
