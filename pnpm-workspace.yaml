packages:
  - 'packages/*'
  - 'services/*'
  - 'providers/*/*'
  - 'apps/*'

# Security overrides live in package.json > pnpm.overrides (pnpm v9 merges both
# locations but package.json is the canonical source for our project).
# See Issue #81: https://github.com/mycodexvantaos/mycodexvantaos/issues/81
# See docs/security/dependency-vulnerability-remediation-v0.1.1.md for full classification

allowBuilds:
  '@apollo/protobufjs': false
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
