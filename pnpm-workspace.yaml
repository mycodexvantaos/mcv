# pnpm-workspace.yaml
# pnpm monorepo workspace configuration for mycodexvantaos platform.
# Package directory names = package short ids (5.2)
# Package names = @mycodexvantaos/<short-id> (7.1)

packages:
  - 'packages/*'
  - 'services/*'
  - 'providers/*/*'
  - 'apps/*'

# Security overrides: force safe versions of vulnerable transitive dependencies
# See Issue #81: https://github.com/mycodexvantaos/mycodexvantaos/issues/81
overrides:
  # CVE: hono JWT bypass (hono < 4.12.19) — via @modelcontextprotocol/sdk
  '@modelcontextprotocol/sdk>hono': '4.12.19'
  # CVE: fast-uri ReDoS (fast-uri < 3.1.2) — via ajv
  'ajv>fast-uri': '3.1.2'

allowBuilds:
  '@apollo/protobufjs': false
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
