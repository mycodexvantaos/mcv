# pnpm-workspace.yaml
# pnpm monorepo workspace configuration for mycodexvantaos platform.
# Package directory names = package short ids (5.2)
# Package names = @mycodexvantaos/<short-id> (7.1)

packages:
  - 'packages/*'
  - 'services/*'
  - 'providers/*/*'
  - 'apps/*'
allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
