  llm:
    - llm-native
    - llm-openai
    - llm-openrouter
    - llm-workers-ai
  observability:
    - observability-opentelemetry
  quantum-circuit:
    - quantum-circuit-native
  quantum-observability:
    - quantum-observability-native
  quantum-processor:
    - quantum-processor-native
  quantum-runtime:
    - quantum-runtime-native
  quantum-simulator:
    - quantum-simulator-qiskit
  queue:
    - queue-cloudflare
    - queue-rabbitmq
  search:
    - search-native
  secrets:
    - secrets-local
    - secrets-vault
  storage:
    - storage-minio
    - storage-r2
  vector-store:
    - vector-store-pgvector
    - vector-store-qdrant
    - vector-store-vectorize

runtime-modes:
  - native
  - connected
  - hybrid

ssot:
  spec-hierarchy:
    - docs/spec/l0-meta/formalized-specification-architecture.yaml
    - docs/spec/l1-constitution/constitution.yaml
    - docs/spec/l2-structure/capability-architecture-addendum.yaml
