  identity-policy: governance/identity-policy.yaml
  naming-policy: governance/naming-policy.schema.json
  audit-policy: governance/audit/audit-policy.yaml

ci:
  validation-entry: ci/validate-architecture.ts
  gates: unified-gates/
  workflows: .github/workflows/
  rules-count: 18
  workflow-count: 29
