apiVersion: mycodexvantaos.io/v1
kind: AIInfraGateCatalog
metadata:
  version: 1.0.0
  name: ai-infra-gate-catalog
  ssot: true
  authority: unified-gate-governance
  governanceCode: mycodexvantaos-00000
  labels:
    tier: platform
    scope: ai-infrastructure
  annotations:
    description: 'Catalog of all AI infrastructure gates for the MyCodexVantaOS platform.
      AI infrastructure gates are executable, blocking checkpoints that validate the
      readiness of AI compute, data, model, workload, billing, and supply-chain layers
      before any artifact may advance to the next lifecycle stage.

      '
spec:
  totalGates: 56
  layers:
    l00:
      name: meta-governance
      range: 01-08
      count: 8
      description: Namespace governance, naming, dependency graph, lifecycle, and
        audit evidence.
      governanceCode: mycodexvantaos-00000
    l10:
      range: 11-18
      count: 8
      description: GPU/accelerator hardware, cluster readiness, distributed training
        runtime, and cost metering.
      governanceCode: mycodexvantaos-10000
    l20:
      range: 21-28
      count: 8
      description: Dataset contracts, lineage, PII scanning, vector DB schema, embedding
        dimensions, and data quality.
      governanceCode: mycodexvantaos-40100
    l30:
      range: 31-38
      count: 8
      description: AI framework compatibility, model contracts, training pipelines,
        inference runtimes, and safety policies.
      governanceCode: mycodexvantaos-60600
    l40:
      range: 41-48
      count: 8
      description: AI workload contracts, inference/training tasks, RAG pipelines,
        agent policies, SLO, and sandbox validation.
      governanceCode: mycodexvantaos-60700
    l50:
      range: 51-58
      count: 8
      description: Usage event contracts, inference/training/embedding/agent metering,
        cost attribution, billing policy, and invoice evidence.
      governanceCode: mycodexvantaos-30400
    l60:
      range: 61-64
      count: 4
      description: Cloud infrastructure readiness, Kubernetes baseline, GitOps sync,
        and managed service SLA.
      governanceCode: mycodexvantaos-30100
    l90:
      range: 91-99
      count: 9
      description: SBOM, provenance, signatures, policy attestation, audit evidence
        chain, release/rollback readiness, compliance, and production closure.
      governanceCode: mycodexvantaos-90100
  gateSchema: ./schemas/ai-infra-gate.schema.json
  contractSchema: ./schemas/ai-workload-contract.schema.json
  executionOrder:
  - l00
  - l10
  - l20
  - l30
  - l40
  - l50
  - l60
  - l90
  blockingPolicy:
    default: true
    overrideRequiresWaiver: true
    waiverApprovalAuthority: platform-governance-council
    waiverMaxDurationDays: 30
  evidenceRequirements:
    hashAlgorithms:
    - sha-256
    - sha3-512
    - blake3
    signatureRequired: true
    attestationRequired: true
    auditChainRequired: true
