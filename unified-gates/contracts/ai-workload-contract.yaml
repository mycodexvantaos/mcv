apiVersion: mycodexvantaos.io/v1
kind: AIWorkloadContract
metadata:
  version: 1.0.0
  date: '2026-06-29'
  status: active
  name: ai-workload-contract
  governanceCode: mycodexvantaos-60700
spec:
  description: 'Defines the canonical contract for AI workload definitions. All workloads
    submitted to the platform MUST conform to this contract.

    '
  requiredFields:
  - workloadId
  - workloadType
  - namespace
  - modelRef
  - resourceLimits.cpu
  - resourceLimits.memory
  - slo.maxLatencyMs
  - slo.minAvailability
  - billingAccountId
  - workspaceId
  - projectId
  validValues:
    workloadType:
    - inference
    - training
    - embedding
    - rag
    - agent-run
    namespace:
    - mycodexvantaos
    - softwareos
  schemaRef: ../schemas/ai-workload-contract.schema.json
