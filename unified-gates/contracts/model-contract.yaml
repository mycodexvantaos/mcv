apiVersion: mycodexvantaos.io/v1
kind: ModelContract
metadata:
  version: '1.0.0'
  date: '2026-06-29'
  status: 'active'
  name: model-contract
  governanceCode: mycodexvantaos-60600
spec:
  description: >
    Defines the canonical contract for AI model artifacts. All models
    registered in the model registry MUST conform to this contract.
  requiredFields:
    - modelId
    - modelVersion
    - modelType
    - framework
    - frameworkVersion
    - inputSchema
    - outputSchema
    - minAccuracy
    - maxLatencyMs
    - modelCard
    - safetyPolicyRef
    - trainingDatasetRef
  validValues:
    modelType: [llm, embedding, classifier, regressor, diffusion, multimodal]
  schemaRef: ../schemas/model-contract.schema.json
