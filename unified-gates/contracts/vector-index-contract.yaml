apiVersion: mycodexvantaos.io/v1
kind: VectorIndexContract
metadata:
  name: vector-index-contract
  version: 1.0.0
  governanceCode: mycodexvantaos-70900
spec:
  description: >
    Defines the canonical contract for vector database indexes.
    All vector indexes MUST conform to this contract.
  requiredFields:
    - indexId
    - indexVersion
    - embeddingModelRef
    - embeddingDimension
    - distanceMetric
    - freshnessWindowHours
    - recallAtK.k
    - recallAtK.minRecall
    - maxQueryLatencyMs
    - accessPolicy
  validValues:
    distanceMetric: [cosine, euclidean, dot-product]
  schemaRef: ../schemas/vector-index.schema.json
