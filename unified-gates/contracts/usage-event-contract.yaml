apiVersion: mycodexvantaos.io/v1
kind: UsageEventContract
metadata:
  version: '1.0.0'
  date: '2026-06-29'
  status: 'active'
  name: usage-event-contract
  governanceCode: mycodexvantaos-30400
spec:
  description: >
    Defines the canonical contract for usage events emitted by AI workloads.
    All usage events MUST conform to this contract.
  requiredFields:
    - eventId
    - eventType
    - timestamp
    - workloadId
    - workspaceId
    - projectId
    - billingAccountId
    - modelId
    - usageMetrics
  validValues:
    eventType: [inference-usage, training-usage, embedding-usage, agent-run-usage]
  schemaRef: ../schemas/usage-event.schema.json
