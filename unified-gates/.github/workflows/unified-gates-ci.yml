name: Unified Gates CI

on:
  push:
    branches: [main, develop]
    paths:
      - "unified-gates/**"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-gates:
    name: Validate Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - run: python unified-gates/scripts/validate-ai-infra-gates.py
      - run: python unified-gates/scripts/validate-gate-catalog.py
      - run: python unified-gates/scripts/validate-gate-schema.py
