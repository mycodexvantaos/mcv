apiVersion: mycodexvantaos.io/v1
kind: AIBillingPolicy
metadata:
  name: ai-billing-policy
  version: 1.0.0
  governanceCode: mycodexvantaos-30400
spec:
  meteringRequired: true
  costAttributionRequired: true
  invoiceReconciliationRequired: true
  invoiceReconciliationToleranceRate: 0.0001
  tokenCountToleranceRate: 0.001
  gpuHoursToleranceRate: 0.01
  rateCardApprovalRequired: true
  billingEventRetentionDays: 2555
  mandatoryGates:
    - gate-51-usage-event-contract-validation
    - gate-56-cost-attribution-validation
    - gate-57-billing-policy-validation
    - gate-58-invoice-evidence-validation
