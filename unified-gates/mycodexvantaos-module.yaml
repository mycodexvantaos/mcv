---
# path: unified-gates/mycodexvantaos-module.yaml
# governanceCode: mycodexvantaos-00000
apiVersion: mycodexvantaos.io/v1
kind: ModuleManifest
metadata:
  version: "1.0.0"
  name: unified-gates
  version: 1.0.0
  namespace: mycodexvantaos
  domain: governance
  function: gates
  repositoryName: mycodexvantaos-governance-gates
  governanceCode: mycodexvantaos-00000
  lifecycle: active
  owner: platform-governance-council@mycodexvantaos.com
  createdAt: '2026-01-01T00:00:00Z'
  updatedAt: '2026-01-01T00:00:00Z'
  labels:
    tier: platform
    scope: unified
    plane: control-plane
  annotations:
    description: >
      Single source of truth for the MyCodexVantaOS Unified Gate System.
      Defines, catalogs, and enforces quality gates across all AI infrastructure
      layers from namespace governance through production closure.
    ssot: 'true'
    authority: unified-gate-governance

spec:
  description: >
    The unified-gates module provides the complete gate system for the
    MyCodexVantaOS AI engineering platform. It includes 44 executable gate
    definitions across 8 layers, comprehensive documentation, JSON schemas,
    governance policies, evaluation workflows, and CI validation scripts.

  entryPoints:
    catalog: ./gate-catalog.yaml
    aiInfraCatalog: ./ai-infra-gate-catalog.yaml
    index: ./unified-gate-index.yaml
    spec: ./SPEC.md
    readme: ./readme.md

  modules:
    - id: gate-documentation
      path: ./gate/
      type: documentation
      description: RST-format gate specifications (sections 1–8)

    - id: ai-infra-gates
      path: ./ai-infra-gates/
      type: executable-gates
      description: YAML gate definitions for all AI infrastructure layers (l00–l90)

    - id: contracts
      path: ./contracts/
      type: contracts
      description: Gate and artifact contract schemas in YAML

    - id: schemas
      path: ./schemas/
      type: json-schemas
      description: JSON Schema definitions for all gate artifacts

    - id: policies
      path: ./policies/
      type: policies
      description: Governance, waiver, RBAC, risk, and domain policies

    - id: workflows
      path: ./workflows/
      type: workflows
      description: Gate evaluation, release, waiver, and escalation workflows

    - id: scripts
      path: ./scripts/
      type: scripts
      description: Python scripts for gate validation, evaluation, and reporting

    - id: navigation
      path: ./navigation/
      type: navigation
      description: Dependency graph, binding mediators, and owner registry

    - id: outputs
      path: ./outputs/
      type: outputs
      description: Report output templates and generated artifacts

  ciIntegration:
    namespaceValidator: ../ci/namespace_check.py
    gateValidator: ./scripts/validate-ai-infra-gates.py
    schemaValidator: ./scripts/validate-gate-schema.py
    catalogValidator: ./scripts/validate-gate-catalog.py
    compositionValidator: ./scripts/validate-gate-composition.py
    reportGenerator: ./scripts/generate-gate-report.py
    closureReportGenerator: ./scripts/generate-production-closure-report.py
    githubWorkflow: ./.github/workflows/unified-gates-ci.yml

  gateLayers:
    - layer: l00
      codeRange: '01-08'
      domain: meta-governance
      gateCount: 8
    - layer: l10
      codeRange: '11-18'
      domain: ai-compute-infrastructure
      gateCount: 8
    - layer: l20
      codeRange: '21-28'
      domain: data-and-vector
      gateCount: 8
    - layer: l30
      codeRange: '31-38'
      domain: ai-framework-and-model
      gateCount: 8
    - layer: l40
      codeRange: '41-48'
      domain: workload-execution
      gateCount: 8
    - layer: l50
      codeRange: '51-58'
      domain: billing-and-metering
      gateCount: 8
    - layer: l60
      codeRange: '61-64'
      domain: cloud-infrastructure
      gateCount: 4
    - layer: l90
      codeRange: '91-99'
      domain: supply-chain-and-production-closure
      gateCount: 9

  normativeReferences:
    - code: mycodexvantaos-00000
      title: Namespace Governance Closure Specification
    - code: mycodexvantaos-00100
      title: Repository Naming Canonical Specification
    - code: mycodexvantaos-00200
      title: Lifecycle State Machine Specification
    - code: mycodexvantaos-00700
      title: Audit Evidence Chain Specification
    - code: mycodexvantaos-40100
      title: Dataset Contract Specification
    - code: mycodexvantaos-51000
      title: Compliance Reporting Specification
