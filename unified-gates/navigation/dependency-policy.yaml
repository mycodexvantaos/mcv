!!python/object/apply:collections.OrderedDict
- - - apiVersion
    - mycodexvantaos.io/v1
  - - kind
    - DependencyPolicy
  - - metadata
    - !!python/object/apply:collections.OrderedDict
      - - - name
          - unified-gates-dependency-policy
        - - version
          - 1.0.0
        - - governanceCode
          - mycodexvantaos-00000
        - - lifecycle
          - active
        - - owner
          - platform-governance-council@mycodexvantaos.com
  - - spec
    - !!python/object/apply:collections.OrderedDict
      - - - description
          - 'Defines the hard and soft dependency graph for the unified-gates module.
            All edges must comply with the Namespace Governance Closure Specification
            (mycodexvantaos-00000): no control-plane to product-plane hard dependencies,
            no bidirectional hard dependencies without a binding mediator, and the
            hard dependency graph must be a DAG.

            '
        - - planes
          - - !!python/object/apply:collections.OrderedDict
              - - - id
                  - mycodexvantaos
                - - type
                  - control-plane
            - !!python/object/apply:collections.OrderedDict
              - - - id
                  - softwareos
                - - type
                  - product-plane
        - - crossPlanePolicy
          - !!python/object/apply:collections.OrderedDict
            - - - controlToProductHardDep
                - forbidden
              - - productToControlHardDep
                - allowed
              - - crossPlaneBindingMediator
                - required-for-bidirectional
        - - edges
          - - !!python/object/apply:collections.OrderedDict
              - - - from
                  - mycodexvantaos-governance-gates
                - - to
                  - mycodexvantaos-compliance-reporter
                - - type
                  - soft
                - - description
                  - Compliance reports are generated by the compliance reporter service
                - - mediator
                  - false
        - - bidirectionalBindings
          - - participants:
              - mycodexvantaos-governance-gates
              - mycodexvantaos-audit-hub
              mediatorRef: ./bindings/gates-audit-hub-binding.yaml
              description: Gate evidence records are written to and read from the
                audit hub
        - - dagValidation
          - !!python/object/apply:collections.OrderedDict
            - - - enabled
                - true
              - - failOnCycle
                - true
              - - failOnControlToProductHardDep
                - true
