---
# path: unified-gates/navigation/dependency-policy.yaml
# governanceCode: mycodexvantaos-00000
apiVersion: mycodexvantaos.io/v1
kind: DependencyPolicy
metadata:
  name: unified-gates-dependency-policy
  version: 1.0.0
  governanceCode: mycodexvantaos-00000
  lifecycle: active
  owner: platform-governance-council@mycodexvantaos.com

spec:
  description: >
    Defines the hard and soft dependency graph for the unified-gates module.
    All edges must comply with the Namespace Governance Closure Specification
    (mycodexvantaos-00000): no control-plane to product-plane hard dependencies,
    no bidirectional hard dependencies without a binding mediator, and the
    hard dependency graph must be a DAG.

  planes:
    - id: mycodexvantaos
      type: control-plane
    - id: softwareos
      type: product-plane

  crossPlanePolicy:
    controlToProductHardDep: forbidden
    productToControlHardDep: allowed
    crossPlaneBindingMediator: required-for-bidirectional

  edges:
    # Gate layer dependencies (intra-module, all within control-plane)
    - from: mycodexvantaos-governance-gates
      to: mycodexvantaos-auth-service
      type: soft
      description: Gate evaluation requires authentication service for approver verification
      mediator: false

    - from: mycodexvantaos-governance-gates
      to: mycodexvantaos-policy-engine
      type: soft
      description: Gate waiver evaluation consults policy engine
      mediator: false

    - from: mycodexvantaos-governance-gates
      to: mycodexvantaos-event-bus
      type: soft
      description: Gate failure events are published to the platform event bus
      mediator: false

    - from: mycodexvantaos-governance-gates
      to: mycodexvantaos-compliance-reporter
      type: soft
      description: Compliance reports are generated by the compliance reporter service
      mediator: false

  # Bidirectional relations requiring binding mediators
  bidirectionalBindings:
    - participants:
        - mycodexvantaos-governance-gates
        - mycodexvantaos-audit-hub
      mediatorRef: ./bindings/gates-audit-hub-binding.yaml
      description: Gate evidence records are written to and read from the audit hub

  dagValidation:
    enabled: true
    failOnCycle: true
    failOnControlToProductHardDep: true
