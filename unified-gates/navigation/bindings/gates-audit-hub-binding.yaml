apiVersion: mycodexvantaos.io/v1
kind: DirectoryBinding
metadata:
  name: gates-audit-hub-binding
  version: 1.0.0
  governanceCode: mycodexvantaos-00000
  lifecycle: active
  owner: platform-governance-council@mycodexvantaos.com
spec:
  description: 'Binding mediator for the bidirectional relation between the unified-gates
    module and the mycodexvantaos-audit-hub service. Gate evidence records are written
    to the audit hub (write direction) and the audit chain validator reads from the
    audit hub to verify chain integrity (read direction). This mediator resolves the
    bidirectional hard dependency by defining explicit interface contracts for each
    direction.

    '
  participants:
    - id: mycodexvantaos-governance-gates
      role: evidence-producer
      namespace: mycodexvantaos
      plane: control-plane
    - id: mycodexvantaos-audit-hub
      role: evidence-store
      namespace: mycodexvantaos
      plane: control-plane
  interfaces:
    - direction: governance-gates -> audit-hub
      type: write
      contract: ../contracts/gate-evidence.yaml
      protocol: grpc
      endpoint: audit-hub.mycodexvantaos.svc:50051
      method: AppendEvidenceRecord
      authentication: mtls
      retryPolicy:
        maxAttempts: 3
        backoffMs: 500
    - direction: audit-hub -> governance-gates
      type: read
      contract: ../contracts/gate-evidence.yaml
      protocol: grpc
      endpoint: audit-hub.mycodexvantaos.svc:50051
      method: GetEvidenceChain
      authentication: mtls
      cachePolicy:
        ttlSeconds: 0
        strategy: no-cache
  mediatorPolicy:
    failureIsolation: true
    circuitBreakerEnabled: true
    circuitBreakerThreshold: 5
    circuitBreakerWindowSeconds: 60
