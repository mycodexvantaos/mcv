apiVersion: mycodexvantaos.io/v1
kind: AIInfraGate
metadata:
  id: gate-05-dependency-graph-acyclic-validation
  version: 1.0.0
  layer: l00
  plane: ai-infra
  blocking: true
  lifecycle: active
  criticality: critical
  owner: platform@mycodexvantaos.com
  governanceCode: mycodexvantaos-00000
  createdAt: 2026-01-01 00:00:00+00:00
  tags:
  - l00
  - dependency
  sloTarget: 30
  evidenceRetentionDays: 2555
  date: '2026-06-29'
  status: active
spec:
  description: 'Validates that the hard dependency graph across all services is a
    directed acyclic graph (DAG).

    '
  validates:
  - dimension: acyclicity
    description: Hard dependency graph is acyclic.
    checks:
    - id: chk-dag-no-cycle
      description: DFS cycle detection finds no cycles in hard dependency graph
      rule: dep-graph:acyclic
      severity: critical
      evidenceRequired: true
    - id: chk-no-control-to-product
      description: No control-plane service hard-depends on product-plane service
      rule: dep-graph:no-control-to-product-hard-dep
      severity: critical
      evidenceRequired: true
  dependsOn: []
  waiverPolicy: ./policies/gate-waiver-policy.yaml
  escalationPolicy: ./policies/gate-risk-policy.yaml
