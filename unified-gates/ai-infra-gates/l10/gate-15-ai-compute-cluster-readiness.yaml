---
apiVersion: mycodexvantaos.io/v1
kind: AIInfraGate
metadata:
  id: gate-15-ai-compute-cluster-readiness
  version: 1.0.0
  layer: l10
  plane: ai-infra
  blocking: true
  lifecycle: active
  criticality: critical
  owner: platform@mycodexvantaos.com
  governanceCode: mycodexvantaos-00000
  createdAt: 2026-01-01T00:00:00Z
  tags:
    - l10
    - ai
  sloTarget: 30
  evidenceRetentionDays: 2555
spec:
  description: >
    Validates that the AI compute cluster meets all readiness requirements before any training or inference workload is scheduled.
  validates:
    - dimension: cluster-readiness
      description: Compute cluster is ready for AI workloads.
      checks:
        - id: chk-node-health
          description: All cluster nodes pass health checks
          rule: 'health:all-nodes-healthy'
          severity: critical
          evidenceRequired: true
        - id: chk-storage-accessible
          description: Shared storage (NFS, Lustre, S3) is accessible from all nodes
          rule: 'connectivity:shared-storage'
          severity: critical
          evidenceRequired: true
        - id: chk-network-bandwidth
          description: Inter-node network bandwidth meets minimum threshold
          rule: 'threshold:network-bandwidth-gbps>=100'
          severity: high
          evidenceRequired: true
        - id: chk-scheduler-healthy
          description: Kubernetes scheduler and GPU device plugin are healthy
          rule: 'health:scheduler'
          severity: critical
          evidenceRequired: true
  dependsOn: []
  waiverPolicy: ./policies/gate-waiver-policy.yaml
  escalationPolicy: ./policies/gate-risk-policy.yaml
