---
apiVersion: mycodexvantaos.io/v1
kind: AIInfraGate
metadata:
  id: gate-13-accelerator-topology-validation
  version: 1.0.0
  layer: l10
  plane: ai-infra
  blocking: true
  lifecycle: active
  criticality: high
  owner: platform@mycodexvantaos.com
  governanceCode: mycodexvantaos-00000
  createdAt: 2026-01-01T00:00:00Z
  tags:
    - l10
    - accelerator
  sloTarget: 30
  evidenceRetentionDays: 1095
spec:
  description: >
    Validates that GPU/accelerator interconnect topology (NVLink, PCIe, InfiniBand) meets the requirements for the target distributed training workload.
  validates:
    - dimension: topology-readiness
      description: Accelerator topology meets workload requirements.
      checks:
        - id: chk-nvlink-bandwidth
          description: NVLink bandwidth meets minimum threshold for multi-GPU training
          rule: 'threshold:nvlink-bandwidth-gbps>=600'
          severity: high
          evidenceRequired: true
        - id: chk-rdma-enabled
          description: RDMA is enabled for distributed training across nodes
          rule: 'feature:rdma-enabled'
          severity: high
          evidenceRequired: true
  dependsOn: []
  waiverPolicy: ./policies/gate-waiver-policy.yaml
  escalationPolicy: ./policies/gate-risk-policy.yaml
