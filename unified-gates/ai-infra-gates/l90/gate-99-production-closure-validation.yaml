# ADR: Production closure gate is the terminal L90 gate. It PASSES only when
# all L10-L60 prerequisite layers have zero FAIL/MISSING results.
# generate-production-closure-report.py evaluates this gate programmatically;
# this YAML is the declarative specification and audit anchor.
apiVersion: mycodexvantaos.io/v1
kind: AIInfraGate
metadata:
  id: gate-99-production-closure-validation
  version: 1.0.0
  layer: l90
  plane: production-closure
  blocking: true
  lifecycle: active
  criticality: critical
  owner: platform-governance@mycodexvantaos.com
  governanceCode: mycodexvantaos-00099
  createdAt: 2026-01-01 00:00:00+00:00
  tags:
    - l90
    - production-closure
  sloTarget: 60
  evidenceRetentionDays: 2555
  date: '2026-06-29'
  status: active
spec:
  description: >
    Terminal production closure gate. Validates that all upstream gate layers
    (L10-L60) have passed before authorising a production deployment.
    A single terminal gate provides an unambiguous, machine-auditable signal
    that the full governance chain has been satisfied.
  validates:
    - dimension: prerequisite-layers
      description: All prerequisite gate layers L10-L60 must pass
      checks:
        - id: chk-l10-pass
          description: L10 core gates have all passed
          rule: layer-result:l10:PASS
          severity: critical
          evidenceRequired: true
        - id: chk-l20-pass
          description: L20 lifecycle gates have all passed
          rule: layer-result:l20:PASS
          severity: critical
          evidenceRequired: true
        - id: chk-l30-pass
          description: L30 technical gates have all passed
          rule: layer-result:l30:PASS
          severity: critical
          evidenceRequired: true
        - id: chk-l40-pass
          description: L40 execution gates have all passed
          rule: layer-result:l40:PASS
          severity: critical
          evidenceRequired: true
        - id: chk-l50-pass
          description: L50 governance gates have all passed
          rule: layer-result:l50:PASS
          severity: critical
          evidenceRequired: true
        - id: chk-l60-pass
          description: L60 domain-AI gates have all passed
          rule: layer-result:l60:PASS
          severity: critical
          evidenceRequired: true
    - dimension: policy-registration
      description: Production readiness policy includes this gate
      checks:
        - id: chk-policy-registered
          description: gate-99 is listed in production-readiness-policy.yaml requiredGates
          rule: policy-includes:gate-99-production-closure-validation
          severity: critical
          evidenceRequired: true
    - dimension: audit-trail
      description: JSONL audit trail has been emitted for all evaluated gates
      checks:
        - id: chk-audit-trail
          description: production-closure-audit.jsonl exists and is non-empty
          rule: file-exists:unified-gates/reports/production-closure-audit.jsonl
          severity: high
          evidenceRequired: true
  dependsOn:
    - gate-91-sbom-generation-validation
    - gate-92-provenance-validation
  waiverPolicy: ./policies/gate-waiver-policy.yaml
  escalationPolicy: ./policies/gate-risk-policy.yaml
