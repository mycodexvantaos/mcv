# ADR: Production closure gate is the terminal L90 gate. It PASSES only when
# all L10-L60 prerequisite layers have zero FAIL/MISSING results.
# generate-production-closure-report.py evaluates this gate programmatically;
# this YAML is the declarative specification and audit anchor.
apiVersion: mcv.mycodexvantaos.com/v1
kind: UnifiedGate
metadata:
  name: gate-99-production-closure-validation
  layer: L90
  urn: "urn:mcv:gate:gate-99-production-closure-validation"
  labels:
    layer: L90
    category: production-closure
    severity: critical
    blocking: "true"
  annotations:
    description: >
      Terminal production closure gate. Validates that all upstream gate layers
      (L10-L60) have passed before authorising a production deployment.
    rationale: >
      A single terminal gate provides an unambiguous, machine-auditable signal
      that the full governance chain has been satisfied. Without this gate,
      partial layer failures could be silently ignored during release.
    owner: platform-governance
    reviewCycle: per-release

spec:
  status: active
  enabled: true
  blocking: true
  layer: L90
  prerequisiteLayers:
    - L10
    - L20
    - L30
    - L40
    - L50
    - L60
  criteria:
    - id: all-prerequisite-layers-pass
      name: All prerequisite gate layers pass
      required: true
      met: false
      description: >
        Every gate in layers L10-L60 must have status PASS or SKIP.
        Any FAIL or MISSING result blocks production closure.
    - id: production-readiness-policy-registered
      name: production-readiness-policy.yaml registers this gate
      required: true
      met: false
      description: >
        policies/production-readiness-policy.yaml must include
        gate-99-production-closure-validation in spec.requiredGates.
    - id: audit-trail-complete
      name: JSONL audit trail emitted for all evaluated gates
      required: true
      met: false
      description: >
        unified-gates/reports/production-closure-audit.jsonl must exist
        and contain one entry per evaluated gate.
  outputs:
    reportPath: unified-gates/reports/production-closure-report.json
    auditPath: unified-gates/reports/production-closure-audit.jsonl
