---
apiVersion: mycodexvantaos.io/v1
kind: AIInfraGate
metadata:
  id: gate-24-pii-and-sensitive-data-scan
  version: 1.0.0
  layer: l20
  plane: ai-infra
  blocking: true
  lifecycle: active
  criticality: critical
  owner: platform@mycodexvantaos.com
  governanceCode: mycodexvantaos-50300
  createdAt: 2026-01-01T00:00:00Z
  tags:
    - l20
    - pii
  sloTarget: 30
  evidenceRetentionDays: 2555
spec:
  description: >
    Scans datasets for personally identifiable information (PII) and sensitive data before use in AI workloads.
  validates:
    - dimension: pii-absence
      description: Dataset contains no unmasked PII or sensitive data.
      checks:
        - id: chk-pii-scan-complete
          description: PII scan has been completed on the dataset
          rule: 'scan:pii-complete'
          severity: critical
          evidenceRequired: true
        - id: chk-pii-rate-below-threshold
          description: PII detection rate is below 0.01%
          rule: 'threshold:pii-rate<0.0001'
          severity: critical
          evidenceRequired: true
        - id: chk-no-credentials
          description: No API keys, passwords, or secrets detected
          rule: 'scan:no-credentials'
          severity: critical
          evidenceRequired: true
  dependsOn: []
  waiverPolicy: ./policies/gate-waiver-policy.yaml
  escalationPolicy: ./policies/gate-risk-policy.yaml
