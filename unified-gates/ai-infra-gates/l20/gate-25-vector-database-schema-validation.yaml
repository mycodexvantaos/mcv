apiVersion: mycodexvantaos.io/v1
kind: AIInfraGate
metadata:
  id: gate-25-vector-database-schema-validation
  version: 1.0.0
  layer: l20
  plane: ai-infra
  blocking: true
  lifecycle: active
  criticality: high
  owner: platform@mycodexvantaos.com
  governanceCode: mycodexvantaos-70900
  createdAt: 2026-01-01 00:00:00+00:00
  tags:
  - l20
  - vector
  sloTarget: 30
  evidenceRetentionDays: 1095
spec:
  description: 'Validates that vector database schemas conform to the vector index
    contract.

    '
  validates:
  - dimension: schema-conformance
    description: Vector DB schema conforms to contract.
    checks:
    - id: chk-index-contract-exists
      description: Vector index contract exists in contracts/
      rule: file-exists:contracts/vector-index-contract.yaml
      severity: high
      evidenceRequired: true
    - id: chk-collection-schema-valid
      description: Collection schema matches contract definition
      rule: schema:vector-index
      severity: high
      evidenceRequired: true
    - id: chk-metadata-fields-present
      description: Required metadata fields are present in all vectors
      rule: field:metadata-complete
      severity: medium
      evidenceRequired: false
  dependsOn: []
  waiverPolicy: ./policies/gate-waiver-policy.yaml
  escalationPolicy: ./policies/gate-risk-policy.yaml
