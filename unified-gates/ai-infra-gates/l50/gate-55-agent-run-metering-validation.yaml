---
apiVersion: mycodexvantaos.io/v1
kind: AIInfraGate
metadata:
  id: gate-55-agent-run-metering-validation
  version: 1.0.0
  layer: l50
  plane: ai-infra
  blocking: true
  lifecycle: active
  criticality: high
  owner: platform@mycodexvantaos.com
  governanceCode: mycodexvantaos-30400
  createdAt: 2026-01-01T00:00:00Z
  tags:
    - l50
    - agent
  sloTarget: 30
  evidenceRetentionDays: 1095
spec:
  description: >
    Validates that agent run usage (tool calls, LLM calls, memory operations) is accurately metered.
  validates:
    - dimension: metering-accuracy
      description: Agent run metering is accurate.
      checks:
        - id: chk-tool-calls-metered
          description: All tool calls are metered
          rule: 'metering:tool-calls-complete'
          severity: high
          evidenceRequired: true
        - id: chk-llm-calls-metered
          description: All LLM calls within agent run are metered
          rule: 'metering:llm-calls-complete'
          severity: high
          evidenceRequired: true
        - id: chk-run-id-present
          description: Agent run ID is present in all usage events
          rule: 'field-not-empty:agentRunId'
          severity: high
          evidenceRequired: true
  dependsOn: []
  waiverPolicy: ./policies/gate-waiver-policy.yaml
  escalationPolicy: ./policies/gate-risk-policy.yaml
