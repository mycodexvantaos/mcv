---
apiVersion: mycodexvantaos.io/v1
kind: AIInfraGate
metadata:
  id: gate-54-embedding-metering-validation
  version: 1.0.0
  layer: l50
  plane: ai-infra
  blocking: true
  lifecycle: active
  criticality: high
  owner: platform@mycodexvantaos.com
  governanceCode: mycodexvantaos-30400
  createdAt: 2026-01-01T00:00:00Z
  tags:
    - l50
    - embedding
  sloTarget: 30
  evidenceRetentionDays: 1095
spec:
  description: >
    Validates that embedding generation usage is accurately metered.
  validates:
    - dimension: metering-accuracy
      description: Embedding metering is accurate.
      checks:
        - id: chk-token-count-accurate
          description: Reported token count matches runtime within 0.1%
          rule: 'threshold:token-count-error<0.001'
          severity: high
          evidenceRequired: true
        - id: chk-model-id-present
          description: Embedding model ID is present
          rule: 'field-not-empty:modelId'
          severity: high
          evidenceRequired: true
  dependsOn: []
  waiverPolicy: ./policies/gate-waiver-policy.yaml
  escalationPolicy: ./policies/gate-risk-policy.yaml
