---
apiVersion: mycodexvantaos.io/v1
kind: AIInfraGate
metadata:
  id: gate-61-cloud-infra-readiness-validation
  version: 1.0.0
  layer: l60
  plane: ai-infra
  blocking: true
  lifecycle: active
  criticality: critical
  owner: platform@mycodexvantaos.com
  governanceCode: mycodexvantaos-30100
  createdAt: 2026-01-01T00:00:00Z
  tags:
    - l60
    - cloud
  sloTarget: 30
  evidenceRetentionDays: 2555
spec:
  description: >
    Validates that cloud infrastructure meets all readiness requirements before AI workloads are deployed.
  validates:
    - dimension: infra-readiness
      description: Cloud infrastructure is ready.
      checks:
        - id: chk-provider-health
          description: Cloud provider health check passes
          rule: 'health:cloud-provider'
          severity: critical
          evidenceRequired: true
        - id: chk-iam-configured
          description: IAM roles and policies are correctly configured
          rule: 'iam:roles-configured'
          severity: critical
          evidenceRequired: true
        - id: chk-network-configured
          description: VPC, subnets, and security groups are configured
          rule: 'network:vpc-configured'
          severity: high
          evidenceRequired: true
  dependsOn: []
  waiverPolicy: ./policies/gate-waiver-policy.yaml
  escalationPolicy: ./policies/gate-risk-policy.yaml
