id: "gate-10-ai-compute-cluster-readiness"
plane: "ai-infra"
lifecycle: "active"
blocking: true
layer: "compute-foundation"
owner: "infra-ops@mycodexvantaos.com"

validates:
  - dimension: "compute_nodes"
    description: "至少 2 個 GPU 工作節點處於 Ready 狀態"
    checks:
      - type: "node_count"
        operator: ">="
        threshold: 2
        labels:
          accelerator: "gpu"
          
  - dimension: "network_policies"
    description: "AI 工作負載命名空間必須有 NetworkPolicy"
    checks:
      - type: "resource_exists"
        apiVersion: "networking.k8s.io/v1"
        kind: "NetworkPolicy"
