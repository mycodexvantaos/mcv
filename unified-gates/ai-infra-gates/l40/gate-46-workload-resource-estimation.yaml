apiVersion: mycodexvantaos.io/v1
kind: AIInfraGate
metadata:
  id: gate-46-workload-resource-estimation
  version: 1.0.0
  layer: l40
  plane: ai-infra
  blocking: true
  lifecycle: active
  criticality: medium
  owner: platform@mycodexvantaos.com
  governanceCode: mycodexvantaos-60700
  createdAt: 2026-01-01 00:00:00+00:00
  tags:
  - l40
  - workload
  sloTarget: 30
  evidenceRetentionDays: 1095
spec:
  description: 'Validates that resource estimates for AI workloads are present and
    within acceptable bounds.

    '
  validates:
  - dimension: resource-estimation
    description: Resource estimates are present and reasonable.
    checks:
    - id: chk-cpu-estimate-present
      description: CPU resource estimate is present
      rule: field-not-empty:resourceEstimate.cpu
      severity: medium
      evidenceRequired: false
    - id: chk-gpu-estimate-present
      description: GPU resource estimate is present
      rule: field-not-empty:resourceEstimate.gpu
      severity: medium
      evidenceRequired: false
    - id: chk-estimate-within-quota
      description: Resource estimate is within namespace quota
      rule: resource:estimate-within-quota
      severity: medium
      evidenceRequired: false
  dependsOn: []
  waiverPolicy: ./policies/gate-waiver-policy.yaml
  escalationPolicy: ./policies/gate-risk-policy.yaml
