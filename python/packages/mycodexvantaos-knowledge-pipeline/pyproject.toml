[project]
name = "mycodexvantaos-knowledge-pipeline"
version = "0.1.0"
description = "Knowledge Pipeline - Document parsing, embedding generation, semantic clustering"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MyCodeXvantaOS Team AI", email = "ai-team@mycodexvantaos.io"},
]
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
    "sentence-transformers>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mycodexvantaos_knowledge_pipeline"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
