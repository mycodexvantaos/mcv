[project]
name = "mycodexvantaos-evaluation"
version = "0.1.0"
description = "Evaluation - AI evaluation tools, metrics, and benchmarking"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MyCodeXvantaOS Team AI", email = "ai-team@mycodexvantaos.io"},
]
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mycodexvantaos_evaluation"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
