[project]
name = "mycodexvantaos-ci-repair"
version = "0.1.0"
description = "CI Repair Engine — GitHub Actions failure analysis, error classification & repair patch generation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "NinjaTeam AI", email = "ai-team@ninjatech.ai"},
]
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mycodexvantaos_ci_repair"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
