[project]
name = "mycodexvantaos-stream-pipeline"
version = "0.1.0"
description = "Kafka stream processing engine — producers, consumers, processors with exactly-once semantics, windowing, and metrics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "NinjaTeam AI", email = "ai-team@ninjatech.ai"},
]
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "aiokafka>=0.10.0",
    "asyncpg>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mycodexvantaos_stream_pipeline"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
