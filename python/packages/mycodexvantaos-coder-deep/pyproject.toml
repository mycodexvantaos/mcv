[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycodexvantaos-coder-deep"
version = "0.1.0"
description = "Coder-Deep persistent memory, MCP context bridge, AI behavior tracking, and architecture sync for MyCodeXvantaOS"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MyCodeXvantaOS Team AI", email = "ai-team@mycodexvantaos.io"},
]
keywords = [
    "coder-deep",
    "mcp",
    "persistent-memory",
    "ai-behavior-tracking",
    "architecture-sync",
]
dependencies = [
    "pydantic>=2.0.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mycodexvantaos_coder_deep"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG"]
ignore = ["E501"]
