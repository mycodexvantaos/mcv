[project]
name = "agent-worker"
version = "0.1.0"
description = "Agent Worker CLI - Executes agent tasks (RAG, tool use, reasoning)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "NinjaTeam AI", email = "ai-team@ninjatech.ai"},
]
dependencies = [
    "pydantic>=2.9.0",
    "mycodexvantaos-agent-worker",
]

[tool.uv.sources]
mycodexvantaos-agent-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
