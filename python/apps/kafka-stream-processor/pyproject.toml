[project]
name = "kafka-stream-processor"
version = "0.1.0"
description = "Kafka Stream Processor — FastAPI service and CLI for real-time stream processing with Apache Kafka"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MyCodeXvantaOS Team AI", email = "ai-team@mycodexvantaos.io"},
]
dependencies = [
    "pydantic>=2.9.0",
    "mycodexvantaos-stream-pipeline",
    "fastapi>=0.114.0",
    "uvicorn>=0.30.0",
]

[tool.uv.sources]
mycodexvantaos-stream-pipeline = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
