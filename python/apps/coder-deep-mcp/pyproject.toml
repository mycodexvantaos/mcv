[project]
name = "coder-deep-mcp"
version = "0.1.0"
description = "Coder-Deep MCP Server — FastAPI service and CLI for persistent memory, context bridging, and AI behavior tracking"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "NinjaTeam AI", email = "ai-team@ninjatech.ai"},
]
dependencies = [
    "pydantic>=2.9.0",
    "mycodexvantaos-coder-deep",
    "fastapi>=0.114.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.0.0",
]

[tool.uv.sources]
mycodexvantaos-coder-deep = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
