[tool.uv.workspace]
members = ["packages/*", "apps/*"]
[tool.uv.sources]
mycodexvantaos-memory-dream = { workspace = true }
mycodexvantaos-agent-worker = { workspace = true }
mycodexvantaos-knowledge-pipeline = { workspace = true }
mycodexvantaos-vector-tools = { workspace = true }
mycodexvantaos-evaluation = { workspace = true }
mycodexvantaos-ci-repair = { workspace = true }
mycodexvantaos-coder-deep = { workspace = true }
agent-worker = { workspace = true }
dream-worker = { workspace = true }
knowledge-worker = { workspace = true }
ci-repair-agent = { workspace = true }
coder-deep-mcp = { workspace = true }


[project]
name = "mycodexvantaos-python"
version = "0.1.0"
description = "MyCodeXvantaOS Python Intelligence Plane — Memory Dream, Knowledge Pipeline & AI Workers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MyCodeXvantaOS Team AI", email = "ai-team@mycodexvantaos.io"},
]
keywords = [
    "memory-dream",
    "knowledge-pipeline",
    "agent-runtime",
    "ai-platform",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "coverage>=7.5.0",
]
dream = [
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
]
full = [
    "mycodexvantaos-python[dev,dream]",
    "fastapi>=0.114.0",
    "uvicorn>=0.30.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.44.0",
]

# Root workspace - no build configuration needed

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["mycodexvantaos_memory_dream", "mycodexvantaos_ci_repair", "mycodexvantaos_coder_deep", "mycodexvantaos_stream_pipeline", "mycodexvantaos_knowledge_pipeline", "mycodexvantaos_vector_tools", "mycodexvantaos_evaluation"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
