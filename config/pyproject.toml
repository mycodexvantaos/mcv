[project]
name = "mycodexvantaos-doctor"
version = "1.0.0"
description = "MyCodexVantaOS native taxonomy, module and quality auditor"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mycodexvantaos-doctor = "mycodexvantaos_doctor.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.coverage.run]
branch = true
source = ["src/mycodexvantaos_doctor"]

[tool.coverage.report]
fail_under = 90
show_missing = true
