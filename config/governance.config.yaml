!!python/object/apply:collections.OrderedDict
- - - apiVersion
    - mycodexvantaos.io/v1
  - - kind
    - GovernanceConfig
  - - metadata
    - !!python/object/apply:collections.OrderedDict
      - - - name
          - mycodexvantaos-governance-config
        - - version
          - 1.0.0
        - - date
          - '2026-06-29'
  - - spec
    - identityPolicyPath: governance/identity-policy.yaml
      namingPolicyPath: governance/naming-policy.schema.json
      capabilitySetPath: governance/capability-set.yaml
      providerRegistryPath: governance/provider-registry.yaml
      runtimeModePolicyPath: governance/runtime-mode-policy.yaml
      serviceCatalogPath: platform/service-catalog.yaml
  - - policies
    - identity: governance/identity-policy.yaml
      platform: governance/platform-governance-spec.yaml
      naming: governance/naming-policy.schema.json
      audit: governance/audit/audit-policy.yaml
      hash: governance/hash-policy.yaml
      runtime-mode: governance/runtime-mode-policy.yaml
      service-tier: governance/service-tier-policy.yaml
      exceptions: governance/exceptions.yaml
  - - audit
    - enabled: true
      retention:
        days: 365
        minimum-days: 90
      chain:
        algorithm: SHA-256
        immutable: true
      events:
      - governance-policy-change
      - identity-policy-change
      - provider-registration
      - module-registration
      - gate-evaluation
      - release-promotion
      - exception-grant
      - exception-revoke
      evidence:
        required: true
        schema: governance/audit/audit-evidence.schema.json
  - - exceptions
    - registry: governance/exceptions.yaml
      require-approval: true
      max-duration-days: 90
      review-cycle-days: 30
  - - ssot
    - registry: governance/ssot-registry.yaml
      drift-detection: true
      drift-threshold: 0
  - - quantum
    - bridge: governance/quantum-classical-bridge.yaml
      enabled: true
  - - reports
    - output-dir: governance/reports
      formats:
      - json
      - yaml
      retention-days: 90
