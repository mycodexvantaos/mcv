<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyCodeXvantaOS Console</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --color-bg: #0f1117;
        --color-surface: #1a1d27;
        --color-border: #2d3140;
        --color-primary: #6366f1;
        --color-primary-hover: #818cf8;
        --color-text: #e2e8f0;
        --color-text-muted: #94a3b8;
        --color-success: #22c55e;
        --color-warning: #f59e0b;
        --color-error: #ef4444;
        --radius: 8px;
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      html,
      body {
        height: 100%;
        font-family: var(--font-sans);
        background: var(--color-bg);
        color: var(--color-text);
      }
      body {
        display: grid;
        grid-template-columns: 220px 1fr;
        grid-template-rows: 56px 1fr;
      }

      /* Header */
      header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        padding: 0 24px;
        background: var(--color-surface);
        border-bottom: 1px solid var(--color-border);
      }
      header h1 {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      header .badge {
        margin-left: 12px;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 12px;
        background: var(--color-primary);
        color: #fff;
      }

      /* Sidebar */
      aside {
        background: var(--color-surface);
        border-right: 1px solid var(--color-border);
        padding: 16px 0;
        overflow-y: auto;
      }
      .nav-link {
        display: block;
        padding: 10px 20px;
        color: var(--color-text-muted);
        text-decoration: none;
        font-size: 14px;
        transition: all 0.15s;
      }
      .nav-link:hover,
      .nav-link.active {
        color: var(--color-text);
        background: rgba(99, 102, 241, 0.1);
        border-left: 3px solid var(--color-primary);
      }

      /* Main */
      main {
        padding: 32px;
        overflow-y: auto;
      }
      main h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 24px;
      }

      /* Stats Grid */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
      }
      .stat-card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        padding: 20px;
      }
      .stat-card h3 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--color-text-muted);
      }
      .stat-card p {
        font-size: 28px;
        font-weight: 700;
        margin-top: 8px;
      }

      /* Service Categories */
      .service-categories {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }
      .category-card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        padding: 20px;
        transition: border-color 0.15s;
      }
      .category-card:hover {
        border-color: var(--color-primary);
      }
      .cat-icon {
        font-size: 24px;
      }
      .category-card h3 {
        font-size: 16px;
        margin-top: 12px;
      }
      .category-card p {
        font-size: 13px;
        color: var(--color-text-muted);
        margin-top: 6px;
      }

      /* Action Bar */
      .action-bar {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
      }

      /* Search Bar */
      .search-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      .search-bar input {
        flex: 1;
        padding: 10px 14px;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        color: var(--color-text);
        font-size: 14px;
      }
      .search-bar input:focus {
        outline: none;
        border-color: var(--color-primary);
      }

      /* Buttons */
      button {
        padding: 10px 18px;
        background: var(--color-primary);
        color: #fff;
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 14px;
        transition: background 0.15s;
      }
      button:hover {
        background: var(--color-primary-hover);
      }

      /* Data Table */
      .data-table {
        width: 100%;
        border-collapse: collapse;
      }
      .data-table th,
      .data-table td {
        padding: 10px 14px;
        text-align: left;
        border-bottom: 1px solid var(--color-border);
        font-size: 13px;
      }
      .data-table th {
        color: var(--color-text-muted);
        font-weight: 600;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.05em;
      }
      .data-table code {
        background: rgba(99, 102, 241, 0.15);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
      }

      /* List Item */
      .list-item {
        padding: 12px 16px;
        border-bottom: 1px solid var(--color-border);
      }
      .list-item small {
        color: var(--color-text-muted);
        margin-left: 8px;
      }

      /* Result Item */
      .result-item {
        padding: 12px 16px;
        border-bottom: 1px solid var(--color-border);
      }
      .result-item .score {
        display: inline-block;
        background: var(--color-primary);
        color: #fff;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 12px;
        margin-right: 8px;
      }

      /* Chat */
      .agent-console {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 160px);
      }
      .chat-log {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius) var(--radius) 0 0;
      }
      .chat-input {
        display: flex;
        gap: 8px;
        padding: 12px;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-top: none;
        border-radius: 0 0 var(--radius) var(--radius);
      }
      .chat-input input {
        flex: 1;
        padding: 10px 14px;
        background: var(--color-bg);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        color: var(--color-text);
        font-size: 14px;
      }
      .chat-input input:focus {
        outline: none;
        border-color: var(--color-primary);
      }

      /* Responsive */
      @media (max-width: 768px) {
        body {
          grid-template-columns: 1fr;
        }
        aside {
          display: none;
        }
      }
    </style>
    <script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
  </head>
  <body>
    <header>
      <h1>MyCodeXvantaOS</h1>
      <span class="badge">Console</span>
    </header>
    <aside>
      <nav id="main-nav"></nav>
    </aside>
    <main id="main-content">
      <p>Loading...</p>
    </main>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
