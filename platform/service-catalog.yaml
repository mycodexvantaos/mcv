apiVersion: mycodexvantaos.io/v1
kind: ServiceCatalog
metadata:
  name: mycodexvantaos-service-catalog
  version: 1.0.0
  date: "2026-06-29"
  status: active
  authoritative: true
  ssot: true
  description: "Global service catalog — Single Source of Truth for all platform services"

platform: mycodexvantaos
canonical-url: "https://mycodexvantaos.com"

services:
  - service-id: mycodexvantaos-agent-runtime
    name: "Agent Runtime"
    foundation: agent-foundation
    tier: high
    capabilities:
      - llm
      - embedding
      - vector-store
    runtime-modes: [native, connected, hybrid]
    module: modules/mycodexvantaos-agent-runtime
    service: services/mycodexvantaos-agent-runtime
    status: active

  - service-id: mycodexvantaos-ai-embedding
    name: "AI Embedding"
    foundation: algorithm-foundation
    tier: high
    capabilities:
      - embedding
    runtime-modes: [native, connected, hybrid]
    module: modules/mycodexvantaos-ai-embedding
    service: services/mycodexvantaos-ai-embedding
    status: active

  - service-id: mycodexvantaos-ai-inference
    name: "AI Inference"
    foundation: algorithm-foundation
    tier: high
    capabilities:
      - llm
    runtime-modes: [native, connected, hybrid]
    module: modules/mycodexvantaos-ai-inference
    service: services/mycodexvantaos-ai-inference
    status: active

  - service-id: mycodexvantaos-billing-metering
    name: "Billing & Metering"
    foundation: business-foundation
    tier: standard
    capabilities:
      - database
      - queue
    runtime-modes: [native, connected, hybrid]
    module: modules/mycodexvantaos-billing-metering
    service: services/mycodexvantaos-billing-metering
    status: active

  - service-id: mycodexvantaos-core-auth
    name: "Core Auth"
    foundation: governance-foundation
    tier: critical
    capabilities:
      - auth
      - secrets
    runtime-modes: [native, connected, hybrid]
    module: modules/mycodexvantaos-core-auth
    service: services/mycodexvantaos-core-auth
    status: active

  - service-id: mycodexvantaos-governance-audit-chain
    name: "Governance Audit Chain"
    foundation: governance-foundation
    tier: critical
    capabilities:
      - database
      - storage
    runtime-modes: [native, connected, hybrid]
    module: modules/mycodexvantaos-governance-audit-chain
    service: services/mycodexvantaos-governance-audit-chain
    status: active

  - service-id: mycodexvantaos-governance-policy-engine
    name: "Governance Policy Engine"
    foundation: governance-foundation
    tier: critical
    capabilities:
      - database
      - cache
    runtime-modes: [native, connected, hybrid]
    module: modules/mycodexvantaos-governance-policy-engine
    service: services/mycodexvantaos-governance-policy-engine
    status: active

  - service-id: mycodexvantaos-knowledge-ingestion
    name: "Knowledge Ingestion"
    foundation: data-foundation
    tier: standard
    capabilities:
      - embedding
      - vector-store
      - database
      - queue
    runtime-modes: [native, connected, hybrid]
    module: modules/mycodexvantaos-knowledge-ingestion
    service: services/mycodexvantaos-knowledge-ingestion
    status: active

  - service-id: mycodexvantaos-knowledge-search
    name: "Knowledge Search"
    foundation: data-foundation
    tier: high
    capabilities:
      - vector-store
      - search
    runtime-modes: [native, connected, hybrid]
    module: modules/mycodexvantaos-knowledge-search
    service: services/mycodexvantaos-knowledge-search
    status: active

  - service-id: mycodexvantaos-quantum-controller
    name: "Quantum Controller"
    foundation: compute-foundation
    tier: experimental
    capabilities:
      - quantum-runtime
      - quantum-circuit
      - quantum-observability
    runtime-modes: [native, hybrid]
    module: modules/mycodexvantaos-quantum-controller
    service: services/mycodexvantaos-quantum-controller
    status: experimental

  - service-id: mycodexvantaos-runtime-mode-resolver
    name: "Runtime Mode Resolver"
    foundation: contract-foundation
    tier: standard
    capabilities:
      - validation
    runtime-modes: [native, connected, hybrid]
    module: modules/mycodexvantaos-runtime-mode-resolver
    service: services/mycodexvantaos-runtime-mode-resolver
    status: active

statistics:
  total-services: 11
  by-tier:
    critical: 3
    high: 4
    standard: 3
    experimental: 1
  by-foundation:
    agent-foundation: 1
    algorithm-foundation: 2
    business-foundation: 1
    governance-foundation: 3
    data-foundation: 2
    compute-foundation: 1
    contract-foundation: 1
