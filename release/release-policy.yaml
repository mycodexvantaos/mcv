apiVersion: mycodexvantaos.io/v1
kind: ReleasePolicy
metadata:
  name: release-policy
  version: 1.0.0
  date: '2026-06-29'
  status: active
spec:
  requiredGates:
  - architecture-validation
  - foundation-validation
  - navigation-validation
  - namespace-governance-validation
  - unified-gates-validation
  - provider-capability-validation
  hashPolicy:
    primaryDigest: sha3-512
    auditChainDigest: sha256
    fastComparisonDigest: blake3
  imagePinningRequired: true
  sbomRequired: true
  provenanceRequired: true
platform: mycodexvantaos
canonical-url: https://mycodexvantaos.com
