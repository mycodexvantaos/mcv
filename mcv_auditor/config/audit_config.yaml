platform: mycodexvantaos
canonical_url: https://mycodexvantaos.com
doc_id: IM-MCV-002
version: 1.0.0
session:
  model: ${AUDIT_MODEL:-gpt-4o}
  timeout_seconds: 30
  max_retries: 3
  temperature: 0.0
  max_tokens: 2048
phases:
- 0
- 1
- 2
- 3
- 4
- 5
thresholds:
  guardrail_f1_minimum: 0.9
  prompt_score_minimum: 0.8
  tool_score_minimum: 0.85
report:
  output_dir: outputs
  formats:
  - json
  - markdown
  include_passing: true
  include_evidence: true
forbidden_url_patterns:
- '*.github.io'
- '*.pages.dev'
- '*.vercel.app'
- '*.netlify.app'
- '*.run.app'
- '*.appspot.com'
- '*.cloudfunctions.net'
- '*.web.app'
- '*.firebaseapp.com'
- storage.googleapis.com
