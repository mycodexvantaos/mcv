service:
  name: mycodexvantaos-ai-embedding
  version: v1.0.0
  environment: production
server:
  host: 0.0.0.0
  port: 8080
  readTimeout: 30s
  writeTimeout: 30s
  idleTimeout: 120s
logging:
  level: info
  format: json
  outputs:
  - stdout
  fields:
    service: mycodexvantaos-ai-embedding
metrics:
  enabled: true
  port: 9090
  path: /metrics
healthCheck:
  enabled: true
  endpoint: /health
  interval: 30s
  timeout: 5s
features:
  cacheEnabled: true
  rateLimitingEnabled: true
  auditLoggingEnabled: true
