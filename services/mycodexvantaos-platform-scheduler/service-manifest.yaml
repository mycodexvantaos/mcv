apiVersion: mycodexvantaos.org/v1
kind: ServiceManifest
metadata:
  name: mycodexvantaos-platform-scheduler
  namespace: mycodexvantaos
  labels:
    app.kubernetes.io/name: mycodexvantaos-platform-scheduler
    app.kubernetes.io/part-of: mycodexvantaos
    app.kubernetes.io/version: v1.0.0
    layer: Native Services
    capability: scheduler
  annotations:
    governance.mycodexvantaos.org/spec: platform-governance-spec-v1.0.0
    governance.mycodexvantaos.org/last-audit-date: 2026-05-04 11:33:07+00:00
spec:
  serviceName: mycodexvantaos-platform-scheduler
  serviceVersion: v1.0.0
  layer: Native Services
  capability: scheduler
  description: MyCodeXvantaOS mycodexvantaos-platform-scheduler service
  category: platform
  healthCheck:
    enabled: true
    endpoint: /health
    interval: 30s
    timeout: 5s
    failureThreshold: 3
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  env:
  - name: NODE_ENV
    value: production
  - name: LOG_LEVEL
    value: info
  dependencies:
  - name: mycodexvantaos-core-kernel
    required: true
  - name: mycodexvantaos-core-config
    required: true
  security:
    serviceAccountName: mycodexvantaos-platform-scheduler
    rbac:
      enabled: true
  observability:
    metrics:
      enabled: true
      port: 9090
      path: /metrics
    tracing:
      enabled: true
      samplingRate: 0.1
    logging:
      level: info
      format: json
