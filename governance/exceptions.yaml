apiVersion: mycodexvantaos.io/v1
kind: ExceptionRegistry
metadata:
  name: mycodexvantaos-exceptions
  version: 1.0.0
  date: "2026-06-29"
  status: active

# Active exceptions
exceptions: []

# Exception schema
# Each exception must have:
# - id: unique exception identifier (EXC-YYYYMMDD-NNN)
# - rule: the governance rule being excepted
# - reason: justification for the exception
# - approved-by: approver identity
# - approved-at: ISO 8601 timestamp
# - expires-at: ISO 8601 timestamp (max 90 days from approval)
# - scope: specific files or patterns affected
# - review-date: scheduled review date

# Example exception (commented out):
# - id: EXC-20260629-001
#   rule: naming-rule
#   reason: "Legacy compatibility requirement for external integration"
#   approved-by: platform-governance-team
#   approved-at: "2026-06-29T00:00:00Z"
#   expires-at: "2026-09-27T00:00:00Z"
#   scope:
#     - legacy/old-module-name/
#   review-date: "2026-07-29"
#   status: active

# Expired exceptions (historical record)
expired: []

# Revoked exceptions (historical record)
revoked: []
