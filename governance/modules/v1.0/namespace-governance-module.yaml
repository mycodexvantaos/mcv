      securityNamespace:
        - mycodexvantaos-50100
        - mycodexvantaos-50200
        - mycodexvantaos-50300
        - mycodexvantaos-50400
        - mycodexvantaos-50500
        - mycodexvantaos-50600
        - mycodexvantaos-50700
        - mycodexvantaos-50800
        - mycodexvantaos-50900
        - mycodexvantaos-51000

    eraThree:
      intentNamespace:
        - mycodexvantaos-60100
        - mycodexvantaos-60200
        - mycodexvantaos-60300
        - mycodexvantaos-60400
        - mycodexvantaos-60500
        - mycodexvantaos-60600
        - mycodexvantaos-60700
