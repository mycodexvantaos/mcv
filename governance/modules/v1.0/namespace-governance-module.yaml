  controlledVocabulary:
    namespaces:
      - mycodexvantaos
      - softwareos

    domains:
      - auth
      - policy
      - memory
      - event
      - infra
      - platform
      - iaops
      - machinenativeops
      - toolkit
      - contracts
      - signerd
      - controller
      - rolloutd
      - db-schemas
      - autotask
      - compliance
      - prediction
      - qa
      - rollback
      - scheduler
      - alertd

    functions:
      - service
      - agent
      - sdk
      - cli
      - web
      - api
      - worker
      - manager
      - hub
      - bus
      - engine
      - scanner
      - reporter
      - predictor
      - action
      - plugin
      - controller
      - repository

    lifecycleStages:
      - proposed
      - active
      - deprecated
      - archived
      - destroyed

    atomicCategories:
      - platform
      - repository
      - service
      - api
      - contract
      - schema
      - event
      - policy
      - audit
      - metric
      - log
      - trace
      - identity
      - permission
      - secret
      - key
      - registry
      - catalog
      - workflow
      - state-machine
      - task
      - agent
      - model
      - memory
      - vector
      - embedding
      - dataset
      - provider
      - adapter
      - gateway
      - controller
      - runtime

  repositoryGovernance:
    pattern: '{namespace}-{domain}-{function}'
    regex: '^(?:mycodexvantaos|softwareos)-[a-z0-9]+(?:-[a-z0-9]+)*-[a-z0-9]+(?:-[a-z0-9]+)*$'
    constraints:
      lowercaseOnly: true
      kebabCaseOnly: true
      versionInName: forbidden
      environmentMarkerInName: forbidden
      domainMustBeControlledVocabulary: true
      functionMustBeControlledVocabulary: true

  automationTaskAlignment:
    required: true
    tasks:
      - task: event-triggered-rollback
        domain: rollback
        function: engine
        repository: mycodexvantaos-rollback-engine
        responsibility: listens-to-events-and-triggers-rollback-according-to-policy

      - task: compliance-scan
        domain: compliance
        function: scanner
        repository: mycodexvantaos-compliance-scanner
        responsibility: scans-system-state-and-validates-compliance-policies

      - task: compliance-report-generation
        domain: compliance
        function: reporter
        repository: mycodexvantaos-compliance-reporter
        responsibility: converts-scan-results-into-reports-and-notifications

      - task: hardware-failure-prediction
        domain: prediction
        function: predictor
        repository: mycodexvantaos-prediction-predictor
        responsibility: predicts-hardware-failures-from-telemetry-and-alerts

      - task: knowledge-question-answering
        domain: qa
        function: service
        repository: softwareos-qa-service
        responsibility: provides-rag-based-natural-language-query-interface

      - task: automation-task-execution
        domain: autotask
        function: engine
        repository: mycodexvantaos-autotask-engine
        responsibility: executes-governed-automation-tasks

      - task: task-scheduling
        domain: scheduler
        function: service
        repository: mycodexvantaos-scheduler-service
        responsibility: schedules-automation-jobs

      - task: alert-routing
        domain: alertd
        function: service
        repository: mycodexvantaos-alertd-service
        responsibility: routes-alerts-to-services-and-humans

    mediators:
      - contracts/events/automation-event.yaml
      - contracts/events/rollback-request.yaml
      - contracts/events/compliance-finding.yaml
      - contracts/events/prediction-alert.yaml
      - contracts/events/audit-evidence.yaml
      - navigation/bindings/automation-task-binding.yaml
      - governance/policies/automation-policy.yaml
      - platform/service-catalog.yaml

  lifecycle:
    current: active
    stages:
      proposed:
        duration: 7d
        requiredActions:
          - validation
          - approval

      active:
        duration: indefinite
        monitoring:
          - health-check
          - compliance-audit
        optimization:
          - cost-optimization
          - performance-tuning

      deprecated:
        duration: 90d
        requiredActions:
          - migration-notification
          - compatibility-layer

      archived:
        duration: retention-period
        access:
          - read-only
          - restricted

      destroyed:
        finalState: true
        verification:
          - certificate-of-destruction

    transitionRules:
      - from: active
        to: deprecated
        condition: inactivity-period-exceeded

      - from: deprecated
        to: archived
        condition: migration-complete

      - from: archived
        to: destroyed
        condition: retention-period-expired

    destroyedIdentifierReuse: forbidden
    transitionAuditRequired: true

  registries:
    required:
      - namespace-registry
      - repository-registry
      - governance-code-registry
      - automation-task-registry
      - owner-registry
      - service-registry
      - provider-registry

    behavior:
      - validate
      - conflict-check
      - code-assignment
      - immutable-store
      - hierarchy-update
      - governance-event-emit
      - audit-write

    storageMode: immutable-or-append-only

  approvalWorkflow:
    stages:
      - request
      - validation
      - conflict-detection
      - approval
      - registration
      - activation
      - monitoring

    authority:
      era-one: development-team-owner
      era-two: architecture-governance-owner
      era-three: governance-council-owner
      cross-era-governance: joint-governance-approval
      meta-governance: platform-governance-root-authority

  crossEraMapping:
    governedBy: mycodexvantaos-90100
    runtimeHardDependenciesBetweenEras: forbidden
    approvedMediators:
      - contracts
      - schemas
      - registries
      - catalogs
      - binding-manifests
      - compatibility-layers
      - migration-paths
    transformationEngine:
      name: mycodexvantaos-namespace-transformer
      capabilities:
        - automatic-namespace-mapping
        - semantic-similarity-calculation
        - conflict-detection-and-resolution
        - bidirectional-transformation

  closure:
    model: l0-l1-l2-termination
    terminationLayers:
      - id: l0
        name: atomic-naming-layer
        mutability: immutable
        responsibility: defines-base-atomic-categories

      - id: l1
        name: specification-naming-layer
        mutability: governed-mutable
        responsibility: defines-category-specific-naming-specifications

      - id: l2
        name: meta-naming-layer
        mutability: termination-layer
        responsibility: defines-how-l1-specifications-are-named-and-changed

    prover:
      required: true
      validates:
        - completeness
        - consistency
        - termination
        - self-reference-closure
        - non-recursive-authority

  dependencyAndBindingGovernance:
    bindingMediatorRequiredForBidirectionalLogicalRelations: true
    hardDependencyGraphMustBeAcyclic: true
    controlPlaneHardDependsOnProductPlaneRuntime: forbidden
    dependencyPolicy: navigation/dependency-policy.yaml
    dependencyGraph: navigation/dependency-graph.yaml
    directoryBindings: navigation/bindings
    dependencyExceptions: governance/exceptions/dependency-exceptions.yaml

  metrics:
    namespaceHealth:
      - metric: namespace-uniqueness-score
        target: '100%'

      - metric: namespace-consistency-score
        target: '>95%'

      - metric: namespace-utilization-rate
        target: '>85%'

      - metric: namespace-conflict-count
        target: '0'

      - metric: namespace-lifecycle-health
        target: '100%'

      - metric: namespace-governance-compliance
        target: '100%'

      - metric: namespace-cost-optimization-rate
        target: '>20%'

  ci:
    requiredValidators:
      - scripts/validate-naming.py
      - scripts/validate-registry.py
      - scripts/validate-lifecycle.py
      - scripts/validate-cross-era-mapping.py
      - scripts/validate-closure.py
      - scripts/validate-directory-bindings.py
      - scripts/validate-dependency-graph.py

    requiredReports:
      - outputs/naming-report.json
      - outputs/registry-report.json
      - outputs/lifecycle-report.json
      - outputs/closure-report.json
      - outputs/dependency-binding-report.json
      - outputs/ci-governance-summary.json

    mustValidate:
      - repository-name-pattern
      - namespace-registration
      - controlled-domain-vocabulary
      - controlled-function-vocabulary
      - governance-code-regex
      - no-space-based-governance-code
      - no-environment-marker-in-name
      - no-version-number-in-name
      - valid-lifecycle-status
      - valid-cross-era-mapping
      - valid-binding-mediator
      - acyclic-hard-dependency-graph
      - valid-governance-exception-file
      - destroyed-identifier-not-reused

    mustFailWhen:
      - repository-name-violates-naming-rule
      - governance-code-uses-spaces
      - governance-code-malformed
      - namespace-unregistered
      - domain-or-function-unknown
      - bidirectional-hard-dependency-detected
      - binding-mediator-missing
      - lifecycle-transition-invalid
      - destroyed-namespace-reused

  compliance:
    criteria:
      - all-governance-codes-use-mycodexvantaos-00000-style-identifiers
      - all-repository-names-follow-namespace-domain-function-pattern
      - all-machine-facing-names-are-lowercase-kebab-case
      - all-namespace-planes-are-classified
      - all-domains-and-functions-are-controlled-vocabularies
      - all-automation-tasks-map-to-domain-and-function
      - namespace-lifecycle-is-enforced
      - namespace-registry-is-immutable-or-append-only
      - cross-era-mapping-is-machine-readable
      - reverse-control-plane-dependency-on-product-plane-runtime-is-forbidden
      - binding-mediator-pattern-is-used-for-bidirectional-logical-relations
      - governance-metrics-are-produced
      - ci-validates-naming-lifecycle-registry-and-dependency-rules
      - destroyed-namespace-identifiers-are-never-reused
      - closure-prover-validates-completeness-consistency-termination-and-self-reference-closure

  references:
    foundationModule: foundation/mycodexvantaos-module.yaml
    navigationModule: navigation/mycodexvantaos-module.yaml
    namespaceGovernanceArchitecture: docs/architecture/namespace-governance-architecture-panorama.md
    appendices:
      - id: appendix-i
        title: namespace-governance-closure-specification
        path: docs/governance/namespace-governance-closure-spec.md

      - id: appendix-j
        title: namespace-governance-architecture-panorama-and-directory-tree
        path: docs/architecture/namespace-governance-architecture-panorama.md

      - id: appendix-h
        title: dependency-binding-guard-ci-specification
        path: docs/ci/dependency-binding-guard-ci-spec.md

      - id: appendix-k
        title: unified-gate-system-specification
        path: docs/governance/unified-gate-system-spec.md

