apiVersion: mycodexvantaos.io/v1
kind: NamespaceGovernanceModule

metadata:
  name: mycodexvantaos-module
  organization: mycodexvantaos
  title: MyCodexVantaOS Namespace Governance Module
  description: >
    Canonical namespace governance module for MyCodexVantaOS.
    This artifact formalizes the namespace governance closure system,
    repository naming governance, governance code taxonomy, namespace planes,
    lifecycle policy, registry architecture, automation task alignment,
    cross-era mapping, closure proof model, CI validation, and binding-mediator
    enforcement as a machine-readable module.
  labels:
    app.kubernetes.io/name: mycodexvantaos-module
    app.kubernetes.io/part-of: mycodexvantaos
    mycodexvantaos.io/layer: namespace-governance
    mycodexvantaos.io/module-type: governance-closure
    mycodexvantaos.io/status: active
  annotations:
    mycodexvantaos.io/spec-status: normative
    mycodexvantaos.io/naming-rule: lowercase-kebab-case
    mycodexvantaos.io/version-in-name: forbidden
    mycodexvantaos.io/environment-in-name: forbidden
    mycodexvantaos.io/closure-model: l0-l1-l2-termination
    mycodexvantaos.io/registry-mode: immutable-or-append-only

spec:
  identity:
    id: mycodexvantaos-namespace-governance-module
    namespace: mycodexvantaos
    plane: control-plane
    layer: namespace-governance
    moduleType: governance-closure
    lifecycle: active
    owner: platform-governance
    governanceCode: mycodexvantaos-00000

  naming:
    canonicalRules:
      lowercaseOnly: true
      kebabCaseOnly: true
      separator: hyphen
      forbiddenSeparators:
        - underscore
        - dot
        - space
      versionInName: forbidden
      environmentMarkerInName: forbidden

    machineIdentifier: mycodexvantaos
    brandIdentifier: MyCodexVantaOS
    repositoryPattern: '{namespace}-{domain}-{function}'
    repositoryRegex: '^(?:mycodexvantaos|softwareos)-[a-z0-9]+(?:-[a-z0-9]+)*-[a-z0-9]+(?:-[a-z0-9]+)*$'
    governanceCodePattern: '^mycodexvantaos-[0-9]{5}$'
    canonicalCodeExample: mycodexvantaos-00000
    forbiddenExamples:
      - mycodexvantaos 00000
      - mycodexvantaos_00000
      - mycodexvantaos.00000
      - mycodexvantaos-auth-service-v1
      - mycodexvantaos-auth-service-prod

  scope:
    appliesTo:
      - git-organization
      - repository-names
      - governance-codes
      - namespace-registry
      - repository-registry
      - governance-code-registry
      - automation-task-registry
      - controlled-vocabulary
      - lifecycle-policy
      - approval-workflow
      - cross-era-mapping
      - closure-prover
      - dependency-binding-mediator
      - ci-naming-validators

    canonicalPaths:
      module: mycodexvantaos-namespace-governance/mycodexvantaos-module.yaml
      spec: docs/governance/namespace-governance-closure-spec.md
      architecturePanorama: docs/architecture/namespace-governance-architecture-panorama.md
      baseline: governance/baseline/namespace-governance-baseline.yaml
      namespaceRegistry: governance/registry/namespace-registry.yaml
      repositoryRegistry: governance/registry/repository-registry.yaml
      governanceCodeRegistry: governance/registry/governance-code-registry.yaml
      automationTaskRegistry: governance/registry/automation-task-registry.yaml
      controlledVocabularies: governance/vocabularies
      lifecyclePolicy: governance/lifecycle/namespace-lifecycle-policy.yaml
      dependencyPolicy: navigation/dependency-policy.yaml
      directoryBindings: navigation/bindings
      dependencyExceptions: governance/exceptions/dependency-exceptions.yaml

  namespacePlanes:
    required: true
    planes:
      - id: mycodexvantaos
        plane: control-plane
        responsibility:
          - core-infrastructure
          - shared-governance
          - authentication-and-authorization
          - policy-and-audit
          - automation-engines
          - event-bus
          - registry-and-catalog
          - signing-and-supply-chain-services
          - runtime-control-services

      - id: softwareos
        plane: product-plane
        responsibility:
          - product-domain-platforms
          - business-facing-services
          - user-facing-apis
          - domain-specific-agents
          - product-dashboards
          - domain-knowledge-services

    dependencyRule:
      productPlaneMayDependOnControlPlaneContracts: true
      productPlaneMayDependOnControlPlaneServices: true
      controlPlaneHardDependsOnProductPlaneRuntime: forbidden
      reverseAwarenessRequiresMediator: true
      approvedReverseAwarenessMediators:
        - registry
        - catalog
        - binding-manifest
        - contract
        - evidence-channel
        - observation-channel

  governanceCodeModel:
    canonicalFormat: 'mycodexvantaos-{code}'
    regex: '^mycodexvantaos-[0-9]{5}$'
    decomposition:
      code: 'll-d-s-qq'
      fields:
        - name: ll
          width: 2
          range: '00-99'
          meaning: layer-group

        - name: d
          width: 1
          range: '0-9'
          meaning: governance-domain

        - name: s
          width: 1
          range: '0-9'
          meaning: governance-subtype

        - name: qq
          width: 2
          range: '00-99'
          meaning: rule-sequence

    eras:
      - id: meta-governance
        range: '00000-09999'
        canonicalName: meta-framework
        characteristic: immutable-baseline
        focus:
          - charter
          - lifecycle
          - inheritance
          - conflict-resolution

      - id: era-one
        range: '10000-29999'
        canonicalName: code-and-architecture-layer
        characteristic: static-structure
        focus:
          - code-organization
          - module-boundary
          - component-architecture

      - id: era-two
        range: '30000-59999'
        canonicalName: distributed-runtime-layer
        characteristic: dynamic-distributed-systems
        focus:
          - service-mesh
          - event-flow
          - data-governance
          - security

      - id: era-three
        range: '60000-89999'
        canonicalName: intent-and-autonomy-layer
        characteristic: intent-driven-systems
        focus:
          - semantic-intent
          - ai-agents
          - autonomy
          - adaptive-governance

      - id: cross-era-governance
        range: '90000-99999'
        canonicalName: cross-era-closure
        characteristic: unified-governance-loop
        focus:
          - mapping
          - migration
          - compatibility
          - archive
          - destruction

    quantumGovernancePlacement:
      avoidCollisionWith: mycodexvantaos-80100
      ranges:
        - range: '83000-84999'
          family: quantum-runtime-governance

        - range: '85000-86999'
          family: quantum-algorithm-governance

        - range: '87000-88999'
          family: quantum-classical-hybrid-governance

  governanceCodeCatalog:
    metaGovernance:
      - id: mycodexvantaos-00000
        title: namespace-governance-baseline-specification
      - id: mycodexvantaos-00100
        title: namespace-identifier-standard
      - id: mycodexvantaos-00200
        title: namespace-lifecycle-standard
      - id: mycodexvantaos-00300
        title: namespace-hierarchy-standard
      - id: mycodexvantaos-00400
        title: cross-namespace-reference-standard
      - id: mycodexvantaos-00500
        title: namespace-version-governance-standard
      - id: mycodexvantaos-00600
        title: namespace-permission-model
      - id: mycodexvantaos-00700
        title: namespace-audit-trail-standard
      - id: mycodexvantaos-00800
        title: namespace-conflict-resolution-standard
      - id: mycodexvantaos-00900
        title: namespace-migration-standard

    eraOne:
      codeNamespace:
        - mycodexvantaos-10100
        - mycodexvantaos-10200
        - mycodexvantaos-10300
        - mycodexvantaos-10400
        - mycodexvantaos-10500
        - mycodexvantaos-10600
        - mycodexvantaos-10700
        - mycodexvantaos-10800
        - mycodexvantaos-10900
        - mycodexvantaos-11000
      architectureNamespace:
        - mycodexvantaos-20100
        - mycodexvantaos-20200
        - mycodexvantaos-20300
        - mycodexvantaos-20400
        - mycodexvantaos-20500
        - mycodexvantaos-20600
        - mycodexvantaos-20700
        - mycodexvantaos-20800
        - mycodexvantaos-20900
        - mycodexvantaos-21000

    eraTwo:
      serviceNamespace:
        - mycodexvantaos-30100
        - mycodexvantaos-30200
        - mycodexvantaos-30300
        - mycodexvantaos-30400
        - mycodexvantaos-30500
        - mycodexvantaos-30600
        - mycodexvantaos-30700
        - mycodexvantaos-30800
        - mycodexvantaos-30900
        - mycodexvantaos-31000
      dataNamespace:
        - mycodexvantaos-40100
        - mycodexvantaos-40200
        - mycodexvantaos-40300
        - mycodexvantaos-40400
