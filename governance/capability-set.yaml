apiVersion: mycodexvantaos.io/v1
kind: CapabilitySet
metadata:
  name: mycodexvantaos-capability-set
  version: 1.0.0
  date: "2026-06-29"
  status: active
  authoritative: true
  spec-authority: docs/spec/l1-constitution/constitution.yaml
  description: "L1 Constitution canonical capability set — 24 capabilities"

# Canonical capability definitions
# All capability names MUST be capability-first kebab-case
# MUST NOT contain vendor prefixes
capabilities:
  - id: database
    description: Relational and document database storage
    category: data
    providers:
      - database-d1
      - database-postgres

  - id: storage
    description: Object and blob storage
    category: data
    providers:
      - storage-minio
      - storage-r2

  - id: auth
    description: Authentication and authorization
    category: security
    providers:
      - auth-jwt

  - id: queue
    description: Message queue and event streaming
    category: messaging
    providers:
      - queue-cloudflare
      - queue-rabbitmq

  - id: state-store
    description: Distributed state storage
    category: data
    providers: []

  - id: secrets
    description: Secret and credential management
    category: security
    providers:
      - secrets-local
      - secrets-vault

  - id: repo
    description: Source code repository
    category: devops
    providers: []

  - id: deploy
    description: Deployment and release management
    category: devops
    providers: []

  - id: validation
    description: Schema and policy validation
    category: governance
    providers: []

  - id: security
    description: Security scanning and enforcement
    category: security
    providers: []

  - id: observability
    description: Metrics, traces, and logs
    category: platform
    providers:
      - observability-opentelemetry

  - id: notification
    description: Notification and alerting
    category: platform
    providers: []

  - id: scheduler
    description: Task scheduling and cron
    category: platform
    providers: []

  - id: vector-store
    description: Vector embedding storage and retrieval
    category: ai
    providers:
      - vector-store-pgvector
      - vector-store-qdrant
      - vector-store-vectorize

  - id: embedding
    description: Text and multimodal embedding generation
    category: ai
    providers:
      - embedding-native
      - embedding-openai
      - embedding-workers-ai

  - id: llm
    description: Large language model inference
    category: ai
    providers:
      - llm-native
      - llm-openai
      - llm-openrouter
      - llm-workers-ai

  - id: graph
    description: Graph database and knowledge graph
    category: data
    providers:
      - graph-native

  - id: cache
    description: In-memory caching
    category: data
    providers:
      - cache-kv
      - cache-redis

  - id: search
    description: Full-text and semantic search
    category: data
    providers:
      - search-native

  - id: quantum-runtime
    description: Quantum computing runtime environment
    category: quantum
    providers:
      - quantum-runtime-native

  - id: quantum-simulator
    description: Quantum circuit simulation
    category: quantum
    providers:
      - quantum-simulator-qiskit

  - id: quantum-processor
    description: Quantum processor access
    category: quantum
    providers:
      - quantum-processor-native

  - id: quantum-circuit
    description: Quantum circuit definition and execution
    category: quantum
    providers:
      - quantum-circuit-native

  - id: quantum-observability
    description: Quantum computation observability
    category: quantum
    providers:
      - quantum-observability-native

# Validation rules
validation:
  capability-name-pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  forbidden-vendor-prefixes:
    - openai
    - anthropic
    - google
    - aws
    - azure
    - cloudflare
    - qiskit
  total-count: 24
