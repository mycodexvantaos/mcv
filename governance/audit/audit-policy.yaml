apiVersion: mycodexvantaos.io/v1
kind: AuditPolicy
metadata:
  name: mycodexvantaos-audit-policy
  version: 1.0.0
  date: "2026-06-29"
  status: active
  authoritative: true

# Audit retention
retention:
  days: 365
  minimum-days: 90
  immutable: true
  storage: governance/audit/

# Audit chain
chain:
  algorithm: SHA-256
  include-timestamp: true
  include-previous-hash: true
  include-actor: true
  include-resource: true

# Auditable events
events:
  governance:
    - governance-policy-change
    - identity-policy-change
    - exception-grant
    - exception-revoke
    - exception-expire
  providers:
    - provider-registration
    - provider-deregistration
    - provider-capability-change
  modules:
    - module-registration
    - module-deregistration
    - module-version-change
  gates:
    - gate-evaluation-start
    - gate-evaluation-complete
    - gate-evaluation-fail
    - gate-waiver-grant
    - gate-waiver-revoke
  releases:
    - release-candidate-created
    - release-promoted
    - release-rolled-back
    - release-rejected
  security:
    - security-scan-complete
    - vulnerability-detected
    - secret-exposure-detected
    - forbidden-url-detected
  auth:
    - user-login
    - user-logout
    - api-key-created
    - api-key-revoked
    - permission-change

# Evidence requirements
evidence:
  required-for:
    - gate-evaluation
    - release-promotion
    - exception-grant
    - governance-policy-change
  schema: governance/audit/audit-evidence.schema.json
  storage: governance/audit/

# Compliance
compliance:
  standards:
    - SOC2-Type2
    - ISO27001
  audit-log-integrity: cryptographic-hash-chain
  tamper-detection: true
