canonical_identifiers:
  service_id:
    format: mycodexvantaos-<domain>-<capability>[-<sub_capability>]
    regex: ^mycodexvantaos-[a-z0-9]+(?:-[a-z0-9]+)+$
    ci_rule_file: ci/rules/service-id.rule.ts
    enforcement: hard
    constraints:
    - "\u5FC5\u9808\u4EE5 mycodexvantaos- \u70BA\u524D\u7DB4"
    - "domain + capability \u81F3\u5C11\u5169\u6BB5"
    - "\u4E0D\u542B\u7248\u672C\u865F"
    - "\u4E0D\u542B\u74B0\u5883\u6A19\u8A18"
    valid_examples:
    - mycodexvantaos-ai-embedding
    - mycodexvantaos-core-auth
    - mycodexvantaos-quantum-controller
    invalid_examples:
    - value: mycodexvantaos-ai
      reason: "\u50C5\u4E00\u6BB5 domain"
    - value: mycodexvantaos-ai-embedding-v2
      reason: "\u542B\u7248\u672C\u865F"
    - value: mycodexvantaos-ai-embedding-prod
      reason: "\u542B\u74B0\u5883\u6A19\u8A18"
    - value: mycodexvantaos_ai_embedding
      reason: "\u5E95\u7DDA\u4E0D\u5141\u8A31"
  package_short_id:
    format: <domain>-<capability>[-<sub_capability>]
    derivation: service_id.removePrefix('mycodexvantaos-')
    regex: ^[a-z0-9]+(?:-[a-z0-9]+)+$
  k8s_resource_name:
    derivation: service_id
    note: "\u6240\u6709 base manifest \u7684 metadata.name \u56B4\u683C\u7B49\u65BC\
      \ service_id"
    ci_rule_file: ci/rules/manifest-name.rule.ts
    enforcement: hard
  canonical_capability_set:
    source_of_truth: governance/capability-set.yaml
    ci_rule_file: ci/rules/capability-id.rule.ts
    enforcement: hard
    regex: '^(database|storage|auth|queue|state-store|secrets|repo|deploy| validation|security|observability|notification|scheduler|vector-store|
      embedding|llm|graph|cache|search)$

      '
    values:
    - database
    - storage
    - auth
    - queue
    - state-store
    - secrets
    - repo
    - deploy
    - validation
    - security
    - observability
    - notification
    - scheduler
    - vector-store
    - embedding
    - llm
    - graph
    - cache
    - search
    - ai-ethics
    - blockchain
    - event-stream
protocol_specific_identifiers:
  package_name:
    format: '@mycodexvantaos/<package_short_id>'
    regex: ^@mycodexvantaos/[a-z0-9]+(?:-[a-z0-9]+)+$
    ci_rule_file: ci/rules/package-name.rule.ts
    enforcement: hard
  env_var:
    format: MYCODEXVANTAOS_<SUBSYSTEM>_<KEY>
    regex: ^MYCODEXVANTAOS_[A-Z0-9_]+$
    forbidden_prefix: ORCH_
    ci_rule_file: ci/rules/env-var.rule.ts
    enforcement: hard
    valid_examples:
    - MYCODEXVANTAOS_DATABASE_URL
    - MYCODEXVANTAOS_AUTH_JWT_SECRET
    - MYCODEXVANTAOS_QUANTUM_MODE
    invalid_examples:
    - value: DATABASE_URL
      reason: "\u7F3A\u5C11 MYCODEXVANTAOS_ \u524D\u7DB4"
    - value: ORCH_DATABASE_URL
      reason: "\u820A\u524D\u7DB4\u7981\u7528"
    - value: KUBO_MODE
      reason: "\u907A\u7559\u524D\u7DB4\u7981\u7528"
    - value: MYCODEXVANTAOS_MODE
      note: "MYCODEXVANTAOS_MODE \u70BA\u5408\u6CD5\u66FF\u4EE3 KUBO_MODE"
  urn:
    format: urn:mycodexvantaos:<type>:<subtype>:<identifier>
    regex: ^urn:mycodexvantaos:[a-z-]+:[a-z-]+:[a-z0-9-]+$
    ci_rule_file: ci/rules/urn.rule.ts
    enforcement: hard
    examples:
    - urn:mycodexvantaos:manifest:service:mycodexvantaos-ai-embedding
    - urn:mycodexvantaos:capability:vector-store:pgvector
  internal_uri:
    format: mycodexvantaos://<namespace>/<type>/<id>
    examples:
    - mycodexvantaos://platform/service/mycodexvantaos-core-kernel
provider_identifiers:
  provider_instance:
    format: <capability>-<provider>
    order: "capability FIRST, provider SECOND \u2014 never inverted"
    regex: '^(database|storage|auth|queue|state-store|secrets|repo|deploy| validation|security|observability|notification|scheduler|vector-store|
      embedding|llm|graph|cache|search)-[a-z0-9-]+$

      '
    ci_rule_file: ci/rules/provider-instance.rule.ts
    enforcement: hard
    source_of_truth: governance/provider-registry.yaml
    directory_pattern: providers/<capability>/<capability>-<provider>/provider-manifest.yaml
    valid_examples:
    - vector-store-pgvector
    - database-postgres
    - llm-openai
    invalid_examples:
    - value: postgres-database
      reason: "\u9806\u5E8F\u5012\u7F6E"
    - value: openai-llm
      reason: "\u9806\u5E8F\u5012\u7F6E"
composite_identifiers:
  separator: --
  rule: "\u96D9\u9023\u5B57\u865F\u50C5\u7528\u65BC composite\uFF1B\u4E0D\u5F97\u51FA\
    \u73FE\u5728 canonical identifier \u4E2D"
  definitions:
    vector_collection:
      format: <service-id>--<purpose>--<model-alias>
      regex: ^mycodexvantaos-[a-z0-9]+(?:-[a-z0-9]+)+--[a-z0-9-]+--[a-z0-9-]+$
      directory: vector-store/collections/<id>.yaml
      ci_rule_file: ci/rules/vector-collection.rule.ts
      enforcement: soft
      example: mycodexvantaos-memory--docs--bge-small-384
    embedding_model_alias:
      format: <provider>--<model>--<dim>d
      regex: ^[a-z0-9-]+--[a-z0-9-]+--[0-9]+d$
      directory: vector-store/embedding-model-aliases/<alias>.yaml
      ci_rule_file: ci/rules/embedding-model-alias.rule.ts
      enforcement: soft
      example: openai--text-embedding-3-small--1536d
    retrieval_pipeline_id:
      format: retrieval--<strategy>--<store>
      regex: ^retrieval--[a-z0-9-]+--[a-z0-9-]+$
      directory: vector-store/retrieval-pipelines/<id>.yaml
      ci_rule_file: ci/rules/retrieval-pipeline-id.rule.ts
      enforcement: soft
      example: retrieval--hybrid--pgvector
    search_index_id:
      format: idx--<service-id>--<field>--<analyzer>
      regex: ^idx--mycodexvantaos-[a-z0-9]+(?:-[a-z0-9]+)+--[a-z0-9-]+--[a-z0-9-]+$
      directory: search-indexes/<id>.yaml
      ci_rule_file: ci/rules/search-index-id.rule.ts
      enforcement: soft
      example: idx--mycodexvantaos-docs-search--content--cjk
    graph_node_id:
      format: <service-id>--<entity>--<natural-key>
      regex: ^mycodexvantaos-[a-z0-9]+(?:-[a-z0-9]+)+--[a-z0-9-]+--[a-z0-9-]+$
      ci_rule_file: ci/rules/graph-node-id.rule.ts
      enforcement: soft
      example: mycodexvantaos-core-kernel--user--alice
    graph_db_index_id:
      format: graph-idx--<service-id>--<label>--<property>
      regex: ^graph-idx--mycodexvantaos-[a-z0-9]+(?:-[a-z0-9]+)+--[a-z0-9-]+--[a-z0-9-]+$
      directory: knowledge-graph/indexes/<id>.yaml
      ci_rule_file: ci/rules/graph-db-index-id.rule.ts
      enforcement: soft
      example: graph-idx--mycodexvantaos-governance--policy--name
    timestamped_id:
      format: <prefix>--<YYYYMMDD>--<random6>
      regex: ^[a-z0-9-]+--[0-9]{8}--[a-z0-9]{6}$
      ci_rule_file: ci/rules/timestamped-id.rule.ts
      enforcement: soft
      example: job--20260423--a1b2c3
    content_addressed_id:
      format: <prefix>--sha256-<first12hex>
      regex: ^[a-z0-9-]+--sha256-[a-f0-9]{12}$
      ci_rule_file: ci/rules/content-addressed-id.rule.ts
      enforcement: soft
      example: dataset--sha256-3f4a8b9c1d2e
    uuid_based_id:
      format: <prefix>--<uuid-nodash>
      regex: ^[a-z0-9-]+--[a-f0-9]{32}$
      ci_rule_file: ci/rules/uuid-based-id.rule.ts
      enforcement: soft
      example: session--550e8400e29b41d4a716446655440000
    exception_record_id:
      format: exception--<YYYYMMDD>--<random6>
      regex: ^exception--[0-9]{8}--[a-z0-9]{6}$
      directory: governance/exceptions.yaml
      note: "\u4F8B\u5916\u767B\u9304\u8A18\u9304\u7684\u552F\u4E00\u8B58\u5225\u7B26"
path_derivation:
  rule: "\u6240\u6709\u8DEF\u5F91\u7531 service_id \u6A5F\u68B0\u63A8\u5C0E\uFF1B\u7981\
    \u6B62\u624B\u52D5\u81EA\u8A02\u5225\u540D"
  source_of_truth: ci/utils/service-id-parser.ts
  ci_rule_file: ci/rules/module-path.rule.ts
  enforcement: hard
  derivations:
    service_path:
      formula: services/{service_id}/
      example: services/mycodexvantaos-ai-embedding/
    module_path:
      formula: modules/{service_id}/
      example: modules/mycodexvantaos-ai-embedding/
    manifest_path:
      formula: modules/{service_id}/module-manifest.yaml
      example: modules/mycodexvantaos-ai-embedding/module-manifest.yaml
    package_short_id:
      formula: service_id.removePrefix('mycodexvantaos-')
      example: ai-embedding
    package_name:
      formula: '@mycodexvantaos/{package_short_id}'
      example: '@mycodexvantaos/ai-embedding'
    k8s_logical_name:
      formula: '{service_id}'
      example: mycodexvantaos-ai-embedding
    k8s_base_path:
      formula: infra/kubernetes/base/{service_id}/
apiVersion: mycodexvantaos.io/v1
kind: PlatformGovernanceSpec
metadata:
  name: mycodexvantaos-platform-governance-spec
  version: 1.0.0
  date: '2026-06-29'
  status: active
  authoritative: true
model:
  type: policy-as-code
  enforcement: ci-pipeline
  authority-chain:
  - layer: 0
    spec: docs/spec/l0-meta/formalized-specification-architecture.yaml
    description: Meta-governance specification
  - layer: 1
    spec: docs/spec/l1-constitution/constitution.yaml
    description: Constitutional specification
  - layer: 2
    spec: docs/spec/l2-structure/capability-architecture-addendum.yaml
    description: Structural specification
domains:
  identity:
    policy: governance/identity-policy.yaml
    enforced-by: ci/rules/identity-rule.ts
  naming:
    policy: governance/naming-policy.schema.json
    enforced-by: ci/rules/naming-rule.ts
  manifest-boundary:
    policy: docs/spec/l1-constitution/constitution.yaml
    enforced-by: ci/rules/manifest-boundary-rule.ts
  foundation:
    policy: foundation/
    enforced-by: ci/rules/foundation-rule.ts
  provider-capability:
    policy: governance/capability-set.yaml
    enforced-by: ci/rules/provider-capability-rule.ts
  service-catalog:
    policy: platform/service-catalog.yaml
    enforced-by: ci/rules/service-catalog-rule.ts
  namespace-governance:
    policy: mycodexvantaos-namespace-governance/
    enforced-by: ci/rules/namespace-governance-rule.ts
  navigation:
    policy: navigation/
    enforced-by: ci/rules/navigation-rule.ts
  ssot-drift:
    policy: governance/ssot-registry.yaml
    enforced-by: ci/rules/ssot-drift-rule.ts
  unified-gates:
    policy: unified-gates/
    enforced-by: ci/rules/unified-gates-rule.ts
  hash-policy:
    policy: governance/hash-policy.yaml
    enforced-by: ci/rules/hash-policy-rule.ts
  runtime-mode:
    policy: governance/runtime-mode-policy.yaml
    enforced-by: ci/rules/runtime-mode-rule.ts
  quantum-bridge:
    policy: governance/quantum-classical-bridge.yaml
    enforced-by: ci/rules/quantum-bridge-rule.ts
conflict-resolution:
  algorithm: layer-priority
  tiebreaker: authoritative-flag
  final-tiebreaker: semantic-version
  unresolvable: ci-failure-with-human-review
exceptions:
  registry: governance/exceptions.yaml
  max-duration-days: 90
  require-approval: true
  approvers:
  - platform-governance-team
  review-cycle-days: 30
reporting:
  output-dir: governance/reports
  schedule: on-ci-run
  formats:
  - json
  - yaml
spec: {}
