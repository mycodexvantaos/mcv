# Legacy CodeQL analysis workflow — retained for GHAS configuration compatibility.
# The primary CodeQL scan is now handled by codeql.yml (CodeQL Advanced).
# This file exists solely to satisfy the code-scanning rule set that expects
# results from the .github/workflows/codeql-analysis.yml configuration.
# Version: 2.0.0 (compat)

name: 'CodeQL'

on:
  push:
    branches: ['main', 'feature/**', 'fix/**']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
