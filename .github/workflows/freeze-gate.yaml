name: Deployment Freeze Gate
"on":
  workflow_run:
    workflows:
      - Deploy to Development
      - Deploy to Staging
      - Deploy to Production
    types:
      - requested
  workflow_dispatch: null
permissions:
  actions: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for deployment freeze
        id: freeze_check
        run: "# Check central configuration for freeze windows\nFREEZE_ACTIVE=\"false\"\
          \nCURRENT_DATE=$(date -u +%Y-%m-%d)\n\n# Example Freeze Window (from .root.governance.yaml)\n\
          # Update these dates for actual freeze windows\nFREEZE_START=\"2024-12-15\"\
          \nFREEZE_END=\"2025-01-10\"\n\nif [[ \"$CURRENT_DATE\" > \"$FREEZE_START\"\
          \ ]] && [[ \"$CURRENT_DATE\" < \"$FREEZE_END\" ]]; then\n  FREEZE_ACTIVE=\"\
          true\"\nfi\n\nif [[ \"$FREEZE_ACTIVE\" == \"true\" ]]; then\n  echo \"::error::Deployment\
          \ freeze is active! Deployments are currently blocked.\"\n  exit 1\nelse\n\
          \  echo \"Deployment freeze is not active. Proceeding.\"\nfi\n"
