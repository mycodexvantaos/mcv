name: No Section Sign Symbol

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for § (U+00A7) in tracked files
        run: |
          # Exclude binary files, node_modules, .venv, and the remediation script itself
          FOUND=0
          while IFS= read -r file; do
            # Skip binary files, node_modules, .venv, .git, and the remediation script
            case "$file" in
              *.png|*.jpg|*.jpeg|*.gif|*.ico|*.woff|*.woff2|*.ttf|*.eot|*.zip) continue ;;
              *node_modules*) continue ;;
              *.venv*) continue ;;
              *.git*) continue ;;
              */remediate_section_sign.py) continue ;;
            esac
            if grep -qP '\xA7' "$file" 2>/dev/null; then
              echo "ERROR: Found § (U+00A7) in $file"
              FOUND=1
            fi
          done < <(git ls-files)

          if [ "$FOUND" -ne 0 ]; then
            echo ""
            echo "FAIL: § (section sign) symbol detected in tracked files."
            echo "This symbol can cause encoding issues on Windows, DOS, and some CI runners."
            echo "Use 'Sec.' instead (e.g., Sec.5 instead of §5)."
            echo "Run: python3 scripts/remediate_section_sign.py"
            exit 1
          fi

          echo "OK: No § (section sign) symbols found in tracked files."
