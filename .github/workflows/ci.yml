# === path: .github/workflows/ci.yml ===
# Core Validation Pipeline for MyCodeXvantaOS
# IM-MCV-CI-OPT: lint → test → security scan on all branches; no deployment tasks
# Version: 1.0.0

name: Core CI

"on":
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "release/**"
      - develop
  pull_request:
    branches:
      - main
      - "release/**"
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  actions: read
  pull-requests: write
  checks: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  # ====================
  # Stage 1: Lint & Format
  # ====================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run format check
        run: pnpm run format:check

      - name: Run ESLint / TypeScript check
        run: pnpm run lint
        continue-on-error: true

      - name: TypeScript type check
        run: pnpm run typecheck
        continue-on-error: true

  # ====================
  # Stage 2: Test
  # ====================
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run tests
        run: pnpm run test

  # ====================
  # Stage 3: Python Test
  # ====================
  python-test:
    name: Python Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: ./python
        run: uv sync --all-packages --extra dev

      - name: Run Python linter
        working-directory: ./python
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Python tests
        working-directory: ./python
        run: uv run pytest -v --cov=. --cov-report=xml

  # ====================
  # Stage 4: Security Scan
  # ====================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        continue-on-error: true
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          category: "/language:javascript-typescript"

  # ====================
  # Stage 5: CI Summary
  # ====================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test, python-test, security-scan]
    if: always()
    steps:
      - name: Check overall status
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PYTHON_RESULT: ${{ needs.python-test.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
        run: |
          if [ "$LINT_RESULT" = "failure" ] || \
             [ "$TEST_RESULT" = "failure" ] || \
             [ "$PYTHON_RESULT" = "failure" ] || \
             [ "$SECURITY_RESULT" = "failure" ]; then
            echo "CI Pipeline failed"
            exit 1
          fi
          echo "CI Pipeline passed"

      - name: Create summary
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PYTHON_RESULT: ${{ needs.python-test.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
        run: |
          {
            echo "## Core CI Summary"
            echo ""
            echo "| Stage | Status |"
            echo "|-------|--------|"
            echo "| Lint & Format | ${LINT_RESULT} |"
            echo "| Tests (Node) | ${TEST_RESULT} |"
            echo "| Tests (Python) | ${PYTHON_RESULT} |"
            echo "| Security Scan | ${SECURITY_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
