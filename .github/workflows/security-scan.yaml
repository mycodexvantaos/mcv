# === path: .github/workflows/security-scan.yaml ===
# Unified Security Scanning Pipeline for MyCodeXvantaOS
# Version: 3.0.0
#
# CodeQL analysis removed from this workflow — it is now handled exclusively
# by .github/workflows/codeql.yml (CodeQL Advanced) which covers actions,
# javascript-typescript, and python with v4 actions.

name: Security Scan

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of scan to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - sast
          - secrets
          - iac
          - container

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ====================
  # Secret Scanning (Gitleaks via CLI)
  # ====================
  secrets-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'secrets' || github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz
          ./gitleaks detect --source . --report-format sarif --report-path gitleaks-results.sarif --exit-code 0 || true

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

  # ====================
  # SAST (Semgrep via container)
  # ====================
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'sast' || github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Run Semgrep via Docker
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          docker run --rm -v "${PWD}:/src" returntocorp/semgrep:latest             semgrep --config p/default --config p/security-audit             --config p/python --config p/javascript             --sarif -o /src/semgrep.sarif /src || true

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ====================
  # IaC Scanning (Checkov via pip)
  # ====================
  iac-scan:
    name: IaC Scan (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'iac' || github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run Checkov
        run: |
          pip install checkov
          checkov --directory . --framework dockerfile,github_actions,secrets --output sarif --output-filepath checkov-results.sarif --skip-check CKV_SECRET_6 --quiet || true
          # Ensure SARIF file exists even if checkov doesn't generate one
          if [ ! -f checkov-results.sarif ]; then
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Checkov","rules":[]}},"results":[]}]}' > checkov-results.sarif
          fi

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  # ====================
  # Container Scanning (Trivy via apt)
  # ====================
  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'container' || github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run Trivy vulnerability scanner
        run: |
          sudo apt-get update && sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy
          trivy fs --format sarif --output trivy-results.sarif --severity CRITICAL,HIGH,MEDIUM,LOW --exit-code 0 .

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ====================
  # Security Summary
  # ====================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [secrets-scan, sast-semgrep, iac-scan, container-scan]
    if: always()
    steps:
      - name: Generate Security Summary
        env:
          SECRETS_RESULT: ${{ needs.secrets-scan.result }}
          SEMGREP_RESULT: ${{ needs.sast-semgrep.result }}
          CHECKOV_RESULT: ${{ needs.iac-scan.result }}
          TRIVY_RESULT: ${{ needs.container-scan.result }}
        run: |
          {
            echo "## Security Scan Summary"
            echo ""
            echo "| Scanner | Status |"
            echo "|---------|--------|"
            echo "| Gitleaks (Secrets) | ${SECRETS_RESULT} |"
            echo "| Semgrep (SAST) | ${SEMGREP_RESULT} |"
            echo "| Checkov (IaC) | ${CHECKOV_RESULT} |"
            echo "| Trivy (Container) | ${TRIVY_RESULT} |"
            echo ""
            echo "**Note:** CodeQL analysis is handled by the separate CodeQL Advanced workflow."
            echo ""
            echo "Scan completed at: $(date -u)"
          } >> "$GITHUB_STEP_SUMMARY"
