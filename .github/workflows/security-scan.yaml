name: Security Scan
"on":
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
  schedule:
    - cron: 0 2 * * *
  workflow_dispatch:
    inputs:
      scan_type:
        description: Type of scan to run
        required: false
        default: all
        type: choice
        options:
          - all
          - sast
          - secrets
          - iac
          - container
concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  codeql-javascript:
    name: CodeQL JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    if: ${{ github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type
      == 'sast' || github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          languages: javascript
          build-mode: none
          config-file: .github/codeql/codeql-config.yml
        continue-on-error: true
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          category: /language:javascript
        continue-on-error: true
  codeql-typescript:
    name: CodeQL TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    if: ${{ github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type
      == 'sast' || github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          languages: javascript
          build-mode: none
          config-file: .github/codeql/codeql-config.yml
        continue-on-error: true
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          category: /language:typescript
        continue-on-error: true
  secrets-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type
      == 'secrets' || github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run:
          "wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz

          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz

          ./gitleaks detect --source . --report-format sarif --report-path gitleaks-results.sarif
          --exit-code 0 || true

          "
      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357
        continue-on-error: true
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type
      == 'sast' || github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Run Semgrep via Docker
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: 'docker run --rm -v "${PWD}:/src" returntocorp/semgrep:latest             semgrep
          --config p/default --config p/security-audit             --config p/python
          --config p/javascript             --sarif -o /src/semgrep.sarif /src || true

          '
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep
  iac-scan:
    name: IaC Scan (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type
      == 'iac' || github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Run Checkov
        run:
          "pip install checkov\ncheckov --directory . --framework dockerfile,github_actions,secrets\
          \ --output sarif --output-filepath checkov-results.sarif --skip-check CKV_SECRET_6\
          \ --quiet || true\n# Ensure SARIF file exists even if checkov doesn't generate\
          \ one\nif [ ! -f checkov-results.sarif ]; then\n  echo '{\"version\":\"2.1.0\"\
          ,\"runs\":[{\"tool\":{\"driver\":{\"name\":\"Checkov\",\"rules\":[]}},\"results\"\
          :[]}]}' > checkov-results.sarif\nfi\n"
      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357
        continue-on-error: true
        with:
          sarif_file: checkov-results.sarif
          category: checkov
  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type
      == 'container' || github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Run Trivy vulnerability scanner
        run: 'sudo apt-get update && sudo apt-get install -y wget apt-transport-https
          gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo
          apt-key add -

          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc)
          main" | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update && sudo apt-get install -y trivy

          trivy fs --format sarif --output trivy-results.sarif --severity CRITICAL,HIGH,MEDIUM,LOW
          --exit-code 0 .

          '
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - codeql-javascript
      - codeql-typescript
      - secrets-scan
      - sast-semgrep
      - iac-scan
      - container-scan
    if: always()
    steps:
      - name: Generate Security Summary
        env:
          SECRETS_RESULT: ${{ needs.secrets-scan.result }}
          SEMGREP_RESULT: ${{ needs.sast-semgrep.result }}
          CHECKOV_RESULT: ${{ needs.iac-scan.result }}
          TRIVY_RESULT: ${{ needs.container-scan.result }}
        run: "{\n  echo \"## Security Scan Summary\"\n  echo \"\"\n  echo \"| Scanner\
          \ | Status |\"\n  echo \"|---------|--------|\"\n  echo \"| CodeQL (JavaScript)\
          \ | ${{ needs.codeql-javascript.result }} |\"\necho \"| CodeQL (TypeScript)\
          \ | ${{ needs.codeql-typescript.result }} |\"\necho \"| Gitleaks (Secrets)\
          \ | ${SECRETS_RESULT} |\"\n  echo \"| Semgrep (SAST) | ${SEMGREP_RESULT} |\"\
          \n  echo \"| Checkov (IaC) | ${CHECKOV_RESULT} |\"\n  echo \"| Trivy (Container)\
          \ | ${TRIVY_RESULT} |\"\n  echo \"\"\n  echo \"**Note:** CodeQL analysis is\
          \ handled by the separate CodeQL Advanced workflow.\"\n  echo \"\"\n  echo\
          \ \"Scan completed at: $(date -u)\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
