# ADR: Quoted "on:" — YAML 1.1 boolean coercion guard.
# RC check validates SLSA provenance, semver tag format, and pre-release gates.
name: Release Candidate Check

"on":
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  rc-validation:
    name: Release Candidate Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: "npm"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install tools
        run: pip install --quiet pyyaml semver
      - name: Validate semver tag format
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME:-}"
          if [[ "$BRANCH" =~ ^release/(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            python - <<PYEOF
          import semver, sys
          try:
              semver.VersionInfo.parse("$VERSION")
              print(f"Semver valid: $VERSION")
          except ValueError as e:
              print(f"::error::Invalid semver '$VERSION': {e}")
              sys.exit(1)
          PYEOF
          fi
      - name: Validate CHANGELOG entry
        run: |
          set -euo pipefail
          if [[ ! -f "CHANGELOG.md" ]]; then
            echo "::warning::CHANGELOG.md not found"
          else
            if ! grep -q "## \[" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no versioned entries"
              exit 1
            fi
            echo "CHANGELOG validated"
          fi
      - name: Validate production-readiness gates
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import yaml, sys, pathlib
          policy_path = pathlib.Path("policies/production-readiness-policy.yaml")
          if not policy_path.exists():
              print("::error::policies/production-readiness-policy.yaml not found")
              sys.exit(1)
          doc = yaml.safe_load(policy_path.read_text())
          gates = doc.get("spec", {}).get("requiredGates", [])
          print(f"Required gates: {len(gates)}")
          for g in gates:
              print(f"  ✓ {g}")
          PYEOF
      - name: SLSA policy check
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import yaml, sys, pathlib
          constitution_files = list(pathlib.Path(".").rglob("platform-constitution*.yaml"))
          if not constitution_files:
              print("::warning::No platform constitution file found")
              sys.exit(0)
          for f in constitution_files:
              doc = yaml.safe_load(f.read_text())
              slsa = doc.get("spec", {}).get("slsaLevel", None)
              if slsa is None:
                  print(f"::warning::{f}: slsaLevel not declared")
              else:
                  print(f"SLSA level declared: {slsa} in {f}")
          PYEOF
      - name: Validate no snapshot/pre-release deps in production
        run: |
          set -euo pipefail
          if [[ -f "package.json" ]]; then
            node -e "
              const pkg = require('./package.json');
              const deps = {...(pkg.dependencies||{}), ...(pkg.devDependencies||{})};
              const snapshots = Object.entries(deps)
                .filter(([,v]) => v.includes('SNAPSHOT') || v.includes('alpha') || v.includes('beta'))
                .map(([k,v]) => k+'@'+v);
              if (snapshots.length > 0) {
                console.error('::error::Pre-release dependencies found:', snapshots.join(', '));
                process.exit(1);
              }
              console.log('No snapshot/pre-release dependencies found');
            "
          fi
