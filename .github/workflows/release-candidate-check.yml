name: Release Candidate Check

on:
  push:
    tags:
      - "v*.*.*-rc.*"
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write
  id-token: write

jobs:
  pre-release-validation:
    name: Pre-Release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml jsonschema networkx

      - name: Run full architecture validation
        run: pnpm run validate:all

      - name: Run all tests
        run: pnpm run test

      - name: Validate release manifest
        run: |
          python3 -c "
          import yaml
          with open('release/release-manifest.yaml') as f:
              manifest = yaml.safe_load(f)
          assert manifest.get('platform') == 'mycodexvantaos', 'Invalid platform in release manifest'
          assert manifest.get('status') in ['candidate', 'stable'], 'Invalid release status'
          print('Release manifest validation: PASSED')
          "

      - name: Check production readiness policy
        run: |
          python3 -c "
          import yaml
          with open('policies/production-readiness-policy.yaml') as f:
              policy = yaml.safe_load(f)
          gates = policy.get('required-gates', [])
          required = ['gate-99-production-closure-validation']
          for g in required:
              assert g in gates, f'Required gate missing from production readiness: {g}'
          print('Production readiness policy: PASSED')
          "

  supply-chain-attestation:
    name: Supply Chain Attestation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pre-release-validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate SLSA policy
        run: |
          python3 -c "
          import yaml
          with open('supply-chain/slsa-policy.yaml') as f:
              policy = yaml.safe_load(f)
          level = policy.get('slsa', {}).get('level', 0)
          assert level >= 2, f'SLSA level must be >= 2, got {level}'
          print(f'SLSA policy validation: PASSED (level {level})')
          "

      - name: Generate release report
        run: |
          python3 -c "
          import json, yaml, datetime
          report = {
              'timestamp': datetime.datetime.utcnow().isoformat() + 'Z',
              'platform': 'mycodexvantaos',
              'status': 'release-candidate-validated',
              'canonical-url': 'https://mycodexvantaos.com',
              'gates-passed': True,
              'supply-chain-validated': True
          }
          with open('outputs/release-candidate-report.json', 'w') as f:
              json.dump(report, f, indent=2)
          print('Release candidate report generated')
          "

      - name: Upload release report
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-report
          path: outputs/release-candidate-report.json
          retention-days: 90
