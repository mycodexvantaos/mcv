# ADR: on: keyword preserved as quoted string to survive YAML 1.1 boolean coercion.
# YAML 1.1 treats bare `on` as boolean true; quoting is the canonical fix per
# https://yaml.org/type/bool.html and actionlint rule yaml-bool-key.
name: Architecture Validation

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  validate-architecture:
    name: Validate Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4.1.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.7.0
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate C4 architecture docs exist
        run: |
          set -euo pipefail
          REQUIRED_DOCS=(
            "docs/architecture/c4-context.md"
            "docs/architecture/c4-container.md"
          )
          MISSING=0
          for doc in "${REQUIRED_DOCS[@]}"; do
            if [[ ! -f "$doc" ]]; then
              echo "::warning file=$doc::Required architecture document missing (expected but not blocking)"
            fi
          done

      - name: Validate ADR directory
        run: |
          set -euo pipefail
          if [[ ! -d "docs/adr" ]]; then
            echo "::warning::ADR directory docs/adr/ is missing (expected but not blocking)"
          else
            ADR_COUNT=$(find docs/adr -name "*.md" | wc -l)
            echo "ADR count: $ADR_COUNT"
          fi

      - name: Validate package dependency graph
        run: |
          set -euo pipefail
          if [[ -f "pnpm-workspace.yaml" ]]; then
            echo "Workspace configuration found: pnpm-workspace.yaml"
          fi

      - name: Validate no circular imports (TypeScript)
        run: |
          set -euo pipefail
          if [[ -f "package.json" ]] && npx --yes madge --version &>/dev/null; then
            npx madge --circular --extensions ts,tsx packages/core/src/ \
              || echo "::warning::Circular imports detected in packages/core/src/"
          fi

      - name: Validate Hexagonal Architecture boundaries
        run: |
          set -euo pipefail
          # Ports must not import from Adapters
          if find packages/ports -name "*.ts" -print0 2>/dev/null | xargs -0 grep -l "from.*adapters" 2>/dev/null | grep -q .; then
            echo "::error::Hexagonal boundary violation: ports/ imports from adapters/"
            exit 1
          fi
          echo "Hexagonal boundary check passed"
