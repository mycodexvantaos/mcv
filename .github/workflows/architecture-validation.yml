# ADR: on: keyword preserved as quoted string to survive YAML 1.1 boolean coercion.
# YAML 1.1 treats bare `on` as boolean true; quoting is the canonical fix per
# https://yaml.org/type/bool.html and actionlint rule yaml-bool-key.
name: Architecture Validation

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  validate-architecture:
    name: Validate Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate C4 architecture docs exist
        run: |
          set -euo pipefail
          REQUIRED_DOCS=(
            "docs/architecture/c4-context.md"
            "docs/architecture/c4-container.md"
          )
          MISSING=0
          for doc in "${REQUIRED_DOCS[@]}"; do
            if [[ ! -f "$doc" ]]; then
              echo "::error file=$doc::Required architecture document missing"
              MISSING=1
            fi
          done
          [[ "$MISSING" -eq 0 ]] || exit 1

      - name: Validate ADR directory
        run: |
          set -euo pipefail
          if [[ ! -d "docs/adr" ]]; then
            echo "::error::ADR directory docs/adr/ is missing"
            exit 1
          fi
          ADR_COUNT=$(find docs/adr -name "*.md" | wc -l)
          echo "ADR count: $ADR_COUNT"
          if [[ "$ADR_COUNT" -lt 1 ]]; then
            echo "::error::No ADR documents found in docs/adr/"
            exit 1
          fi

      - name: Validate package dependency graph
        run: |
          set -euo pipefail
          if [[ -f "package.json" ]]; then
            node -e "
              const pkg = require('./package.json');
              const ws = pkg.workspaces || [];
              console.log('Workspaces:', JSON.stringify(ws, null, 2));
              if (!Array.isArray(ws) && !ws.packages) {
                process.exit(1);
              }
            "
          fi

      - name: Validate no circular imports (TypeScript)
        run: |
          set -euo pipefail
          if [[ -f "package.json" ]] && npx --yes madge --version &>/dev/null; then
            npx madge --circular --extensions ts,tsx packages/core/src/ \
              || echo "::warning::Circular imports detected in packages/core/src/"
          fi

      - name: Validate Hexagonal Architecture boundaries
        run: |
          set -euo pipefail
          # Ports must not import from Adapters
          if find packages/ports -name "*.ts" 2>/dev/null | xargs grep -l "from.*adapters" 2>/dev/null | grep -q .; then
            echo "::error::Hexagonal boundary violation: ports/ imports from adapters/"
            exit 1
          fi
          echo "Hexagonal boundary check passed"
