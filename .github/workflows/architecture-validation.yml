name: Architecture Validation
on:
  push:
    branches:
      - main
      - develop
    paths:
      - docs/**
      - foundation/**
      - governance/**
      - navigation/**
      - contracts/**
      - platform/**
      - modules/**
      - ci/**
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  validate-architecture:
    name: Validate Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: pip install pyyaml jsonschema
      - name: Run architecture validation
        run: pnpm run ci:validate
        env:
          NODE_ENV: ci
      - name: Run naming validation
        run: python3 scripts/validate-naming.py
      - name: Run governance validation
        run: python3 scripts/validate-namespace-governance.py
      - name: Generate architecture validation report
        if: always()
        run: python3 scripts/generate-architecture-validation-report.py
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-validation-report
          path: outputs/architecture-validation-report.json
          retention-days: 30
  validate-identity:
    name: Validate Identity Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml jsonschema
      - name: Validate identity policy
        run:
          "python3 -c \"\nimport yaml, json, sys, re\nwith open('governance/identity-policy.yaml')\
          \ as f:\n    policy = yaml.safe_load(f)\nmachine_id = policy['identity']['machine']\n\
          assert machine_id == 'mycodexvantaos', f'Invalid machine identity: {machine_id}'\n\
          forbidden = policy['identity']['forbidden-prefixes']\nassert 'kubo' in forbidden,\
          \ 'Missing forbidden prefix: kubo'\nassert 'axiom' in forbidden, 'Missing\
          \ forbidden prefix: axiom'\nprint('Identity policy validation: PASSED')\n\"\
          \n"
  validate-ssot:
    name: Validate SSOT Registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml jsonschema
      - name: Validate SSOT registry
        run:
          "python3 -c \"\nimport yaml, os\nssot_files = [\n    'docs/spec/l0-meta/formalized-specification-architecture.yaml',\
          \    'docs/spec/l1-constitution/constitution.yaml',\n    'docs/spec/l2-structure/capability-architecture-addendum.yaml',\n\
          \    'governance/identity-policy.yaml',\n    'platform/service-catalog.yaml',\n\
          ]\nfor f in ssot_files:\n    assert os.path.exists(f), f'SSOT file missing:\
          \ {f}'\n    print(f'SSOT exists: {f}')\nprint('SSOT registry validation: PASSED')\n\
          \"\n"
