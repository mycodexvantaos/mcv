name: Gitleaks Secret Scan

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks_scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

      - name: Run Gitleaks
        # Use a non-zero exit code so the workflow FAILS when secrets are detected.
        # The previous `--exit-code 0 || true` made this scan a no-op that could
        # never block a leak (root cause of PR #203's live PAT going undetected).
        # SARIF upload below runs unconditionally via `if: always()`.
        run: |
          ./gitleaks detect --source . --report-format sarif --report-path gitleaks-report.sarif --exit-code 1

      - name: Upload Gitleaks SARIF report
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        if: always() && hashFiles('gitleaks-report.sarif') != ''
        with:
          sarif_file: gitleaks-report.sarif
          category: gitleaks
