name: Gitleaks Secret Scan
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
  security-events: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks_scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run:
          'wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          '
      - name: Run Gitleaks
        run: "./gitleaks detect --source . --report-format sarif --report-path gitleaks-report.sarif
          --exit-code 0 || true

          "
      - name: Upload Gitleaks SARIF report
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357
        continue-on-error: true
        if: always() && hashFiles('gitleaks-report.sarif') != ''
        with:
          sarif_file: gitleaks-report.sarif
          category: gitleaks
