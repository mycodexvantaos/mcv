name: Gitleaks Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks_scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    env:
      HAS_GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE != '' }}
    steps:
      - name: Check Gitleaks license
        if: ${{ env.HAS_GITLEAKS_LICENSE == 'false' }}
        run: echo "GITLEAKS_LICENSE not configured — skipping scan"

      - name: Checkout repository
        if: ${{ env.HAS_GITLEAKS_LICENSE == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        if: ${{ env.HAS_GITLEAKS_LICENSE == 'true' }}
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          config_path: .gitleaks.toml
          report_format: sarif
          report_path: gitleaks-report.sarif

      - name: Upload Gitleaks SARIF report
        if: always() && hashFiles('gitleaks-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-report.sarif
          category: gitleaks
