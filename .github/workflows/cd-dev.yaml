# === path: .github/workflows/cd-dev.yaml ===
name: Deploy to Development

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dev:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Check GCP credentials
        id: check_creds
        run: |
          if [ -n "$GCP_PROJECT_ID" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "GCP_PROJECT_ID not configured — skipping deployment"
          fi
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      - name: Checkout repository
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: actions/checkout@v4

      - name: 'Authenticate to Google Cloud'
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_ID }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'deploy-bot@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Set up GKE credentials
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: dev-cluster
          location: us-central1

      - name: Download Build Artifacts
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Deploy with Kustomize
        if: steps.check_creds.outputs.has_creds == 'true'
        run: |
          kustomize build deploy/kustomize/overlays/dev | kubectl apply -f -
          kubectl rollout status deployment/my-app-api -n dev
          kubectl rollout status deployment/my-app-web -n dev

      - name: Run Smoke Tests
        if: steps.check_creds.outputs.has_creds == 'true'
        run: ./ops/scripts/smoke.sh dev

      - name: Log Deployment
        if: steps.check_creds.outputs.has_creds == 'true'
        run: |
          echo "Deployment to dev successful."
          # In a real scenario, you'd log to a dedicated audit service here.
          echo '{ \
            "actor": "${{ github.actor }}", \
            "action": "deploy", \
            "resource": "environment:dev", \
            "result": "success", \
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)", \
            "correlationId": "${{ github.run_id }}" \
          }' >> deployment-audit.log

      - name: Upload Audit Log
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-audit-log-dev
          path: deployment-audit.log
