# ── Docker Runtime Smoke Test ──────────────────────────────────────
# Builds the Docker image and runs smoke tests against the container.
# This validates that the runtime is functional end-to-end.
#
# path: .github/workflows/docker-smoke.yml

name: Docker Smoke Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api-node/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'services/**'
      - 'packages/**'
      - 'contracts/**'
      - 'modules/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  docker-smoke:
    name: Docker Runtime Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: mycodexvantaos:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker smoke tests
        run: |
          if [ -f "scripts/smoke/docker-smoke.sh" ]; then
            chmod +x scripts/smoke/docker-smoke.sh
            ./scripts/smoke/docker-smoke.sh mycodexvantaos:smoke-test
          else
            echo "No smoke test script found — verifying container starts"
            docker run --rm -d --name smoke-test mycodexvantaos:smoke-test
            sleep 5
            docker logs smoke-test 2>&1 | head -20 || true
            docker stop smoke-test || true
            echo "Docker smoke test completed"
          fi

      - name: Collect container logs on failure
        if: failure()
        run: |
          docker logs smoke-test 2>&1 || true
          docker ps -a | grep smoke || true
