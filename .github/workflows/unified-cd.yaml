name: Unified CD Pipeline
"on":
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: development
        type: choice
        options:
          - development
          - staging
          - production
      version:
        description: Version to deploy (leave empty for latest)
        required: false
        type: string
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'development' }}-${{ github.ref
    }}
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
  packages: write
  deployments: write
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: "if [ -n \"$INPUT_VERSION\" ]; then\n  VERSION=\"$INPUT_VERSION\"\nelif\
          \ [ \"$REF_NAME\" = \"main\" ]; then\n  VERSION=\"v$(date +%Y%m%d)-${SHA}\"\
          \nelse\n  VERSION=\"${REF_NAME}-${SHA}\"\nfi\necho \"version=$VERSION\" >>\
          \ $GITHUB_OUTPUT\necho \"\U0001F4E6 Version: $VERSION\"\n"
      - name: Check deployment conditions
        id: check
        run: "# Check if there are changes to deploy\nif git diff --quiet HEAD~1 HEAD\
          \ -- 2>/dev/null; then\n  echo \"No changes detected\"\n  echo \"should_deploy=false\"\
          \ >> $GITHUB_OUTPUT\nelse\n  echo \"Changes detected, proceeding with deployment\"\
          \n  echo \"should_deploy=true\" >> $GITHUB_OUTPUT\nfi\n"
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: prepare
    if: ${{ needs.prepare.outputs.should_deploy == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: "9"
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build packages
        run: pnpm run build:packages
      - name: Build modules
        run: pnpm run build:modules
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-artifacts
          path: "packages/*/dist

            modules/*/dist

            "
          retention-days: 7
  container-build:
    name: Build Container Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - prepare
      - build
    if: ${{ needs.prepare.outputs.should_deploy == 'true' }}
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: "type=ref,event=branch

            type=sha,prefix=

            type=raw,value=${{ needs.prepare.outputs.version }}

            "
      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - prepare
      - container-build
    if: ${{ github.event.inputs.environment == 'development' || github.ref == 'refs/heads/main'
      }}
    environment:
      name: development
      url: https://dev.mycodexvantaos.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Check Kubernetes config availability
        id: kube-guard
        shell: bash
        env:
          KUBE_CONFIG_VALUE: ${{ secrets.KUBE_CONFIG_DEV }}
        run: "if [ -n \"$KUBE_CONFIG_VALUE\" ]; then\n  echo \"has_kube_config=true\"\
          \ >> \"$GITHUB_OUTPUT\"\n  echo \"Kubernetes config is available.\"\nelse\n\
          \  echo \"has_kube_config=false\" >> \"$GITHUB_OUTPUT\"\n  echo \"KUBE_CONFIG_DEV\
          \ is not configured — skipping K8s deployment.\"\nfi\n"
      - name: Configure kubectl
        if: steps.kube-guard.outputs.has_kube_config == 'true'
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d
      - name: Set kubeconfig
        if: steps.kube-guard.outputs.has_kube_config == 'true'
        shell: bash
        env:
          KUBE_CONFIG_VALUE: ${{ secrets.KUBE_CONFIG_DEV }}
        run: 'mkdir -p "$HOME/.kube"

          echo "$KUBE_CONFIG_VALUE" | base64 -d > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

          '
      - name: Validate Kubernetes connection
        if: steps.kube-guard.outputs.has_kube_config == 'true'
        shell: bash
        run: "kubectl cluster-info

          kubectl get nodes

          "
      - name: Deploy with kubectl
        if: steps.kube-guard.outputs.has_kube_config == 'true'
        env:
          DEPLOY_VERSION: ${{ needs.prepare.outputs.version }}
        run: "kubectl set image deployment/mycodexvantaos \\\n  mycodexvantaos=${{ env.REGISTRY\
          \ }}/${{ env.IMAGE_NAME }}:${DEPLOY_VERSION} \\\n  -n development\n"
      - name: Wait for rollout
        if: steps.kube-guard.outputs.has_kube_config == 'true'
        run: "kubectl rollout status deployment/mycodexvantaos -n development --timeout=300s

          "
      - name: Run smoke tests
        if: steps.kube-guard.outputs.has_kube_config == 'true'
        run: "# Basic health check

          kubectl exec -n development deployment/mycodexvantaos -- curl -f http://localhost:8080/health
          || exit 1

          "
      - name: Mark K8s deployment skipped
        if: steps.kube-guard.outputs.has_kube_config != 'true'
        run: "{\n  echo \"### K8s Deployment Skipped\"\n  echo \"\"\n  echo \"- **Reason:**\
          \ \\`KUBE_CONFIG_DEV\\` is not configured\"\n  echo \"- **Classification:**\
          \ infrastructure-not-configured\"\n  echo \"- **Action:** Configure \\`KUBE_CONFIG_DEV\\\
          ` secret (base64-encoded kubeconfig) to enable K8s deployment\"\n  echo \"\
          \"\n  echo \"Docker image build and registry push completed successfully.\"\
          \n} >> \"$GITHUB_STEP_SUMMARY\"\n"
  post-deploy:
    name: Post-Deployment Tasks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - prepare
      - container-build
      - deploy-dev
    if: always() && needs.prepare.outputs.should_deploy == 'true'
    steps:
      - name: Create deployment summary
        env:
          CONTAINER_RESULT: ${{ needs.container-build.result }}
          DEV_RESULT: ${{ needs.deploy-dev.result }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: "{\n  echo \"## Unified CD Summary\"\n  echo \"\"\n  echo \"| Stage | Status\
          \ |\"\n  echo \"|-------|--------|\"\n  echo \"| Docker image build | ${CONTAINER_RESULT}\
          \ |\"\n  echo \"| Container registry push | ${CONTAINER_RESULT} |\"\n  echo\
          \ \"| Development K8s deploy | ${DEV_RESULT} |\"\n  echo \"\"\n  echo \"**Version:**\
          \ ${VERSION}\"\n  echo \"\"\n  echo \"_K8s deploy results of 'skipped' indicate\
          \ the corresponding kubeconfig secret is not configured (infrastructure-not-configured)._\"\
          \n} >> \"$GITHUB_STEP_SUMMARY\"\n"
