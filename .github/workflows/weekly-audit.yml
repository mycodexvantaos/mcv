# === path: .github/workflows/weekly-audit.yml ===
# Weekly Full Security Audit for MyCodeXvantaOS
# Version: 2.0.0
# Uses CLI tools directly (no third-party composite actions) to avoid startup_failure

name: Weekly Security Audit

on:
  schedule:
    - cron: '0 2 * * 1' # Monday 02:00 UTC
  workflow_dispatch:

concurrency:
  group: weekly-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write

jobs:
  # ── Full CodeQL Scan ────────────────────────────────────────────
  codeql-full:
    name: CodeQL Full Audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/codeql-config.yml
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          category: '/weekly-audit/language:${{ matrix.language }}'
        continue-on-error: true

  # ── Semgrep Full Audit (CLI via container) ──────────────────────
  semgrep-full:
    name: Semgrep Full Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    container:
      image: returntocorp/semgrep-agent:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Semgrep Full Scan
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          semgrep --config p/default --config p/security-audit --config p/python --config p/javascript --config p/ci --sarif -o semgrep.sarif . || true

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357
        with:
          sarif_file: semgrep.sarif
          category: semgrep-weekly

  # ── Trivy Full Vulnerability Audit (CLI via apt) ───────────────
  trivy-full:
    name: Trivy Full Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install and run Trivy
        run: |
          sudo apt-get update && sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy
          trivy fs --format sarif --output trivy-results.sarif --severity CRITICAL,HIGH,MEDIUM,LOW,INFO --exit-code 0 --skip-dirs node_modules,dist,build,.next,vendor,project-import .

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357
        with:
          sarif_file: trivy-results.sarif
          category: trivy-weekly

  # ── Checkov Full Audit (CLI via pip) ────────────────────────────
  checkov-full:
    name: Checkov Full Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Run Checkov full scan
        run: |
          pip install checkov
          checkov --directory . --framework dockerfile,github_actions,secrets --output sarif --output-filepath checkov-results.sarif --skip-check CKV_SECRET_6 --quiet || true
          # Ensure SARIF file exists
          if [ ! -f checkov-results.sarif ]; then
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Checkov","rules":[]}},"results":[]}]}' > checkov-results.sarif
          fi

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357
        with:
          sarif_file: checkov-results.sarif
          category: checkov-weekly

  # ── Secret Scan Full History (CLI via wget) ─────────────────────
  secret-scan-full:
    name: Secret Scan (Full History)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz
          ./gitleaks detect --source . --report-format sarif --report-path gitleaks-results.sarif --exit-code 0 || true

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks-weekly

  # ── Super-Linter (full codebase) ───────────────────────────────
  super-linter-full:
    name: Super-Linter (Full Codebase)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      checks: write
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Lint Full Codebase
        uses: super-linter/super-linter@12150456a73e248bdc94d0794898f94e23127c88
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: 'main'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LEVEL: NOTICE
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_BASH: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          FILTER_REGEX_EXCLUDE: |
            node_modules/.*
            dist/.*
            build/.*
            coverage/.*
            .next/.*
            vendor/.*
            pnpm-lock\.yaml
            package-lock\.json
            yarn\.lock
            python/\.coverage.*
            project-import/.*
            todo\.md
            packages/jsonata/.*

  # ── Audit Summary ──────────────────────────────────────────────
  audit-summary:
    name: Weekly Audit Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - codeql-full
      - semgrep-full
      - trivy-full
      - checkov-full
      - secret-scan-full
      - super-linter-full
    if: always()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Generate Audit Report
        env:
          CODEQL_RESULT: ${{ needs.codeql-full.result }}
          SEMGREP_RESULT: ${{ needs.semgrep-full.result }}
          TRIVY_RESULT: ${{ needs.trivy-full.result }}
          CHECKOV_RESULT: ${{ needs.checkov-full.result }}
          SECRET_RESULT: ${{ needs.secret-scan-full.result }}
          LINTER_RESULT: ${{ needs.super-linter-full.result }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║        Weekly Security Audit — Summary Report       ║"
          echo "╚══════════════════════════════════════════════════════╝"
          echo ""
          echo "Date:    $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "Branch:  ${REF_NAME}"
          echo "SHA:     ${SHA}"
          echo "Run ID:  ${RUN_ID}"
          echo ""

          check_result() {
            local job=$1
            local result=$2
            if [ "$result" = "success" ]; then
              echo "  ✅ $job"
            elif [ "$result" = "skipped" ]; then
              echo "  ⏭️  $job (skipped)"
            else
              echo "  ❌ $job ($result)"
            fi
          }

          check_result "codeql-full" "${CODEQL_RESULT}"
          check_result "semgrep-full" "${SEMGREP_RESULT}"
          check_result "trivy-full" "${TRIVY_RESULT}"
          check_result "checkov-full" "${CHECKOV_RESULT}"
          check_result "secret-scan-full" "${SECRET_RESULT}"
          check_result "super-linter-full" "${LINTER_RESULT}"

          echo ""
          echo "Full SARIF results uploaded to Security tab."
          echo "Review: https://github.com/${REPO}/security"
