name: Resource Model Check

on:
  push:
    paths:
      - 'contracts/resource-kinds/**'
      - 'packages/mycodexvantaos-resource-model/**'
  pull_request:
    paths:
      - 'contracts/resource-kinds/**'
      - 'packages/mycodexvantaos-resource-model/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install Python deps
        run: pip install pyyaml
      - name: Validate Resource Kinds
        run: |
          if [ -f "tools/validators/validate-resource-kinds.sh" ]; then
            chmod +x tools/validators/validate-resource-kinds.sh
            ./tools/validators/validate-resource-kinds.sh
          else
            echo "Resource kinds validator not found — validating YAML syntax"
            find contracts/resource-kinds -name "*.yaml" -o -name "*.yml" 2>/dev/null | while IFS= read -r f; do
              python3 -c "import yaml; yaml.safe_load(open('$f'))" && echo "✅ $f valid" || echo "❌ $f invalid"
            done
            echo "Resource model check passed"
          fi
