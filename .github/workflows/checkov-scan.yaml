name: Checkov IaC Scan

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkov:
    name: Checkov Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov scan
        run: |
          checkov --directory . --framework dockerfile,github_actions,secrets \
            --output sarif --output-filepath checkov-results.sarif \
            --skip-check CKV_SECRET_6 --quiet || true
          # Ensure SARIF file exists even if checkov doesn't generate one
          if [ ! -f checkov-results.sarif ]; then
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Checkov","rules":[]}},"results":[]}]}' > checkov-results.sarif
          fi

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        continue-on-error: true
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov
