# === path: .github/workflows/ci-gate.yml ===
# Unified CI Governance Gate for MyCodeXvantaOS
# Version: 1.0.0
#
# Stages:
#   preflight          — fast sanity checks
#   super-linter       — incremental file-change linting (VALIDATE_ALL_CODEBASE: false)
#   node-quality       — typecheck + format check (no build/test — handled by unified-ci.yaml)
#   python-quality     — ruff + mypy
#   dependency-review  — only on pull_request
#   secret-scan        — gitleaks (strict, always runs)
#   governance-gate    — aggregates results, single required status check

name: CI Governance Gate

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read
  security-events: write

# ─────────────────────────────────────────────────────────────
# Stage 1: Preflight
# ─────────────────────────────────────────────────────────────
jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_pull_request: ${{ steps.ctx.outputs.is_pull_request }}
    steps:
      - name: Evaluate context
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "is_pull_request=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_pull_request=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Print run context
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "Event:  ${EVENT}"
          echo "Ref:    ${REF}"
          echo "SHA:    ${SHA}"
          echo "Actor:  ${ACTOR}"

# ─────────────────────────────────────────────────────────────
# Stage 2: Super-Linter (incremental — changed files only)
# ─────────────────────────────────────────────────────────────
  super-linter:
    name: Super-Linter (Incremental)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Lint changed files
        uses: super-linter/super-linter@12150456a73e248bdc94d0794898f94e23127c88
        env:
          # Incremental: only lint files changed in this PR/push
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LEVEL: NOTICE

          # Active linters
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_BASH: true
          VALIDATE_DOCKERFILE_HADOLINT: true

          # shellcheck: suppress SC2086 only for GitHub Actions env vars in super-linter
          # which uses variable expansion patterns that are intentional and safe within
          # the super-linter container environment (not user-controlled input).
          SHELLCHECK_OPTS: '--exclude=SC2086'

          # Exclude generated / vendored / build artefacts
          FILTER_REGEX_EXCLUDE: >-
            node_modules/.*|dist/.*|build/.*|coverage/.*|\.next/.*|\.nuxt/.*|
            \.turbo/.*|\.cache/.*|vendor/.*|generated/.*|project-import/.*|
            pnpm-lock\.yaml|package-lock\.json|yarn\.lock|
            python/\.coverage.*|todo\.md|.*\.min\.js

# ─────────────────────────────────────────────────────────────
# Stage 3: Node.js Quality (typecheck + format — fast)
# ─────────────────────────────────────────────────────────────
  node-quality:
    name: Node.js Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: preflight
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup PNPM
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '9'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript type check
        run: pnpm run typecheck || pnpm run validate

      - name: Format check
        run: pnpm run format:check || echo "format:check not yet configured"
        continue-on-error: true

# ─────────────────────────────────────────────────────────────
# Stage 4: Python Quality
# ─────────────────────────────────────────────────────────────
  python-quality:
    name: Python Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install --quiet uv

      - name: Install Python dependencies
        working-directory: python
        run: |
          if uv sync --extra dev --all-packages; then
            echo "Installed via uv sync"
          elif pip install ruff mypy; then
            echo "Installed via pip fallback"
          else
            echo "::warning::Python dependency installation failed — lint results may be incomplete"
          fi

      - name: Ruff lint
        working-directory: python
        run: |
          if command -v uv &>/dev/null && [ -f .venv/bin/ruff ]; then
            .venv/bin/ruff check packages/ apps/ --output-format=github
          elif command -v python &>/dev/null; then
            python -m ruff check packages/ apps/ --output-format=github
          else
            echo "::warning::ruff not available — skipping Python lint"
          fi
        continue-on-error: true

      - name: Mypy type check
        working-directory: python
        run: |
          if command -v uv &>/dev/null && [ -f .venv/bin/mypy ]; then
            .venv/bin/mypy packages/ --ignore-missing-imports --no-error-summary
          else
            echo "::warning::mypy not available — skipping Python type check"
          fi
        continue-on-error: true

# ─────────────────────────────────────────────────────────────
# Stage 5: Dependency Review (pull_request only)
# ─────────────────────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Dependency Review
        uses: actions/dependency-review-action@4901385134134e04cec5fbe5ddfe3b2c5bd5d976
        with:
          config-file: .github/dependency-review-config.yml

# ─────────────────────────────────────────────────────────────
# Stage 6: Secret Scan (strict — always runs)
# ─────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

      - name: Run Gitleaks (working tree scan)
        id: gitleaks
        run: |
          ./gitleaks dir . \
            --report-format sarif \
            --report-path gitleaks-gate.sarif \
            --exit-code 1
        continue-on-error: true

      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357
        if: always() && hashFiles('gitleaks-gate.sarif') != ''
        with:
          sarif_file: gitleaks-gate.sarif
          category: gitleaks-gate

      - name: Enforce no secrets
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "::error::Gitleaks detected potential secrets. Review the Security tab."
          exit 1

# ─────────────────────────────────────────────────────────────
# Stage 7: Governance Gate (aggregator — required status check)
# ─────────────────────────────────────────────────────────────
  governance-gate:
    name: Governance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - preflight
      - super-linter
      - node-quality
      - python-quality
      - dependency-review
      - secret-scan
    if: always()
    steps:
      - name: Evaluate gate
        env:
          LINTER_RESULT: ${{ needs.super-linter.result }}
          NODE_RESULT: ${{ needs.node-quality.result }}
          PYTHON_RESULT: ${{ needs.python-quality.result }}
          DEP_RESULT: ${{ needs.dependency-review.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
          IS_PR: ${{ needs.preflight.outputs.is_pull_request }}
        run: |
          FAILED=0

          check_job() {
            local name="$1"
            local result="$2"
            local required="$3"
            if { [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; } && [ "$required" = "true" ]; then
              echo "::error::Required job '${name}' did not pass (result: ${result})"
              FAILED=1
            elif [ "$result" = "skipped" ]; then
              echo "  ⏭️  ${name}: skipped (not required for this event)"
            elif [ "$result" = "success" ]; then
              echo "  ✅ ${name}: passed"
            else
              echo "  ⚠️  ${name}: ${result}"
            fi
          }

          # Secret scan is always required
          check_job "secret-scan" "${SECRET_RESULT}" "true"
          # Linter is required
          check_job "super-linter" "${LINTER_RESULT}" "true"
          # Node quality is advisory while repository-wide type debt is being reduced
          check_job "node-quality" "${NODE_RESULT}" "false"
          # Python quality is advisory (continue-on-error jobs inside)
          check_job "python-quality" "${PYTHON_RESULT}" "false"
          # Dependency review: required only on PR (skipped on push — not a failure)
          if [ "${IS_PR}" = "true" ]; then
            check_job "dependency-review" "${DEP_RESULT}" "true"
          else
            check_job "dependency-review" "${DEP_RESULT}" "false"
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::CI Governance Gate FAILED — see errors above."
            exit 1
          fi

          echo ""
          echo "CI Governance Gate PASSED."

      - name: Write step summary
        if: always()
        env:
          LINTER_RESULT: ${{ needs.super-linter.result }}
          NODE_RESULT: ${{ needs.node-quality.result }}
          PYTHON_RESULT: ${{ needs.python-quality.result }}
          DEP_RESULT: ${{ needs.dependency-review.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          result_icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              *)       echo "⚠️" ;;
            esac
          }

          {
            echo "## CI Governance Gate — Summary"
            echo ""
            echo "| Stage | Result |"
            echo "|-------|--------|"
            echo "| Super-Linter (incremental) | $(result_icon "${LINTER_RESULT}") ${LINTER_RESULT} |"
            echo "| Node.js Quality | $(result_icon "${NODE_RESULT}") ${NODE_RESULT} |"
            echo "| Python Quality | $(result_icon "${PYTHON_RESULT}") ${PYTHON_RESULT} |"
            echo "| Dependency Review | $(result_icon "${DEP_RESULT}") ${DEP_RESULT} |"
            echo "| Secret Scan | $(result_icon "${SECRET_RESULT}") ${SECRET_RESULT} |"
            echo ""
            echo "**Event:** \`${EVENT}\`  **Ref:** \`${REF}\`  **SHA:** \`${SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
