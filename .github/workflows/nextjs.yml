# NOTE: This workflow attempted to deploy to GitHub Pages as a static site,
# but the application is deployed to Cloudflare Workers via deploy-cloudflare.yaml.
# Disabled: use workflow_dispatch only to avoid breaking CI on every push to main.
name: Deploy Next.js site to Pages (Disabled)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Next.js
        run: pnpm run build
        env:
          NODE_ENV: production
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Note — static export not configured
        run: |
          echo "Static export is not configured for this project."
          echo "This app is deployed to Cloudflare Workers via deploy-cloudflare.yaml."
          echo "To enable GitHub Pages, add 'output: export' to next.config.ts first."
