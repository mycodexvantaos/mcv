# ──────────────────────────────────────────────────────────────────
# MyCodeXvantaOS — Platform Constitution CI
# Validates service contracts, schemas, cross-references, and architecture
# Updated for pnpm monorepo + workspace protocol
# ──────────────────────────────────────────────────────────────────
name: Platform Constitution CI

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "packages/**"
      - "services/**"
      - "apps/**"
      - "migrations/**"
      - "infra/**"
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "packages/**"
      - "services/**"
      - "apps/**"
      - "migrations/**"
      - "infra/**"

jobs:
  validate-contracts:
    name: Validate Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate contracts
        run: pnpm contracts:validate
      - name: Validate YAML syntax
        run: |
          echo "Validating service definition YAML files..."
          for f in contracts/service-definitions/*.yaml; do
            echo "  Checking: $f"
            node -e "require('fs').readFileSync('$f','utf-8')" || { echo "FAIL: $f"; exit 1; }
          done
          echo "Validating event definitions..."
          for f in contracts/events/*.yaml; do
            echo "  Checking: $f"
            node -e "require('fs').readFileSync('$f','utf-8')" || { echo "FAIL: $f"; exit 1; }
          done
          echo "All YAML files valid"
      - name: Validate JSON Schema syntax
        run: |
          echo "Validating JSON Schema files..."
          for f in contracts/schemas/*.json; do
            echo "  Checking: $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf-8'))" || { echo "FAIL: $f"; exit 1; }
          done
          echo "All JSON Schema files valid"

  validate-governance:
    name: Validate Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Governance check
        run: pnpm governance:check

  architecture-check:
    name: Architecture Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no cloud vendor imports in core packages
        run: |
          if grep -rq "from '@cloudflare'" packages/mycodexvantaos-policy-model/ packages/mycodexvantaos-contracts-sdk/ 2>/dev/null; then
            echo "FAIL: core packages must have zero cloud vendor dependencies"
            exit 1
          fi
          echo "Core packages are vendor-free"
      - name: Check required packages exist
        run: |
          REQUIRED_PACKAGES=(
            "packages/mycodexvantaos-policy-model"
            "packages/mycodexvantaos-contracts-sdk"
            "services/mycodexvantaos-service-policy-engine"
            "services/mycodexvantaos-service-audit-log"
            "services/mycodexvantaos-service-knowledge-trace"
            "services/mycodexvantaos-service-memory-dream"
            "services/mycodexvantaos-service-service-catalog"
            "services/mycodexvantaos-service-resource-registry"
            "apps/api-node"
            "apps/api-worker"
          )
          for pkg in "${REQUIRED_PACKAGES[@]}"; do
            if [ -d "$pkg" ]; then
              echo "  OK: $pkg"
            else
              echo "FAIL: Missing $pkg"
              exit 1
            fi
          done
