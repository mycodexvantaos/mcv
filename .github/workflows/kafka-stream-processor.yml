name: Kafka Stream Processor

on:
  push:
    branches: [main, develop]
    paths:
      - 'python/packages/mycodexvantaos-stream-pipeline/**'
      - 'python/apps/kafka-stream-processor/**'
      - 'python/tests/test_stream_pipeline_*'
      - 'python/pyproject.toml'
      - 'services/kafka-stream-processor/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'python/packages/mycodexvantaos-stream-pipeline/**'
      - 'python/apps/kafka-stream-processor/**'
      - 'python/tests/test_stream_pipeline_*'
      - 'python/pyproject.toml'
      - 'services/kafka-stream-processor/**'
  workflow_dispatch:

concurrency:
  group: kafka-stream-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: ./python
        run: uv sync --extra dev --all-packages

      - name: Run ruff check
        working-directory: ./python
        run: uv run ruff check packages/mycodexvantaos-stream-pipeline apps/kafka-stream-processor

      - name: Run ruff format check
        working-directory: ./python
        run: uv run ruff format --check packages/mycodexvantaos-stream-pipeline apps/kafka-stream-processor

      - name: Run tests
        working-directory: ./python
        run: |
          uv run pytest tests/test_stream_pipeline_models.py \
            tests/test_stream_pipeline_processor.py \
            tests/test_stream_pipeline_metrics.py \
            tests/test_stream_pipeline_producer_consumer.py -v

      - name: Run tests with coverage
        working-directory: ./python
        run: |
          uv run pytest tests/test_stream_pipeline_models.py \
            tests/test_stream_pipeline_processor.py \
            tests/test_stream_pipeline_metrics.py \
            tests/test_stream_pipeline_producer_consumer.py \
            --cov=packages/mycodexvantaos-stream-pipeline \
            --cov-report=term-missing \
            --cov-report=xml:coverage-stream-pipeline.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6
        with:
          name: stream-pipeline-coverage
          path: python/coverage-stream-pipeline.xml

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645ea
        with:
          context: .
          file: services/kafka-stream-processor/Dockerfile
          push: false
          tags: kafka-stream-processor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
