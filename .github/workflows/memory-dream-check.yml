name: Memory Dream Check

on:
  push:
    paths:
      - "python/packages/mycodexvantaos-memory-dream/**"
      - "python/apps/dream-worker/**"
      - "contracts/events/memory-events.yaml"
  pull_request:
    paths:
      - "python/packages/mycodexvantaos-memory-dream/**"
      - "python/apps/dream-worker/**"
      - "contracts/events/memory-events.yaml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Lint Python
        run: |
          cd python/packages/mycodexvantaos-memory-dream
          uv run ruff check . || echo "ruff lint warnings (non-blocking)"
      - name: Type Check Python
        run: |
          cd python/packages/mycodexvantaos-memory-dream
          uv run mypy --strict mycodexvantaos_memory_dream/ || echo "mypy warnings (non-blocking)"
