# Cloudflare Pages Preview Deployment Workflow
# Uses @opennextjs/cloudflare for Next.js 16+ support
name: Deploy to Cloudflare Pages (Preview)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '2fead4a141ec2c677eb3bf0ac535f1d5' }}
  NODE_ENV: preview

jobs:
  preview-deploy:
    name: Preview Deployment
    runs-on: ubuntu-latest
    environment: preview
    env:
      HAS_CLOUDFLARE_CREDS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

    steps:
      - name: Check Cloudflare credentials
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'false' }}
        run: echo "CLOUDFLARE_API_TOKEN not configured — skipping deployment"

      - name: Checkout repository
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup PNPM
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Build Next.js application
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: pnpm run build
        env:
          NEXT_PUBLIC_APP_URL: https://preview.autoecoops.io
          NODE_ENV: preview
          NEXT_PRIVATE_STANDALONE: 'true'

      - name: Build with OpenNext for Cloudflare (skip next build)
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: npx opennextjs-cloudflare build --skipNextBuild
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers (Preview)
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment PR with preview URL
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployment ready!**

              📍 **Preview URL**: https://preview.autoecoops.io

              ✅ Built from commit: \`${context.sha.substring(0, 7)}\`
              📅 Deployed at: ${new Date().toISOString()}

              > This preview will be updated with new commits to this PR.`
            })
