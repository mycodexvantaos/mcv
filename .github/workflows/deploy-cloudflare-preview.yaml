# Cloudflare Pages Preview Deployment Workflow
name: Deploy to Cloudflare Pages (Preview)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  NODE_ENV: preview

jobs:
  preview-deploy:
    name: Preview Deployment
    runs-on: ubuntu-latest
    environment: preview
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://preview.autoecoops.io
          NODE_ENV: preview

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages (Preview)
        run: |
          wrangler pages deploy .next \
            --project-name=mycodexvantaos-preview \
            --branch=preview-${{ github.event.pull_request.number || 'manual' }} \
            --commit-message="Preview: ${{ github.event.pull_request.title || 'Manual preview' }}" \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployment ready!**
                
                📍 **Preview URL**: https://preview.autoecoops.io
                
                ✅ Built from commit: \`${context.sha.substring(0, 7)}\`
                📅 Deployed at: ${new Date().toISOString()}
                
                > This preview will be updated with new commits to this PR.`
            })