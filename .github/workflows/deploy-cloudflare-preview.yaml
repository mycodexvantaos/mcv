# Cloudflare Pages Preview Deployment Workflow
name: Deploy to Cloudflare Pages (Preview)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '2fead4a141ec2c677eb3bf0ac535f1d5' }}
  NODE_ENV: preview

jobs:
  preview-deploy:
    name: Preview Deployment
    runs-on: ubuntu-latest
    environment: preview
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://preview.autoecoops.io
          NODE_ENV: preview

      - name: Deploy to Cloudflare Pages (Preview)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          projectName: mycodexvantaos-preview
          directory: .next
          wranglerVersion: '3'

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployment ready!**
                
                📍 **Preview URL**: https://preview.autoecoops.io
                
                ✅ Built from commit: \`${context.sha.substring(0, 7)}\`
                📅 Deployed at: ${new Date().toISOString()}
                
                > This preview will be updated with new commits to this PR.`
            })