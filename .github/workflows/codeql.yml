name: CodeQL Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          config: |
            paths:
              - src
              - packages
              - apps
              - services
              - ci
              - scripts
              - unified-gates/scripts
              - mcv_auditor
            paths-ignore:
              - node_modules
              - dist
              - build
              - outputs
              - "**/*.test.ts"
              - "**/*.spec.ts"

      - name: Setup Node.js (for JS/TS analysis)
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm (for JS/TS analysis)
        if: matrix.language == 'javascript-typescript'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install JS dependencies
        if: matrix.language == 'javascript-typescript'
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript (for JS/TS analysis)
        if: matrix.language == 'javascript-typescript'
        run: pnpm run build --if-present
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for hardcoded secrets
        run: |
          # Check for common secret patterns
          echo "Scanning for hardcoded secrets..."

          # Check for private keys
          if grep -r "BEGIN PRIVATE KEY\|BEGIN RSA PRIVATE KEY\|BEGIN EC PRIVATE KEY" \
            --include="*.ts" --include="*.js" --include="*.py" --include="*.yaml" \
            --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "ERROR: Private key found in source code"
            exit 1
          fi

          # Check for hardcoded passwords (simple patterns)
          if grep -rE "password\s*=\s*['\"][^'\"]{8,}['\"]" \
            --include="*.ts" --include="*.js" --include="*.py" \
            --exclude-dir=node_modules --exclude-dir=.git \
            --exclude="*.test.*" --exclude="*.spec.*" .; then
            echo "WARNING: Potential hardcoded password found"
          fi

          echo "Secret scan completed"

      - name: Check for forbidden vendor URLs in production config
        run: |
          python3 -c "
          import re, os, sys

          forbidden_patterns = [
              r'\.github\.io',
              r'\.pages\.dev',
              r'\.vercel\.app',
              r'\.netlify\.app',
              r'\.run\.app',
              r'\.appspot\.com',
              r'\.cloudfunctions\.net',
              r'\.web\.app',
              r'\.firebaseapp\.com',
          ]

          production_config_files = [
              'config/architecture.config.yaml',
              'config/runtime.config.yaml',
          ]

          violations = []
          for filepath in production_config_files:
              if not os.path.exists(filepath):
                  continue
              with open(filepath) as f:
                  content = f.read()
              for pattern in forbidden_patterns:
                  if re.search(pattern, content):
                      violations.append(f'{filepath}: matches {pattern}')

          if violations:
              for v in violations:
                  print(f'VIOLATION: {v}')
              sys.exit(1)
          print('Vendor URL check: PASSED')
          "
