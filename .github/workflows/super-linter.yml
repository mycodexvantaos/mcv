name: Unified CI Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write
  statuses: write
  security-events: write
  actions: read

concurrency:
  group: unified-ci-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  DEFAULT_BRANCH: main
  CI: true

jobs:
  preflight:
    name: Preflight Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
      package_manager: ${{ steps.detect.outputs.package_manager }}
      has_node: ${{ steps.detect.outputs.has_node }}
      has_python: ${{ steps.detect.outputs.has_python }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Skip draft pull requests
        id: guard
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect project stack
        id: detect
        shell: bash
        run: |
          if [[ -f "pnpm-lock.yaml" ]]; then
            echo "package_manager=pnpm" >> "$GITHUB_OUTPUT"
          elif [[ -f "yarn.lock" ]]; then
            echo "package_manager=yarn" >> "$GITHUB_OUTPUT"
          elif [[ -f "package-lock.json" ]]; then
            echo "package_manager=npm" >> "$GITHUB_OUTPUT"
          else
            echo "package_manager=none" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f "package.json" ]]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f "pyproject.toml" || -f "requirements.txt" ]]; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super Linter
        uses: super-linter/super-linter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ env.DEFAULT_BRANCH }}
          VALIDATE_ALL_CODEBASE: false
          LOG_LEVEL: NOTICE

          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_BASH: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_TYPESCRIPT_ES: true

          FILTER_REGEX_EXCLUDE: |
            node_modules/.*
            dist/.*
            build/.*
            coverage/.*
            .next/.*
            .turbo/.*
            vendor/.*
            pnpm-lock.yaml
            package-lock.json
            yarn.lock

  node-quality:
    name: Node Quality
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true' && needs.preflight.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ needs.preflight.outputs.package_manager }}

      - name: Enable pnpm
        if: needs.preflight.outputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies with pnpm
        if: needs.preflight.outputs.package_manager == 'pnpm'
        run: pnpm install --frozen-lockfile

      - name: Install dependencies with yarn
        if: needs.preflight.outputs.package_manager == 'yarn'
        run: yarn install --frozen-lockfile

      - name: Install dependencies with npm
        if: needs.preflight.outputs.package_manager == 'npm'
        run: npm ci

      - name: Run format check
        shell: bash
        run: |
          if npm run | grep -q "format:check"; then
            npm run format:check
          else
            echo "No format:check script found. Skipping."
          fi

      - name: Run lint script
        shell: bash
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script found. Skipping."
          fi

      - name: Run typecheck
        shell: bash
        run: |
          if npm run | grep -q "typecheck"; then
            npm run typecheck
          else
            echo "No typecheck script found. Skipping."
          fi

      - name: Run tests
        shell: bash
        run: |
          if npm run | grep -q "test"; then
            npm test -- --ci
          else
            echo "No test script found. Skipping."
          fi

      - name: Run build
        shell: bash
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found. Skipping."
          fi

  python-quality:
    name: Python Quality
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true' && needs.preflight.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ -f "requirements.txt" ]]; then
            pip install -r requirements.txt
          fi
          pip install ruff pytest

      - name: Run Ruff
        run: ruff check .

      - name: Run Pytest
        shell: bash
        run: |
          if find . -type f -name "test_*.py" | grep -q .; then
            pytest
          else
            echo "No Python tests found. Skipping."
          fi

  dependency-review:
    name: Dependency Review
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          config-file: .github/dependency-review-config.yml
          fail-on-severity: high
          comment-summary-in-pr: always

  secret-scan:
    name: Secret Scan
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  governance:
    name: Governance Gate
    needs:
      - preflight
      - lint
      - node-quality
      - python-quality
      - dependency-review
      - secret-scan
    if: always() && needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Evaluate gate results
        shell: bash
        run: |
          echo "Lint result: ${{ needs.lint.result }}"
          echo "Node result: ${{ needs.node-quality.result }}"
          echo "Python result: ${{ needs.python-quality.result }}"
          echo "Dependency review result: ${{ needs.dependency-review.result }}"
          echo "Secret scan result: ${{ needs.secret-scan.result }}"

          FAILED=false

          for result in \
            "${{ needs.lint.result }}" \
            "${{ needs.node-quality.result }}" \
            "${{ needs.python-quality.result }}" \
            "${{ needs.dependency-review.result }}" \
            "${{ needs.secret-scan.result }}"
          do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              FAILED=true
            fi
          done

          if [[ "$FAILED" == "true" ]]; then
            echo "Unified CI Gate failed."
            exit 1
          fi

          echo "Unified CI Gate passed."

  summary:
    name: Summary
    needs:
      - preflight
      - lint
      - node-quality
      - python-quality
      - dependency-review
      - secret-scan
      - governance
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Write job summary
        shell: bash
        run: |
          {
            echo "# Unified CI Gate Summary"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Preflight | ${{ needs.preflight.result }} |"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Node Quality | ${{ needs.node-quality.result }} |"
            echo "| Python Quality | ${{ needs.python-quality.result }} |"
            echo "| Dependency Review | ${{ needs.dependency-review.result }} |"
            echo "| Secret Scan | ${{ needs.secret-scan.result }} |"
            echo "| Governance Gate | ${{ needs.governance.result }} |"
            echo ""
            echo "Generated at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } >> "$GITHUB_STEP_SUMMARY"
