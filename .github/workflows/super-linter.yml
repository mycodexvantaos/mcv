name: Lint Code Base

'on':
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write
  statuses: write

jobs:
  run-lint:
    name: Run Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@12150456a73e248bdc94d0794898f94e23127c88
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: 'main'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LEVEL: NOTICE

          # Explicitly enable only required linters (VALIDATE_<LANG>=true)
          # Do NOT set any linter to false — super-linter v7 ignores false values
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_BASH: true
          VALIDATE_DOCKERFILE_HADOLINT: true

          # Shellcheck options — suppress false positives for GitHub Actions env vars
          SHELLCHECK_OPTS: '--exclude=SC2086'

          # Exclude generated / vendored / data directories
          FILTER_REGEX_EXCLUDE: >-
            node_modules/.*|dist/.*|build/.*|coverage/.*|\.next/.*|vendor/.*|pnpm-lock\.yaml|package-lock\.json|yarn\.lock|python/\.coverage.*|project-import/.*|todo\.md|\.ai/.*|packages/jsonata/.*
