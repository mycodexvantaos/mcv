name: Lint Code Base

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write
  statuses: write

jobs:
  run-lint:
    name: Run Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@12150456a73e248bdc94d0794898f94e23127c88
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: 'main'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LEVEL: NOTICE

          # Only enable linters we actually need - use ONLY
          # VALIDATE_<LANG>=true (no false values allowed in v7)
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_BASH: true
          VALIDATE_DOCKERFILE_HADOLINT: true

          # Shellcheck options — suppress false positives for GitHub Actions env vars
          SHELLCHECK_OPTS: '--exclude=SC2086'

          # Exclude generated / vendored / data directories
          FILTER_REGEX_EXCLUDE: |
            node_modules/.*
            dist/.*
            build/.*
            coverage/.*
            .next/.*
            vendor/.*
            pnpm-lock\.yaml
            package-lock\.json
            yarn\.lock
            python/\.coverage.*
            project-import/.*
            todo\.md
            \.ai/.*
