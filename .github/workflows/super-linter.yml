name: Lint Code Base

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read
  checks: write
  statuses: write

jobs:
  run-lint:
    name: Run Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@v7
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LEVEL: NOTICE

          # Enable only linters we actually care about
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_BASH: true
          VALIDATE_DOCKERFILE_HADOLINT: true

          # Disable problematic Python linters — Python quality is handled
          # by the dedicated Coder-Deep MCP and Kafka Stream Processor
          # workflows using ruff (which this repo has adopted).
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_PYLINT: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_PYTHON_MYPY: false
          VALIDATE_PYTHON_RUFF: false
          VALIDATE_PYTHON: false

          # Disable JSCPD (copy-paste detector) — threshold 0% is too strict
          VALIDATE_JSCPD: false

          # Disable JS/TS linting — no package.json at repo root
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_JAVASCRIPT_STANDARD: false
          VALIDATE_JAVASCRIPT_PRETTIER: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_TYPESCRIPT_STANDARD: false
          VALIDATE_TYPESCRIPT_PRETTIER: false

          # Exclude generated / vendored / data directories
          FILTER_REGEX_EXCLUDE: |
            node_modules/.*
            dist/.*
            build/.*
            coverage/.*
            .next/.*
            vendor/.*
            pnpm-lock\.yaml
            package-lock\.json
            yarn\.lock
            python/\.coverage.*
            project-import/.*
