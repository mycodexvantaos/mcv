# ADR: Quoted "on:" - YAML 1.1 boolean coercion guard.
# Bare `on:` is parsed as boolean True by YAML 1.1 parsers (PyYAML, Go yaml.v2).
# GitHub Actions runner uses a Go YAML parser; quoted "on": is required.
name: Lint Code Base

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write
  statuses: write

jobs:
  run-lint:
    name: Run Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LEVEL: NOTICE

          # Explicitly enable only required linters (VALIDATE_<LANG>=true)
          # Do NOT set any linter to false — super-linter v7 ignores false values
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_YAML: true
          # JSON lint: INTENTIONALLY NOT ENABLED.
          # The PR description stated that VALIDATE_JSON and .github/linters/.eslintrc.json
          # would be added. After evaluation, this was found to be infeasible:
          # Super-Linter v7.4 uses ESLint to validate JSON, but this repo's package.json
          # has "type": "module", which causes ERR_IMPORT_ATTRIBUTE_MISSING when ESLint
          # tries to load a .json config. This is a known super-linter limitation
          # (issue #6293, closed as not planned). A scoped .eslintrc.json cannot
          # work around the ESM conflict without broader changes to the project config.
          # JSON formatting is already validated by `pnpm format:check` (prettier),
          # and JSON schema validity is validated by governance-check / provider
          # validation workflows. So this omission loses no coverage.
          # The .github/linters/.eslintrc.json mentioned in the PR description
          # was therefore not created. See NAMING-CONVENTION-SPEC.md §7 for details.
          VALIDATE_MARKDOWN: true
          VALIDATE_BASH: true
          VALIDATE_DOCKERFILE_HADOLINT: true

          # Shellcheck options — suppress false positives for GitHub Actions env vars.
          # Full exclusion set preserved from main (do NOT reduce without audit).
          SHELLCHECK_OPTS: "--exclude=SC2086,SC2034,SC2317,SC2148,SC2016,SC2162,SC2129"

          # Exclude generated / vendored / data directories.
          # IMPORTANT: Keep this as a SINGLE-LINE regex. Multi-line YAML `>-` folding
          # converts newlines to spaces, which alters regex semantics and silently
          # drops exclusion patterns (caused PR #203 regression).
          FILTER_REGEX_EXCLUDE: "node_modules/.*|dist/.*|build/.*|coverage/.*|\\.next/.*|vendor/.*|pnpm-lock\\.yaml|package-lock\\.json|yarn\\.lock|python/\\.coverage.*|project-import/.*|todo\\.md|\\.ai/.*|packages/jsonata/.*|infra/helm/.*/templates/.*|argocd/.*"
