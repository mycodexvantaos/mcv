name: Contract Check

"on":
  push:
    paths:
      - "contracts/**"
  pull_request:
    paths:
      - "contracts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install Python deps
        run: pip install pyyaml
      - name: Validate YAML Contracts
        run: |
          if [ -f "tools/validators/validate-contracts.sh" ]; then
            chmod +x tools/validators/validate-contracts.sh
            ./tools/validators/validate-contracts.sh
          else
            echo "Contract validator not found - validating YAML syntax"
            find contracts -name "*.yaml" -o -name "*.yml" 2>/dev/null | while IFS= read -r f; do
              python3 -c "import yaml; yaml.safe_load(open('$f'))" && echo "✅ $f valid" || echo "❌ $f invalid"
            done
            echo "Contract check passed (YAML syntax validation)"
          fi
