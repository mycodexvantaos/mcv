# Cloudflare Pages Production Deployment Workflow
# Uses @opennextjs/cloudflare for Next.js 16+ support
name: Deploy to Cloudflare Pages (Production)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/!(deploy-cloudflare*)'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development

permissions:
  contents: read
  deployments: write
  id-token: write




env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '2fead4a141ec2c677eb3bf0ac535f1d5' }}
  CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || '1bdb04f9da82872cdff76d8515b85246' }}
  NODE_ENV: production

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}



    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Debug environment
        run: |
          echo "Node version: $(node --version)"
          echo "pnpm version: $(pnpm --version)"
          echo "NODE_ENV: $NODE_ENV"
          ls -la .env* 2>/dev/null || echo "No .env files"

      - name: Build Next.js application
        run: pnpm run build
        env:
          NODE_ENV: production
          NEXT_PRIVATE_STANDALONE: 'true'

      - name: Build with OpenNext for Cloudflare (skip next build)
        run: npx opennextjs-cloudflare build --skipNextBuild
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify build output
        run: |
          if [ -d ".open-next" ]; then
            echo "OpenNext build output exists at .open-next/"
            ls -la .open-next/ | head -15
          else
            echo "OpenNext build output not found at .open-next/"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment
        run: |
          echo "Deployment completed successfully!"
          echo "Production URL: https://admin.autoecoops.io"
          echo "Deployed at: $(date -u)"

  notify:
    name: Deployment Notification
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send deployment notification
        run: |
          if [ "${{ needs.build-and-deploy.result }}" = "success" ]; then
            echo "Deployment to Cloudflare succeeded!"
          elif [ "${{ needs.build-and-deploy.result }}" = "skipped" ]; then
            echo "Deployment skipped (CLOUDFLARE_API_TOKEN not configured)."
          else
            echo "Deployment to Cloudflare failed!"
          fi
