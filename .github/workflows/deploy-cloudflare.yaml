# Cloudflare Workers Deployment Workflow
# Deploys the api-worker Cloudflare Worker using wrangler
name: Deploy to Cloudflare Pages (Production)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/!(deploy-cloudflare*)'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development

permissions:
  contents: read
  deployments: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '' }}
  NODE_ENV: production

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Check Cloudflare credentials
        id: check_creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "CLOUDFLARE_API_TOKEN not configured — skipping deployment"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Checkout repository
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: actions/checkout@v4

      - name: Setup PNPM
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check_creds.outputs.has_creds == 'true'
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        if: steps.check_creds.outputs.has_creds == 'true'
        working-directory: ./apps/api-worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

  notify:
    name: Deployment Notification
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send deployment notification
        run: |
          if [ "${{ needs.build-and-deploy.result }}" = "success" ]; then
            echo "Deployment to Cloudflare succeeded!"
          elif [ "${{ needs.build-and-deploy.result }}" = "skipped" ]; then
            echo "Deployment skipped (CLOUDFLARE_API_TOKEN not configured)."
          else
            echo "Deployment to Cloudflare failed!"
          fi
