# .github/workflows/yaml-lint-guard.yml
name: YAML Lint Guard

"on":
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  yaml-lint-guard:
    name: Detect YAML Boolean-Key and Workflow Regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate workflow trigger keys
        run: |
          python - <<'PY'
          from __future__ import annotations

          import pathlib
          import re
          import sys
          import yaml

          root = pathlib.Path(".github/workflows")
          failures: list[str] = []

          for path in sorted(root.glob("*.yml")) + sorted(root.glob("*.yaml")):
              text = path.read_text(encoding="utf-8")

              if re.search(r"(?m)^true:\s*$", text):
                  failures.append(f"{path}: contains broken `true:` workflow trigger key")

              if re.search(r"(?m)^on:\s*$", text):
                  failures.append(f"{path}: contains bare `on:`; use quoted `\"on\":`")

              try:
                  parsed = yaml.safe_load(text)
              except Exception as exc:
                  failures.append(f"{path}: invalid YAML: {exc}")
                  continue

              if not isinstance(parsed, dict):
                  failures.append(f"{path}: workflow root is not a mapping")
                  continue

              if True in parsed:
                  failures.append(f"{path}: YAML parser found boolean True key")
              if "on" not in parsed:
                  failures.append(f"{path}: missing quoted `\"on\"` trigger key")
              if "jobs" not in parsed:
                  failures.append(f"{path}: missing jobs")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)

          print("YAML lint guard passed.")
          PY

      - name: Validate workflow needs references
        run: |
          python - <<'PY'
          from __future__ import annotations

          import pathlib
          import sys
          import yaml

          failures: list[str] = []

          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")) + sorted(pathlib.Path(".github/workflows").glob("*.yaml")):
              doc = yaml.safe_load(path.read_text(encoding="utf-8"))
              jobs = doc.get("jobs", {})
              job_ids = set(jobs.keys())

              for job_id, job in jobs.items():
                  needs = job.get("needs", [])
                  if isinstance(needs, str):
                      needs = [needs]
                  for need in needs:
                      if need not in job_ids:
                          failures.append(f"{path}: job `{job_id}` needs unknown job `{need}`")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)

          print("Workflow needs graph passed.")
          PY
