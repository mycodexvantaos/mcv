name: Policy Check

on:
  push:
    paths:
      - 'contracts/policies/**'
      - 'packages/mycodexvantaos-policy-model/**'
  pull_request:
    paths:
      - 'contracts/policies/**'
      - 'packages/mycodexvantaos-policy-model/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Python deps
        run: pip install pyyaml
      - name: Validate Policy Contracts
        run: |
          if [ -f "tools/validators/validate-policies.sh" ]; then
            chmod +x tools/validators/validate-policies.sh
            ./tools/validators/validate-policies.sh
          else
            echo "Policy validator not found — validating YAML syntax"
            find contracts/policies -name "*.yaml" -o -name "*.yml" 2>/dev/null | while IFS= read -r f; do
              python3 -c "import yaml; yaml.safe_load(open('$f'))" && echo "✅ $f valid" || echo "❌ $f invalid"
            done
            echo "Policy check passed (YAML syntax validation)"
          fi
