name: Coder-Deep MCP

on:
  push:
    branches: [main, develop]
    paths:
      - 'python/packages/mycodexvantaos-coder-deep/**'
      - 'python/apps/coder-deep-mcp/**'
      - 'python/tests/test_coder_deep_*'
      - 'python/tests/conftest.py'
      - 'python/pyproject.toml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'python/packages/mycodexvantaos-coder-deep/**'
      - 'python/apps/coder-deep-mcp/**'
      - 'python/tests/test_coder_deep_*'
      - 'python/tests/conftest.py'
      - 'python/pyproject.toml'
  workflow_dispatch:

concurrency:
  group: coder-deep-mcp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write
  security-events: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: ./python
        run: uv sync --extra dev --all-packages

      - name: Run ruff check
        working-directory: ./python
        run: uv run ruff check packages/mycodexvantaos-coder-deep apps/coder-deep-mcp

      - name: Run ruff format check
        working-directory: ./python
        run: uv run ruff format --check packages/mycodexvantaos-coder-deep apps/coder-deep-mcp

      - name: Run all coder-deep tests
        working-directory: ./python
        run: |
          uv run pytest \
            tests/test_coder_deep_memory.py \
            tests/test_coder_deep_cache.py \
            tests/test_coder_deep_behavior.py \
            tests/test_coder_deep_architecture.py \
            tests/test_coder_deep_codex.py \
            tests/test_coder_deep_tasks.py \
            tests/test_coder_deep_api.py \
            tests/test_coder_deep_mcp.py \
            -v

      - name: Run tests with coverage
        working-directory: ./python
        run: |
          uv run pytest \
            tests/test_coder_deep_memory.py \
            tests/test_coder_deep_cache.py \
            tests/test_coder_deep_behavior.py \
            tests/test_coder_deep_architecture.py \
            tests/test_coder_deep_codex.py \
            tests/test_coder_deep_tasks.py \
            tests/test_coder_deep_api.py \
            tests/test_coder_deep_mcp.py \
            --cov=packages/mycodexvantaos-coder-deep \
            --cov=apps/coder-deep-mcp \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage-coder-deep.xml \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            --cov-fail-under=70

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coder-deep-coverage
          path: python/coverage-coder-deep.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: mycodexvantaos/mycodexvantaos
          files: python/coverage-coder-deep.xml
          flags: coder-deep
          name: coder-deep-mcp

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Verify centralized CodeQL workflow
        run: |
          test -f .github/workflows/codeql.yml
          echo "CodeQL scanning is handled by the centralized CodeQL Advanced workflow."

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: python/apps/coder-deep-mcp/Dockerfile
          push: false
          tags: coder-deep-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
