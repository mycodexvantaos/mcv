name: Coder-Deep MCP

on:
  push:
    branches: [main, develop]
    paths:
      - "python/packages/mycodexvantaos-coder-deep/**"
      - "python/apps/coder-deep-mcp/**"
      - "python/tests/test_coder_deep_*"
      - "python/tests/conftest.py"
      - "python/pyproject.toml"
  pull_request:
    branches: [main, develop]
    paths:
      - "python/packages/mycodexvantaos-coder-deep/**"
      - "python/apps/coder-deep-mcp/**"
      - "python/tests/test_coder_deep_*"
      - "python/tests/conftest.py"
      - "python/pyproject.toml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: ./python
        run: uv sync --extra dev --all-packages

      - name: Run ruff check
        working-directory: ./python
        run: uv run ruff check packages/mycodexvantaos-coder-deep apps/coder-deep-mcp

      - name: Run ruff format check
        working-directory: ./python
        run: uv run ruff format --check packages/mycodexvantaos-coder-deep apps/coder-deep-mcp

      - name: Run all coder-deep tests
        working-directory: ./python
        run: |
          uv run pytest \
            tests/test_coder_deep_memory.py \
            tests/test_coder_deep_cache.py \
            tests/test_coder_deep_behavior.py \
            tests/test_coder_deep_architecture.py \
            tests/test_coder_deep_codex.py \
            tests/test_coder_deep_tasks.py \
            tests/test_coder_deep_api.py \
            tests/test_coder_deep_mcp.py \
            -v

      - name: Run tests with coverage
        working-directory: ./python
        run: |
          uv run pytest \
            tests/test_coder_deep_memory.py \
            tests/test_coder_deep_cache.py \
            tests/test_coder_deep_behavior.py \
            tests/test_coder_deep_architecture.py \
            tests/test_coder_deep_codex.py \
            tests/test_coder_deep_tasks.py \
            tests/test_coder_deep_api.py \
            tests/test_coder_deep_mcp.py \
            --cov=packages/mycodexvantaos-coder-deep \
            --cov=apps/coder-deep-mcp \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage-coder-deep.xml \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            --cov-fail-under=70

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coder-deep-coverage
          path: python/coverage-coder-deep.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: mycodexvantaos/mycodexvantaos
          files: python/coverage-coder-deep.xml
          flags: coder-deep
          name: coder-deep-mcp

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  security-scan:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run CodeQL analyze
        uses: github/codeql-action/analyze@v3
        with:
          languages: python
          category: coder-deep-mcp

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: python/apps/coder-deep-mcp/Dockerfile
          push: false
          tags: coder-deep-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
