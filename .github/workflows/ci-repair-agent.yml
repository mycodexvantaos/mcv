name: CI Repair Agent

on:
  push:
    branches: [main, develop]
    paths:
      - 'python/packages/mycodexvantaos-ci-repair/**'
      - 'python/apps/ci-repair-agent/**'
      - 'python/tests/test_ci_repair_*'
      - 'python/pyproject.toml'
      - 'services/ci-repair-agent/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'python/packages/mycodexvantaos-ci-repair/**'
      - 'python/apps/ci-repair-agent/**'
      - 'python/tests/test_ci_repair_*'
      - 'python/pyproject.toml'
      - 'services/ci-repair-agent/**'
  workflow_dispatch:

concurrency:
  group: ci-repair-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: ./python
        run: uv sync --extra dev --all-packages

      - name: Run ruff check
        working-directory: ./python
        run: uv run ruff check packages/mycodexvantaos-ci-repair apps/ci-repair-agent
        continue-on-error: true

      - name: Run ruff format check
        working-directory: ./python
        run: uv run ruff format --check packages/mycodexvantaos-ci-repair apps/ci-repair-agent
        continue-on-error: true

      - name: Run tests
        working-directory: ./python
        run: uv run pytest tests/test_ci_repair_log_parser.py tests/test_ci_repair_engine.py -v
        continue-on-error: true

      - name: Run tests with coverage
        working-directory: ./python
        run: |
          uv run pytest tests/test_ci_repair_log_parser.py tests/test_ci_repair_engine.py \
            --cov=packages/mycodexvantaos-ci-repair \
            --cov-report=term-missing \
            --cov-report=xml:coverage-ci-repair.xml || true
        continue-on-error: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-repair-coverage
          path: python/coverage-ci-repair.xml

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-test
    if: always() && needs.lint-and-test.result != 'cancelled'
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check Dockerfile exists
        id: check_dockerfile
        run: |
          if [ -f "services/ci-repair-agent/Dockerfile" ]; then
            echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile found — skipping Docker build"
          fi

      - name: Set up Docker Buildx
        if: steps.check_dockerfile.outputs.has_dockerfile == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build Docker image
        if: steps.check_dockerfile.outputs.has_dockerfile == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: services/ci-repair-agent/Dockerfile
          push: false
          tags: ci-repair-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
