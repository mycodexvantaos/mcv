name: Governance Check
on:
  push:
    branches:
      - main
      - develop
    paths:
      - governance/**
      - policies/**
      - supply-chain/**
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: 0 6 * * 1
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  security-events: write
jobs:
  governance-policy-check:
    name: Governance Policy Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install pyyaml jsonschema
      - name: Validate governance schemas
        run: "python3 -c \"\nimport yaml, json, jsonschema, os, glob\n\nschema_dir =\
          \ 'governance/schemas'\npolicy_files = {\n    'governance/capability-set.yaml':\
          \ f'{schema_dir}/capability-set.schema.json',\n    'governance/identity-policy.yaml':\
          \ f'{schema_dir}/identity-policy.schema.json',\n    'governance/provider-registry.yaml':\
          \ f'{schema_dir}/provider-registry.schema.json',\n}\n\nfor policy_file, schema_file\
          \ in policy_files.items():\n    if os.path.exists(policy_file) and os.path.exists(schema_file):\n\
          \        with open(policy_file) as pf, open(schema_file) as sf:\n        \
          \    policy = yaml.safe_load(pf)\n            schema = json.load(sf)\n   \
          \     try:\n            jsonschema.validate(policy, schema)\n            print(f'PASS:\
          \ {policy_file}')\n        except jsonschema.ValidationError as e:\n     \
          \       print(f'FAIL: {policy_file}: {e.message}')\n            exit(1)\n\
          \    else:\n        print(f'SKIP (file not found): {policy_file}')\nprint('Governance\
          \ schema validation: PASSED')\n\"\n"
      - name: Check audit policy compliance
        run: "python3 -c \"\nimport yaml\nwith open('governance/audit/audit-policy.yaml')\
          \ as f:\n    policy = yaml.safe_load(f)\nassert policy.get('retention', {}).get('days',\
          \ 0) >= 90, 'Audit retention must be >= 90 days'\nprint('Audit policy compliance:\
          \ PASSED')\n\"\n"
      - name: Check supply chain policy
        run: "python3 -c \"\nimport yaml\nwith open('supply-chain/supply-chain-policy.yaml')\
          \ as f:\n    policy = yaml.safe_load(f)\nassert policy.get('slsa', {}).get('level',\
          \ 0) >= 2, 'SLSA level must be >= 2'\nprint('Supply chain policy: PASSED')\n\
          \"\n"
  naming-governance:
    name: Naming Governance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run naming governance validation
        run: python3 scripts/validate-naming.py
      - name: Run namespace governance validation
        run: python3 scripts/validate-namespace-governance.py
  hash-policy-check:
    name: Hash Policy Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate hash policy
        run: "python3 -c \"\nimport yaml\nwith open('governance/hash-policy.yaml') as\
          \ f:\n    policy = yaml.safe_load(f)\nallowed = policy.get('algorithms', {}).get('allowed',\
          \ [])\nrequired = ['SHA-256', 'SHA3-512', 'BLAKE3']\nfor algo in required:\n\
          \    assert algo in allowed, f'Required hash algorithm missing: {algo}'\n\
          print('Hash policy validation: PASSED')\n\"\n"
  governance:
    runs-on: ubuntu-latest
    name: Contract & Policy Enforcement
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Contract Validation
        run: pnpm contracts:validate || echo "contracts:validate not yet configured"
      - name: Policy Check
        run: pnpm policy:check || echo "policy:check not yet configured"
      - name: Governance Check
        run: pnpm governance:check || echo "governance:check not yet configured"
      - name: Run Service Tests
        run: pnpm test:services || echo "test:services not yet configured"
        continue-on-error: true
      - name: Run Contract Tests
        run: pnpm test:contracts || echo "test:contracts not yet configured"
        continue-on-error: true
env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'
