name: Governance Check

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  governance:
    runs-on: ubuntu-latest
    name: Contract & Policy Enforcement

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contract Validation
        run: pnpm contracts:validate

      - name: Policy Check
        run: pnpm policy:check

      - name: Governance Check
        run: pnpm governance:check

      - name: Run Service Tests
        run: pnpm test:services

      - name: Run Contract Tests
        run: pnpm test:contracts

      - name: Run Policy Model Tests
        run: node --import tsx --test packages/mycodexvantaos-policy-model/src/__tests__/policy-model.test.ts

      - name: Run Policy Engine Tests
        run: node --import tsx --test services/mycodexvantaos-service-policy-engine/src/__tests__/policy-engine.test.ts

      - name: Run Knowledge Trace Tests
        run: node --import tsx --test services/mycodexvantaos-service-knowledge-trace/src/__tests__/knowledge-trace.test.ts

      - name: Run Memory Dream Tests
        run: node --import tsx --test services/mycodexvantaos-service-memory-dream/src/__tests__/memory-dream.test.ts
