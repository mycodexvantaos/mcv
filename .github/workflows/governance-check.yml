# ADR: Quoted "on:" - YAML 1.1 boolean coercion guard.
# Governance check validates policy-as-code compliance on every push/PR.
name: Governance Check

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  governance:
    name: Validate Governance Policies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install governance tools
        run: |
          pip install --quiet pyyaml jsonschema semver

      - name: Validate audit strategy
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import yaml, sys, pathlib

          REQUIRED_KEYS = {"kind", "metadata", "spec"}
          OPTIONAL_VERSION_KEYS = {"version", "apiVersion"}
          audit_files = list(pathlib.Path("policies").glob("*audit*.yaml"))
          if not audit_files:
              print("::warning::No audit policy files found in policies/")
              sys.exit(0)
          errors = []
          for f in audit_files:
              doc = yaml.safe_load(f.read_text())
              missing = REQUIRED_KEYS - set(doc.keys())
              if not (OPTIONAL_VERSION_KEYS & set(doc.keys())):
                  errors.append(f"{f}: missing version key (expected one of {OPTIONAL_VERSION_KEYS})")
              if missing:
                  errors.append(f"{f}: missing keys {missing}")
          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print(f"Audit strategy validated: {len(audit_files)} file(s)")
          PYEOF

      - name: Validate supply chain strategy
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import yaml, sys, pathlib

          supply_files = list(pathlib.Path("policies").glob("*supply*chain*.yaml"))
          if not supply_files:
              print("::warning::No supply-chain policy files found")
              sys.exit(0)
          errors = []
          for f in supply_files:
              doc = yaml.safe_load(f.read_text())
              if doc.get("kind") not in ("SupplyChainPolicy", "GovernancePolicy"):
                  errors.append(f"{f}: unexpected kind '{doc.get('kind')}'")
          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print(f"Supply chain strategy validated: {len(supply_files)} file(s)")
          PYEOF

      - name: Validate production-readiness policy
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import yaml, sys, pathlib

          policy_path = pathlib.Path("policies/production-readiness-policy.yaml")
          if not policy_path.exists():
              print("::error::policies/production-readiness-policy.yaml not found")
              sys.exit(1)
          doc = yaml.safe_load(policy_path.read_text())
          spec = doc.get("spec", {})
          required_gates = spec.get("requiredGates", [])
          if "gate-99-production-closure-validation" not in required_gates:
              print("::error::gate-99-production-closure-validation missing from requiredGates")
              sys.exit(1)
          print(f"Production-readiness policy OK - {len(required_gates)} required gates")
          PYEOF

      - name: Validate namespace governance
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import yaml, sys, pathlib, re

          URN_PATTERN = re.compile(r"^urn:mcv:[a-z][a-z0-9-]*:[a-z][a-z0-9-]*$")
          ns_files = list(pathlib.Path(".").rglob("*namespace*.yaml"))
          errors = []
          for f in ns_files:
              doc = yaml.safe_load(f.read_text())
              urn = doc.get("metadata", {}).get("urn", "")
              if urn and not URN_PATTERN.match(urn):
                  errors.append(f"{f}: invalid URN format '{urn}'")
          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print(f"Namespace governance validated: {len(ns_files)} file(s)")
          PYEOF
