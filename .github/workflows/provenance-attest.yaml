# === path: .github/workflows/provenance-attest.yaml ===
name: Generate Provenance Attestation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  generate-provenance:
    name: Generate SLSA Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0b
        with:
          path: artifacts

      - name: Generate SLSA Provenance
        uses: slsa-framework/slsa-github-generator@07e64b653f10
        with:
          upload-assets: true
