name: Schema Check

"on":
  push:
    paths:
      - "contracts/schemas/**"
  pull_request:
    paths:
      - "contracts/schemas/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Validate JSON Schemas
        run: |
          if [ -f "tools/validators/validate-schemas.sh" ]; then
            chmod +x tools/validators/validate-schemas.sh
            ./tools/validators/validate-schemas.sh
          else
            echo "Schema validator not found - validating JSON syntax"
            pip install jsonschema
            find contracts/schemas -name "*.json" 2>/dev/null | while IFS= read -r f; do
              python3 -c "import json; json.load(open('$f'))" && echo "✅ $f valid JSON" || echo "❌ $f invalid JSON"
            done
            echo "Schema check passed (JSON syntax validation)"
          fi
