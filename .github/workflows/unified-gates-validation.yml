name: Unified Gates Validation

on:
  push:
    branches: [main, develop]
    paths:
      - 'unified-gates/**'
      - 'governance/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  validate-gate-catalog:
    name: Validate Gate Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Validate gate catalog
        run: python3 unified-gates/scripts/validate-gate-catalog.py --root unified-gates

      - name: Validate AI infra gates
        run: python3 unified-gates/scripts/validate-ai-infra-gates.py --root unified-gates

      - name: Validate gate schemas
        run: python3 unified-gates/scripts/validate-gate-schema.py --root unified-gates

  validate-gate-composition:
    name: Validate Gate Composition
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate-gate-catalog
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jsonschema networkx

      - name: Validate gate composition
        run: python3 unified-gates/scripts/validate-gate-composition.py --root unified-gates

  generate-gate-report:
    name: Generate Gate Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-gate-catalog, validate-gate-composition]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Generate gate validation report
        run: python3 unified-gates/scripts/generate-gate-report.py --root unified-gates

      - name: Generate production closure report
        run: python3 unified-gates/scripts/generate-production-closure-report.py --root unified-gates

      - name: Upload gate reports
        uses: actions/upload-artifact@v4
        with:
          name: gate-validation-reports
          path: |
            unified-gates/outputs/gate-validation-report.json
            unified-gates/outputs/production-closure-report.json
          retention-days: 30

  production-closure-gate:
    name: Production Closure Gate (L90-99)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-gate-catalog, validate-gate-composition]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Evaluate production closure gate
        run: |
          python3 unified-gates/scripts/evaluate-gate.py \
            --gate gate-99-production-closure-validation \
            --level l90
