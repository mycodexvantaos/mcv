name: Configuration Drift Detection

on:
  schedule:
    - cron: '0 6 * * 1' # Run weekly on Monday at 6 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check infrastructure credentials
        id: check_creds
        run: |
          echo "has_creds=false" >> "$GITHUB_OUTPUT"
          echo "Infrastructure credentials not configured — skipping drift detection."

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate infrastructure definitions
        run: |
          echo "### Drift Detection: Infrastructure Not Configured" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Classification:** infrastructure-not-configured" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Action:** Configure GCP/Terraform/Cloudflare credentials to enable drift detection" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Basic validation of any infrastructure definitions in the repo
          if [ -d "deploy" ]; then
            echo "Found deploy/ directory — validating structure"
            find deploy -name "*.yaml" -o -name "*.yml" 2>/dev/null | head -5 || true
          fi
          echo "Drift detection skipped (infrastructure-not-configured)"
