name: Configuration Drift Detection

on:
  schedule:
    - cron: '0 * * * *' # Run hourly
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Check GCP credentials
        id: check_creds
        run: |
          if [ -n "$GCP_PROJECT_ID" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
            echo "GCP credentials are available."
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "GCP_PROJECT_ID not configured — skipping drift detection."
          fi
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      - name: Checkout repository
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: actions/checkout@v4

      - name: 'Authenticate to Google Cloud'
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_ID }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'deploy-bot@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Set up GKE credentials
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: dev-cluster
          location: us-central1

      - name: Detect drift
        if: steps.check_creds.outputs.has_creds == 'true'
        id: drift
        run: |
          set -e
          PLANNED_STATE=$(kustomize build deploy/kustomize/overlays/dev)
          DRIFT_DETECTED="false"
          echo "Drift detection logic placeholder. Assuming no drift."
          echo "drift_detected=$DRIFT_DETECTED" >> $GITHUB_OUTPUT
          echo "drift_details=No drift detected (placeholder)." >> $GITHUB_OUTPUT

      - name: Create GitHub Issue on Drift
        if: steps.check_creds.outputs.has_creds == 'true' && steps.drift.outputs.drift_detected == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Configuration Drift Detected in 'dev' environment`,
              body: `Drift was detected between the Git state and the live state in the 'dev' environment.\n\n**Details:**\n\`\`\`\n${{ steps.drift.outputs.drift_details }}\`\`\``,
              labels: ['drift', 'bug']
            });

      - name: Mark drift detection skipped
        if: steps.check_creds.outputs.has_creds != 'true'
        run: |
          echo "### Drift Detection Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Reason:** \`GCP_PROJECT_ID\` is not configured" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Classification:** infrastructure-not-configured" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Action:** Configure \`GCP_PROJECT_ID\` secret and GCP Workload Identity to enable drift detection" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
