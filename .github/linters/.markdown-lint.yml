---
# Markdown lint configuration - relaxed for large documentation repos
MD013: false  # Line length - not enforced for documentation
MD022: false  # Headings should be surrounded by blank lines - not enforced for working docs
MD024: false  # Multiple headings with same content - allowed for README sections
MD032: false  # Lists should be surrounded by blank lines - not enforced for working docs
MD033: false  # Inline HTML - allowed for badges and special formatting
MD034: false  # Bare URL used - allowed for reference links
MD036: false  # Emphasis used instead of heading - allowed for status indicators
MD041: false  # First line should be top-level heading
MD045: false  # Images should have alternate text
MD046: false  # Code block style - mixed fenced and indented allowed
