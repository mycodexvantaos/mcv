[project]
name = "mycodexvantaos"
version = "0.1.0"
description = "MyCodexVantaOS — AI-Native Agent Operating System"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
