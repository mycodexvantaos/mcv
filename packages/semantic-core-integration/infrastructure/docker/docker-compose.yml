version: '3.8'

services:
  semantic-core:
    build:
      context: .
      dockerfile: Dockerfile.semantic-core
    ports:
      - "8001:3000"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mycodex-network

  python-backend:
    build:
      context: .
      dockerfile: Dockerfile.python-backend
    ports:
      - "8002:8000"
    environment:
      - SEMANTIC_CORE_URL=http://semantic-core:3000
      - LOG_LEVEL=INFO
    depends_on:
      semantic-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mycodex-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mycodex-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=mycodex
      - POSTGRES_USER=mycodex
      - POSTGRES_PASSWORD=mycodex123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycodex"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mycodex-network

networks:
  mycodex-network:
    driver: bridge
