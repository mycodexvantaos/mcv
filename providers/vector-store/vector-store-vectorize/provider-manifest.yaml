apiVersion: mycodexvantaos.io/v1
kind: ProviderManifest
metadata:
  name: vector-store-vectorize
  urn: urn:mycodexvantaos:provider:vector-store-vectorize

spec:
  id: vector-store-vectorize
  capability: vector-store
  source: cloudflare-vectorize
  status: active
  criticality: high

  supportsModes:
    - native
    - connected
    - hybrid

  healthCheck:
    enabled: true
    endpoint: /health

  observability:
    metricsEnabled: true
    tracingEnabled: true
