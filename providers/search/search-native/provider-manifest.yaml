apiVersion: mycodexvantaos.io/v1
kind: ProviderManifest
metadata:
  name: search-native
  urn: urn:mycodexvantaos:provider:search-native

spec:
  id: search-native
  capability: search
  source: native
  status: active
  criticality: high

  supportsModes:
    - native
    - connected
    - hybrid

  healthCheck:
    enabled: true
    endpoint: /health

  observability:
    metricsEnabled: true
    tracingEnabled: true
