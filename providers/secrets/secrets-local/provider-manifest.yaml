apiVersion: mycodexvantaos.io/v1
kind: ProviderManifest
metadata:
  name: secrets-local
  urn: urn:mycodexvantaos:provider:secrets-local

spec:
  id: secrets-local
  capability: secrets
  source: local
  status: active
  criticality: high

  supportsModes:
    - native
    - connected
    - hybrid

  healthCheck:
    enabled: true
    endpoint: /health

  observability:
    metricsEnabled: true
    tracingEnabled: true
