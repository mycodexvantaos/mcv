apiVersion: mycodexvantaos.io/v1
kind: ProviderManifest
metadata:
  name: database-d1
  urn: urn:mycodexvantaos:provider:database-d1

spec:
  id: database-d1
  capability: database
  source: cloudflare-d1
  status: active
  criticality: high

  supportsModes:
    - native
    - connected
    - hybrid

  healthCheck:
    enabled: true
    endpoint: /health

  observability:
    metricsEnabled: true
    tracingEnabled: true
