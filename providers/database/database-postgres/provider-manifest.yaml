apiVersion: mycodexvantaos.io/v1
kind: ProviderManifest
metadata:
  name: database-postgres
  urn: urn:mycodexvantaos:provider:database-postgres

spec:
  id: database-postgres
  capability: database
  source: postgres
  status: active
  criticality: high

  supportsModes:
    - native
    - connected
    - hybrid

  healthCheck:
    enabled: true
    endpoint: /health

  observability:
    metricsEnabled: true
    tracingEnabled: true
