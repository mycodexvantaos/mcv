apiVersion: mycodexvantaos.io/v1
kind: ProviderManifest
metadata:
  name: storage-r2
  urn: urn:mycodexvantaos:provider:storage-r2

spec:
  id: storage-r2
  capability: storage
  source: cloudflare-r2
  status: active
  criticality: high

  supportsModes:
    - native
    - connected
    - hybrid

  healthCheck:
    enabled: true
    endpoint: /health

  observability:
    metricsEnabled: true
    tracingEnabled: true
