apiVersion: mycodexvantaos.io/v1
kind: ProviderManifest
metadata:
  name: quantum-runtime-native
  urn: urn:mycodexvantaos:provider:quantum-runtime-native

spec:
  id: quantum-runtime-native
  capability: quantum-runtime
  source: native
  status: active
  criticality: high

  supportsModes:
    - native
    - connected
    - hybrid

  healthCheck:
    enabled: true
    endpoint: /health

  observability:
    metricsEnabled: true
    tracingEnabled: true
