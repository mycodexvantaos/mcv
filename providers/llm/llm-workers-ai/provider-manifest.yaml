apiVersion: mycodexvantaos.io/v1
kind: ProviderManifest
metadata:
  name: llm-workers-ai
  urn: urn:mycodexvantaos:provider:llm-workers-ai

spec:
  id: llm-workers-ai
  capability: llm
  source: cloudflare-workers-ai
  status: active
  criticality: high

  supportsModes:
