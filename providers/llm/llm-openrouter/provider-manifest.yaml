apiVersion: mycodexvantaos.io/v1
kind: ProviderManifest
metadata:
  name: llm-openrouter
  urn: urn:mycodexvantaos:provider:llm-openrouter

spec:
  id: llm-openrouter
  capability: llm
  source: openrouter
  status: active
  criticality: high

  supportsModes:
    - native
    - connected
    - hybrid

  healthCheck:
    enabled: true
    endpoint: /health

  observability:
    metricsEnabled: true
    tracingEnabled: true
