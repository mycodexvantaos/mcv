apiVersion: mycodexvantaos.io/v1
kind: ProviderManifest
metadata:
  name: cache-kv
  urn: urn:mycodexvantaos:provider:cache-kv

spec:
  id: cache-kv
  capability: cache
  source: cloudflare-kv
  status: active
  criticality: high

  supportsModes:
    - native
    - connected
    - hybrid

  healthCheck:
    enabled: true
    endpoint: /health

  observability:
    metricsEnabled: true
    tracingEnabled: true
