apiVersion: v1
kind: ServiceDefinition
metadata:
  name: service-catalog
  namespace: mycodexvantaos-system
spec:
  displayName: 'Service Catalog'
  description: 'Central registry for all MyCodeXvantaOS services'
  version: '0.1.0'
  capabilities:
    - registration
    - discovery
    - validation
  endpoints:
    - name: grpc
      protocol: grpc
      port: 50051
    - name: http
      protocol: http
      port: 8080
