apiVersion: platform.mycodexvantaos/v1
kind: ServiceDefinition
metadata:
  name: memory-store
  category: agent
  display_name: Memory Store
  description: Memory item CRUD and relation management
spec:
  resource_types: []
  runtime:
    portable: true
    supported:
      - cloudflare-workers
      - node-server
      - docker-container
  permissions:
    - action: read
      roles: [workspace-viewer, workspace-member, workspace-owner, platform-admin]
    - action: write
      roles: [workspace-member, workspace-owner, platform-admin]
    - action: admin
      roles: [workspace-owner, platform-admin]
  events:
    emitted: []
    subscribed: []
  audit:
    required: true
