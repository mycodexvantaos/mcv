apiVersion: platform.mycodexvantaos/v1
kind: ServiceDefinition
metadata:
  name: ai-humaniser
  urn: urn:mycodexvantaos:ai:service:ai-humaniser
  version: 1.0.0-constitution
  category: agent
  display_name: AI Humaniser Service
  description: 'AI content detection and humanisation engine. Detects AI-generated
    text at the sentence level, provides confidence scoring with clear explanations,
    and rewrites flagged content to sound more natural while preserving meaning. Supports
    text, file upload, and URL input sources. Provides side-by-side comparison, change
    summaries, and updated confidence scores.

    '
spec:
  resource_type: humaniser-analysis
  runtime:
    provider: cloudflare-workers
    database: d1
    cache: kv
    limits:
      cpu_ms: 200
      memory_mb: 256
  capabilities:
  - id: humaniser.detect
    method: detectContent
    description: 'Detect AI-generated content in text. Accepts text input, file upload,
      or URL extraction. Returns per-sentence analysis with AI/human labels, confidence
      scores, and explanations. Highlights AI-like sentences in red and human-like
      ones in green.

      '
    input:
      type: object
      required:
      - source
      properties:
        source:
          type: string
          enum:
          - text
          - file
          - url
          description: Input source type
        text:
          type: string
          maxLength: 100000
          description: Direct text input
        file:
          type: object
          properties:
            filename:
              type: string
            mime_type:
              type: string
            size:
              type: integer
            content:
              type: string
        url:
          type: string
          format: uri
          description: URL to extract and analyze text from
        detection_threshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0.65
          description: AI detection sensitivity threshold
    output:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
          enum:
          - ai
          - human
          - mixed
          - uncertain
        confidence:
          type: number
          minimum: 0
          maximum: 1
        ai_score:
          type: number
          minimum: 0
          maximum: 1
        human_score:
          type: number
          minimum: 0
          maximum: 1
        sentences:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              index:
                type: integer
              label:
                type: string
                enum:
                - ai
                - human
                - mixed
                - uncertain
              confidence:
                type: number
              ai_score:
                type: number
              human_score:
                type: number
              explanation:
                type: string
        stats:
          type: object
          properties:
            total_sentences:
              type: integer
            ai_sentences:
              type: integer
            human_sentences:
              type: integer
            uncertain_sentences:
              type: integer
            avg_confidence:
              type: number
        explanation:
          type: string
        processing_time_ms:
          type: integer
  - id: humaniser.humanise
    method: humaniseContent
    description: 'Rewrite AI-flagged content to sound more natural. Takes original
      text and detection result, rewrites flagged sentences, and provides side-by-side
      comparison, change summary, and updated confidence score.

      '
    input:
      type: object
      required:
      - original_text
      - detection_result_id
      properties:
        original_text:
          type: string
          description: The original text to humanise
        detection_result_id:
          type: string
          description: ID of a previous detection result
        target_sentence_indices:
          type: array
          items:
            type: integer
          description: 'Specific sentence indices to rewrite (default: all AI-flagged)'
        style:
          type: string
          enum:
          - conversational
          - professional
          - academic
          - creative
          - neutral
          default: neutral
        preserve_technical_terms:
          type: boolean
          default: true
        formality_level:
          type: string
          enum:
          - casual
          - semi-formal
          - formal
          default: semi-formal
    output:
      type: object
      properties:
        id:
          type: string
        humanised_text:
          type: string
        sentence_rewrites:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              original:
                type: string
              rewritten:
                type: string
              original_ai_score:
                type: number
              new_ai_score:
                type: number
              improvement:
                type: number
              changes:
                type: array
                items:
                  type: string
        change_summary:
          type: object
          properties:
            sentences_rewritten:
              type: integer
            sentences_unchanged:
              type: integer
            avg_score_improvement:
              type: number
            overall_score_change:
              type: object
              properties:
                before:
                  type: number
                after:
                  type: number
        updated_detection:
          type: object
          description: Updated detection result after humanisation
        comparison:
          type: object
          properties:
            original_highlighted:
              type: array
            humanised_highlighted:
              type: array
            diffs:
              type: array
        processing_time_ms:
          type: integer
  - id: humaniser.detect-and-humanise
    method: detectAndHumanise
    description: 'Combined operation: detect AI content and immediately humanise flagged
      sentences. Returns both the detection result and the humanisation result.

      '
    input:
      type: object
      required:
      - source
      properties:
        source:
          type: string
          enum:
          - text
          - file
          - url
        text:
          type: string
        file:
          type: object
        url:
          type: string
          format: uri
        style:
          type: string
          enum:
          - conversational
          - professional
          - academic
          - creative
          - neutral
          default: neutral
        preserve_technical_terms:
          type: boolean
          default: true
        formality_level:
          type: string
          enum:
          - casual
          - semi-formal
          - formal
          default: semi-formal
    output:
      type: object
      properties:
        detection:
          type: object
          description: Detection result
        humanisation:
          type: object
          description: Humanisation result (null if no AI content detected)
  - id: humaniser.extract-url
    method: extractUrlContent
    description: Extract text content from a URL for analysis
    input:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
    output:
      type: object
      properties:
        url:
          type: string
        title:
          type: string
        text:
          type: string
        word_count:
          type: integer
        extraction_method:
          type: string
  - id: humaniser.get-report
    method: getReport
    description: 'Generate a comprehensive report with grade, recommendations, and
      detailed analysis from a detection result.

      '
    input:
      type: object
      required:
      - detection_result_id
      properties:
        detection_result_id:
          type: string
    output:
      type: object
      properties:
        grade:
          type: string
        naturalness:
          type: number
        verdict:
          type: string
        ai_percentage:
          type: number
        human_percentage:
          type: number
        recommendations:
          type: array
          items:
            type: string
  events:
    emitted:
    - ai.humaniser.detection-completed
    - ai.humaniser.humanisation-completed
    - ai.humaniser.url-extracted
    subscribed:
    - model.endpoint.invoked
  audit:
    log_all_actions: true
    integrity_chain: true
    retention: 2555d
  dependencies:
    hard:
    - model-byok
    soft:
    - audit-log
    - usage-meter
    - knowledge-search
  ports:
  - interface: IHumaniserPort
    methods:
    - detectContent
    - humaniseContent
    - detectAndHumanise
    - extractUrlContent
    - getReport
