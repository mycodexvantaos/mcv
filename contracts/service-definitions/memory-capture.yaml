apiVersion: platform.mycodexvantaos/v1
kind: ServiceDefinition
metadata:
  name: memory-capture
  category: agent
  display_name: Memory Capture
  description: Memory candidate creation from conversations and events
spec:
  resource_types: []
  runtime:
    portable: true
    supported:
    - cloudflare-workers
    - node-server
    - docker-container
  permissions:
  - action: read
    roles:
    - workspace-viewer
    - workspace-member
    - workspace-owner
    - platform-admin
  - action: write
    roles:
    - workspace-member
    - workspace-owner
    - platform-admin
  - action: admin
    roles:
    - workspace-owner
    - platform-admin
  events:
    emitted: []
    subscribed: []
  audit:
    required: true
