apiVersion: mycodexvantaos.io/v1
kind: NavigationValidationProfile
metadata:
  name: navigation-validation-profile

spec:
  validations:
    - name: directory-index-completeness
      severity: critical
      check: all-root-modules-indexed

    - name: dependency-graph-acyclicity
      severity: critical
      check: hard-dependency-graph-acyclic

    - name: binding-index-coverage
      severity: high
      check: all-services-have-provider-bindings

    - name: navigation-no-runtime-deps
      severity: critical
      check: navigation-indexes-have-no-hard-runtime-dependencies
