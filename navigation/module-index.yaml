apiVersion: mycodexvantaos.io/v1
kind: ModuleIndex
metadata:
  name: module-index
  description: Global module index for MyCodexVantaOS
  version: 1.0.0
  date: '2026-06-29'
  status: active
spec:
  rootModules:
    - name: navigation
      urn: urn:mycodexvantaos:navigation:module:navigation
      path: ./navigation/mycodexvantaos-module.yaml
      type: navigation-index
    - name: mycodexvantaos-namespace-governance
      urn: urn:mycodexvantaos:namespace-governance:module:mycodexvantaos-namespace-governance
      path: ./mycodexvantaos-namespace-governance/mycodexvantaos-module.yaml
      type: namespace-governance
    - name: unified-gates
      urn: urn:mycodexvantaos:unified-gates:module:unified-gates
      path: ./unified-gates/mycodexvantaos-module.yaml
      type: unified-gates
    - name: foundation
      urn: urn:mycodexvantaos:foundation:module:foundation
      path: ./foundation/mycodexvantaos-module.yaml
      type: foundation-spec
    - name: governance
      urn: urn:mycodexvantaos:governance:module:governance
      path: ./governance/mycodexvantaos-module.yaml
      type: governance
    - name: platform
      urn: urn:mycodexvantaos:platform:module:platform
      path: ./platform/mycodexvantaos-module.yaml
      type: platform
    - name: ci
      urn: urn:mycodexvantaos:ci:module:ci
      path: ./ci/mycodexvantaos-module.yaml
      type: ci
    - name: packages
      urn: urn:mycodexvantaos:packages:module:packages
      path: ./packages/mycodexvantaos-module.yaml
      type: packages
    - name: apps
      urn: urn:mycodexvantaos:apps:module:apps
      path: ./apps/mycodexvantaos-module.yaml
      type: applications
    - name: contracts
      urn: urn:mycodexvantaos:contracts:module:contracts
      path: ./contracts/mycodexvantaos-module.yaml
      type: contracts
    - name: policies
      urn: urn:mycodexvantaos:policies:module:policies
      path: ./policies/mycodexvantaos-module.yaml
      type: policies
    - name: infra
      urn: urn:mycodexvantaos:infra:module:infra
      path: ./infra/mycodexvantaos-module.yaml
      type: infrastructure
    - name: release
      urn: urn:mycodexvantaos:release:module:release
      path: ./release/mycodexvantaos-module.yaml
      type: release
    - name: supply-chain
      urn: urn:mycodexvantaos:supply-chain:module:supply-chain
      path: ./supply-chain/mycodexvantaos-module.yaml
      type: supply-chain
    - name: sbom
      urn: urn:mycodexvantaos:sbom:module:sbom
      path: ./sbom/mycodexvantaos-module.yaml
      type: sbom
    - name: artifacts
      urn: urn:mycodexvantaos:artifacts:module:artifacts
      path: ./artifacts/mycodexvantaos-module.yaml
      type: artifacts
  serviceModules:
    - serviceId: mycodexvantaos-core-auth
      manifestPath: ./modules/mycodexvantaos-core-auth/module-manifest.yaml
    - serviceId: mycodexvantaos-ai-embedding
      manifestPath: ./modules/mycodexvantaos-ai-embedding/module-manifest.yaml
    - serviceId: mycodexvantaos-ai-inference
      manifestPath: ./modules/mycodexvantaos-ai-inference/module-manifest.yaml
    - serviceId: mycodexvantaos-agent-runtime
      manifestPath: ./modules/mycodexvantaos-agent-runtime/module-manifest.yaml
    - serviceId: mycodexvantaos-knowledge-ingestion
      manifestPath: ./modules/mycodexvantaos-knowledge-ingestion/module-manifest.yaml
    - serviceId: mycodexvantaos-knowledge-search
      manifestPath: ./modules/mycodexvantaos-knowledge-search/module-manifest.yaml
    - serviceId: mycodexvantaos-governance-policy-engine
      manifestPath: ./modules/mycodexvantaos-governance-policy-engine/module-manifest.yaml
    - serviceId: mycodexvantaos-governance-audit-chain
      manifestPath: ./modules/mycodexvantaos-governance-audit-chain/module-manifest.yaml
    - serviceId: mycodexvantaos-billing-metering
      manifestPath: ./modules/mycodexvantaos-billing-metering/module-manifest.yaml
    - serviceId: mycodexvantaos-runtime-mode-resolver
      manifestPath: ./modules/mycodexvantaos-runtime-mode-resolver/module-manifest.yaml
    - serviceId: mycodexvantaos-quantum-controller
      manifestPath: ./modules/mycodexvantaos-quantum-controller/module-manifest.yaml
platform: mycodexvantaos
canonical-url: https://mycodexvantaos.com
