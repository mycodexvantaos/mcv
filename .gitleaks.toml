# .gitleaks.toml
# MyCodexVantaOS Gitleaks Configuration
#
# Rationale: The original allowlist covered documentation placeholders only.
# This v1.0.0 configuration adds test fixture regexes and the canonical
# test secret used by JWTTokenManager unit tests (48-hex-char string)
# to eliminate false-positive secret detection on committed test code.

title = "MyCodexVantaOS Gitleaks Configuration"

[allowlist]
description = "Repository-safe placeholders and test fixtures"
regexes = [
  '''(?i)example[_-]?(secret|token|password|key)''',
  '''(?i)dummy[_-]?(secret|token|password|key)''',
  '''(?i)test[_-]?(secret|token|password|key)''',
  '''0123456789abcdef0123456789abcdef0123456789abcdef''',
]
paths = [
  '''(^|/)tests?/''',
  '''(^|/)__tests__/''',
  '''\.md$''',
  '''\.example$''',
  '''\.env\.example$''',
]
