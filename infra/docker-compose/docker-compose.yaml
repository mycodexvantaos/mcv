services:
  api-node:
    build:
      context: ../..
      dockerfile: infra/docker-compose/Dockerfile.api-node
    container_name: mycodexvantaos-api
    ports:
    - ${API_PORT:-3100}:3100
    environment:
    - NODE_ENV=production
    - PORT=3100
    - DATABASE_URL=${DATABASE_URL:-postgres://mycodexvantaos:mycodexvantaos@postgres:5432/mycodexvantaos}
    volumes:
    - ../../contracts:/app/contracts:ro
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3100/
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
  dream-worker:
    build:
      context: ../..
      dockerfile: infra/docker-compose/Dockerfile.dream-worker
    container_name: mycodexvantaos-dream
    environment:
    - DREAM_MODE=${DREAM_MODE:-dry-run}
    - PYTHONUNBUFFERED=1
    - DATABASE_URL=${DATABASE_URL:-postgres://mycodexvantaos:mycodexvantaos@postgres:5432/mycodexvantaos}
    volumes:
    - dream-data:/app/data
    restart: unless-stopped
    command:
    - dream-worker
    - run
    - --mode
    - ${DREAM_MODE:-dry-run}
  postgres:
    image: postgres:16-alpine
    container_name: mycodexvantaos-db
    environment:
      POSTGRES_DB: mycodexvantaos
      POSTGRES_USER: mycodexvantaos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mycodexvantaos}
    ports:
    - ${DB_PORT:-5432}:5432
    volumes:
    - pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U mycodexvantaos
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  dream-data:
    driver: local
  pg-data:
    driver: local
