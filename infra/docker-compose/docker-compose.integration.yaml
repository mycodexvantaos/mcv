!!python/object/apply:collections.OrderedDict
- - - version
    - '3.8'
  - - services
    - !!python/object/apply:collections.OrderedDict
      - - - postgres
          - !!python/object/apply:collections.OrderedDict
            - - - image
                - postgres:15-alpine
              - - environment
                - !!python/object/apply:collections.OrderedDict
                  - - - POSTGRES_USER
                      - ${POSTGRES_USER:-mycodexvantaos}
                    - - POSTGRES_PASSWORD
                      - ${POSTGRES_PASSWORD:-changeme}
                    - - POSTGRES_DB
                      - ${POSTGRES_DB:-mycodexvantaos_test}
              - - ports
                - - 5433:5432
              - - healthcheck
                - !!python/object/apply:collections.OrderedDict
                  - - - test
                      - - CMD-SHELL
                        - pg_isready -U mycodexvantaos
                    - - interval
                      - 5s
                    - - timeout
                      - 5s
                    - - retries
                      - 5
        - - redis
          - !!python/object/apply:collections.OrderedDict
            - - - image
                - redis:7-alpine
              - - ports
                - - 6380:6379
              - - healthcheck
                - !!python/object/apply:collections.OrderedDict
                  - - - test
                      - - CMD
                        - redis-cli
                        - ping
                    - - interval
                      - 5s
                    - - timeout
                      - 5s
                    - - retries
                      - 5
  - - name
    - mycodexvantaos-integration
