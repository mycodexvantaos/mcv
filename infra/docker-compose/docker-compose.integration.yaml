version: "3.9"
name: mycodexvantaos-integration

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mycodexvantaos_test
      POSTGRES_USER: mycodexvantaos
      POSTGRES_PASSWORD: integration_test_password
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
