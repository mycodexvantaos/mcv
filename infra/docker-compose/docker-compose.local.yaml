!!python/object/apply:collections.OrderedDict
- - - version
    - '3.8'
  - - services
    - !!python/object/apply:collections.OrderedDict
      - - - postgres
          - !!python/object/apply:collections.OrderedDict
            - - - image
                - postgres:15-alpine
              - - environment
                - !!python/object/apply:collections.OrderedDict
                  - - - POSTGRES_USER
                      - mycodexvantaos
                    - - POSTGRES_PASSWORD
                      - mycodexvantaos
                    - - POSTGRES_DB
                      - mycodexvantaos
              - - ports
                - - 5432:5432
              - - volumes
                - - pgdata:/var/lib/postgresql/data
                  - ../../migrations/postgres:/docker-entrypoint-initdb.d:ro
              - - healthcheck
                - !!python/object/apply:collections.OrderedDict
                  - - - test
                      - - CMD-SHELL
                        - pg_isready -U mycodexvantaos
                    - - interval
                      - 5s
                    - - timeout
                      - 5s
                    - - retries
                      - 5
        - - redis
          - !!python/object/apply:collections.OrderedDict
            - - - image
                - redis:7-alpine
              - - ports
                - - 6379:6379
              - - volumes
                - - redisdata:/data
              - - healthcheck
                - !!python/object/apply:collections.OrderedDict
                  - - - test
                      - - CMD
                        - redis-cli
                        - ping
                    - - interval
                      - 5s
                    - - timeout
                      - 5s
                    - - retries
                      - 5
        - - minio
          - !!python/object/apply:collections.OrderedDict
            - - - image
                - minio/minio:latest
              - - command
                - server /data --console-address ":9001"
              - - environment
                - !!python/object/apply:collections.OrderedDict
                  - - - MINIO_ROOT_USER
                      - mycodexvantaos
                    - - MINIO_ROOT_PASSWORD
                      - mycodexvantaos-secret
              - - ports
                - - 9000:9000
                  - 9001:9001
              - - volumes
                - - miniodata:/data
        - - qdrant
          - !!python/object/apply:collections.OrderedDict
            - - - image
                - qdrant/qdrant:latest
              - - ports
                - - 6333:6333
                  - 6334:6334
              - - volumes
                - - qdrantdata:/qdrant/storage
        - - rabbitmq
          - !!python/object/apply:collections.OrderedDict
            - - - image
                - rabbitmq:3-management-alpine
              - - environment
                - !!python/object/apply:collections.OrderedDict
                  - - - RABBITMQ_DEFAULT_USER
                      - mycodexvantaos
                    - - RABBITMQ_DEFAULT_PASS
                      - mycodexvantaos
              - - ports
                - - 5672:5672
                  - 15672:15672
              - - volumes
                - - rabbitmqdata:/var/lib/rabbitmq
        - - api
          - !!python/object/apply:collections.OrderedDict
            - - - build
                - !!python/object/apply:collections.OrderedDict
                  - - - context
                      - ../..
                    - - dockerfile
                      - infra/docker/Dockerfile.service
                    - - args
                      - !!python/object/apply:collections.OrderedDict
                        - - - SERVICE_NAME
                            - api-worker
              - - ports
                - - 8787:8000
              - - environment
                - !!python/object/apply:collections.OrderedDict
                  - - - NODE_ENV
                      - development
                    - - DATABASE_URL
                      - postgres://mycodexvantaos:mycodexvantaos@postgres:5432/mycodexvantaos
                    - - REDIS_URL
                      - redis://redis:6379
                    - - MINIO_ENDPOINT
                      - minio:9000
                    - - MINIO_ACCESS_KEY
                      - mycodexvantaos
                    - - MINIO_SECRET_KEY
                      - mycodexvantaos-secret
                    - - QDRANT_URL
                      - http://qdrant:6333
                    - - RABBITMQ_URL
                      - amqp://mycodexvantaos:mycodexvantaos@rabbitmq:5672
                    - - JWT_SECRET
                      - local-dev-secret-change-me
                    - - ENCRYPTION_KEY
                      - change-me-in-production-32ch
              - - depends_on
                - !!python/object/apply:collections.OrderedDict
                  - - - postgres
                      - !!python/object/apply:collections.OrderedDict
                        - - - condition
                            - service_healthy
                    - - redis
                      - !!python/object/apply:collections.OrderedDict
                        - - - condition
                            - service_healthy
  - - volumes
    - !!python/object/apply:collections.OrderedDict
      - - - pgdata
          - null
        - - redisdata
          - null
        - - miniodata
          - null
        - - qdrantdata
          - null
        - - rabbitmqdata
          - null
        - - postgres_data
          - null
        - - minio_data
          - null
  - - name
    - mycodexvantaos-local
