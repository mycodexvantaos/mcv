# ══════════════════════════════════════════════════════════════════════════
# MyCodeXvantaOS — Docker Compose Local Development
# Lightweight stack for local development — no full microservice deploy.
# Run: docker compose -f docker-compose.local.yaml up
# ══════════════════════════════════════════════════════════════════════════
version: "3.8"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mycodexvantaos
      POSTGRES_PASSWORD: mycodexvantaos
      POSTGRES_DB: mycodexvantaos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycodexvantaos"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (KV cache alternative) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MinIO (R2 alternative) ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mycodexvantaos
      MINIO_ROOT_PASSWORD: mycodexvantaos-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # ── Qdrant (Vectorize alternative) ─────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  # ── RabbitMQ (Cloudflare Queues alternative) ───────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: mycodexvantaos
      RABBITMQ_DEFAULT_PASS: mycodexvantaos
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

  # ── API Worker (Node.js) ──────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: api-worker
    ports:
      - "8787:8000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://mycodexvantaos:mycodexvantaos@postgres:5432/mycodexvantaos
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: mycodexvantaos
      MINIO_SECRET_KEY: mycodexvantaos-secret
      QDRANT_URL: http://qdrant:6333
      RABBITMQ_URL: amqp://mycodexvantaos:mycodexvantaos@rabbitmq:5672
      JWT_SECRET: local-dev-secret-change-me
      ENCRYPTION_KEY: change-me-in-production-32ch
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
  qdrantdata:
  rabbitmqdata:
