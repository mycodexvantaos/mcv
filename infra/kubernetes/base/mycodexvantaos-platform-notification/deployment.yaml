apiVersion: apps/v1
kind: Deployment
metadata:
  name: mycodexvantaos-platform-notification
  labels:
    app.kubernetes.io/name: mycodexvantaos-platform-notification
    app.kubernetes.io/managed-by: mycodexvantaos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mycodexvantaos-platform-notification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mycodexvantaos-platform-notification
    spec:
      containers:
      - name: mycodexvantaos-platform-notification
        image: ghcr.io/mycodexvantaos/mycodexvantaos-platform-notification:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: mycodexvantaos-platform-notification
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
