global:
  registry: ghcr.io
  namespace: mycodexvantaos
  imageTag: latest
  platform: mycodexvantaos
  canonicalUrl: https://mycodexvantaos.com
  image:
    registry: ghcr.io
    pullPolicy: IfNotPresent
services:
  mycodexvantaos-core-kernel:
    replicas: 1
  mycodexvantaos-ai-embedding:
    replicas: 1
  mycodexvantaos-ai-llm:
    replicas: 1
replicaCount: 1
image:
  repository: ghcr.io/mycodexvantaos/mycodexvantaos-api
  tag: 1.0.0
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
  hosts:
  - host: api.mycodexvantaos.com
    paths:
    - path: /
      pathType: Prefix
  tls:
  - secretName: mycodexvantaos-tls
    hosts:
    - api.mycodexvantaos.com
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  APP_ENV: production
  PUBLIC_CANONICAL_URL: https://mycodexvantaos.com
  PUBLIC_API_URL: https://api.mycodexvantaos.com