apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mycodexvantaos.fullname" . }}-secrets
  labels:
    {{- include "mycodexvantaos.labels" . | nindent 4 }}
type: Opaque
data:
  jwtSecret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  encryptionKey: {{ .Values.secrets.encryptionKey | b64enc | quote }}
  {{- if .Values.secrets.openaiApiKey }}
  openaiApiKey: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.openrouterApiKey }}
  openrouterApiKey: {{ .Values.secrets.openrouterApiKey | b64enc | quote }}
  {{- end }}
