{{- if .Values.database.migrate }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mycodexvantaos.fullname" . }}-migrate
  labels:
    {{- include "mycodexvantaos.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      labels:
        {{- include "mycodexvantaos.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          command: ["node", "dist/migrate.js"]
          envFrom:
            - configMapRef:
                name: {{ include "mycodexvantaos.fullname" . }}-config
          env:
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mycodexvantaos.fullname" . }}-secrets
                  key: encryptionKey
{{- end }}
