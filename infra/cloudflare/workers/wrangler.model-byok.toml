# ═══════════════════════════════════════════════════════════════════
# MyCodeXvantaOS — Model BYOK Service Worker
# Level 2 — depends on identity; multi-provider LLM gateway
# Runtime: Cloudflare Workers + D1 + KV
# ═══════════════════════════════════════════════════════════════════
name = "mycodexvantaos-model-byok"
main = "../../services/model-byok/src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SERVICE_NAME = "model-byok"
SERVICE_VERSION = "1.0.0-constitution"
ENVIRONMENT = "production"
LOG_LEVEL = "info"
ENCRYPTION_KEY_ID = "${CLOUDFLARE_ENCRYPTION_KEY_ID}"

[[d1_databases]]
binding = "DB"
database_name = "mycodexvantaos-platform"
database_id = "${CLOUDFLARE_D1_DATABASE_ID}"

[[kv_namespaces]]
binding = "KV"
id = "${CLOUDFLARE_KV_MODEL_ID}"

[[services]]
binding = "IDENTITY"
service = "mycodexvantaos-identity"

[[queues.consumers]]
queue = "audit-queue"
max_batch_size = 10
max_retries = 3

[limits]
cpu_ms = 200

[[routes]]
pattern = "/api/v1/models/*"
zone_name = "${CLOUDFLARE_ZONE_NAME}"
