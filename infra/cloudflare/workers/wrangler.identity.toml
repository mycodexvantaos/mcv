# ═══════════════════════════════════════════════════════════════════
# MyCodeXvantaOS — Identity Service Worker
# Level 0 service — zero hard dependencies
# Runtime: Cloudflare Workers + D1 + KV
# ═══════════════════════════════════════════════════════════════════
name = "mycodexvantaos-identity"
main = "../../services/identity/src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SERVICE_NAME = "identity"
SERVICE_VERSION = "1.0.0-constitution"
ENVIRONMENT = "production"
LOG_LEVEL = "info"

# ── D1 Database ──────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "mycodexvantaos-platform"
database_id = "${CLOUDFLARE_D1_DATABASE_ID}"

# ── KV Namespace (session cache) ─────────────────────────────────
[[kv_namespaces]]
binding = "KV"
id = "${CLOUDFLARE_KV_IDENTITY_ID}"

# ── Queues (audit events) ────────────────────────────────────────
[[queues.consumers]]
queue = "audit-queue"
max_batch_size = 10
max_retries = 3

# ── Limits ───────────────────────────────────────────────────────
[limits]
cpu_ms = 50

# ── Routes ───────────────────────────────────────────────────────
[[routes]]
pattern = "/api/v1/identity/*"
zone_name = "${CLOUDFLARE_ZONE_NAME}"
