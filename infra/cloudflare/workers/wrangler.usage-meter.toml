# ═══════════════════════════════════════════════════════════════════
# MyCodeXvantaOS — Usage Meter Service Worker
# Level 1 — zero hard dependencies; multi-dimensional metering
# Runtime: Cloudflare Workers + D1 + KV + Queues
# ═══════════════════════════════════════════════════════════════════
name = "mycodexvantaos-usage-meter"
main = "../../services/usage-meter/src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SERVICE_NAME = "usage-meter"
SERVICE_VERSION = "1.0.0-constitution"
ENVIRONMENT = "production"
LOG_LEVEL = "info"
RATE_LIMIT_WINDOW_SECONDS = "60"
QUOTA_ALERT_THRESHOLD_PCT = "80"

[[d1_databases]]
binding = "DB"
database_name = "mycodexvantaos-platform"
database_id = "${CLOUDFLARE_D1_DATABASE_ID}"

[[kv_namespaces]]
binding = "KV"
id = "${CLOUDFLARE_KV_USAGE_ID}"

# Usage alert queue producer
[[queues.producers]]
queue = "usage-alert-queue"
max_batch_size = 10

[[queues.consumers]]
queue = "audit-queue"
max_batch_size = 10
max_retries = 3

[limits]
cpu_ms = 50

[[routes]]
pattern = "/api/v1/usage/*"
zone_name = "${CLOUDFLARE_ZONE_NAME}"
