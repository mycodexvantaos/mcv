# ═══════════════════════════════════════════════════════════════════
# MyCodeXvantaOS — Workspace Service Worker
# Level 1 — depends on identity
# Runtime: Cloudflare Workers + D1 + KV
# ═══════════════════════════════════════════════════════════════════
name = "mycodexvantaos-workspace"
main = "../../services/workspace/src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SERVICE_NAME = "workspace"
SERVICE_VERSION = "1.0.0-constitution"
ENVIRONMENT = "production"
LOG_LEVEL = "info"

[[d1_databases]]
binding = "DB"
database_name = "mycodexvantaos-platform"
database_id = "${CLOUDFLARE_D1_DATABASE_ID}"

[[kv_namespaces]]
binding = "KV"
id = "${CLOUDFLARE_KV_WORKSPACE_ID}"

# Service bindings (hard dependency)
[[services]]
binding = "IDENTITY"
service = "mycodexvantaos-identity"

[[queues.consumers]]
queue = "audit-queue"
max_batch_size = 10
max_retries = 3

[limits]
cpu_ms = 50

[[routes]]
pattern = "/api/v1/workspaces/*"
zone_name = "${CLOUDFLARE_ZONE_NAME}"
