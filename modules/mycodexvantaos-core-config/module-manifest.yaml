apiVersion: mycodexvantaos.org/v1
kind: Module
metadata:
  name: mycodexvantaos-core-config
  labels:
    mycodexvantaos.org/domain: core
    mycodexvantaos.org/managed-by: naming-spec-v1
spec:
  domain: core
  capabilities:
  - database
  - cache
  - secrets
  providers:
    database: database-postgres
    cache: cache-redis
    secrets: secrets-vault
  lifecycle:
    stage: stable
    since: v1.0.0
  urn: urn:mycodexvantaos:manifest:service:mycodexvantaos-core-config
  packageName: '@mycodexvantaos/core-config'
  description: Centralized configuration management service.
service-id: mycodexvantaos-core-config
