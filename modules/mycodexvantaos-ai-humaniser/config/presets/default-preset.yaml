apiVersion: mycodexvantaos.org/v1
kind: HumaniserPreset
metadata:
  name: default
  description: Default Humaniser configuration preset
spec:
  mode: auto
  detection:
    threshold: 0.65
    min_sentence_length: 3
    sensitivity: normal
  rewrite:
    default_style: neutral
    preserve_technical_terms: true
    default_formality: semi-formal
    max_iterations: 3
  caching:
    enabled: true
    ttl_seconds: 300
  limits:
    max_text_length: 100000
    max_file_size_mb: 10
    rate_limit_per_minute: 30
