apiVersion: mycodexvantaos.org/v1
kind: Module
metadata:
  name: mycodexvantaos-ai-humaniser
  labels:
    mycodexvantaos.org/domain: ai
    mycodexvantaos.org/managed-by: naming-spec-v1
spec:
  domain: ai
  capabilities:
  - llm
  - embedding
  - validation
  - observability
  providers:
    llm: llm-openai
    embedding: embedding-openai
    validation: validation-zod
    observability: observability-opentelemetry
  lifecycle:
    stage: stable
    since: v1.0.0
  urn: urn:mycodexvantaos:manifest:service:mycodexvantaos-ai-humaniser
  packageName: '@mycodexvantaos/ai-humaniser'
  description: AI content detection and humanisation engine. Detects AI-generated
    text, provides confidence scoring, and rewrites flagged content to sound more
    natural.
service-id: mycodexvantaos-ai-humaniser
